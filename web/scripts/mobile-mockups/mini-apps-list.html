<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Mini Apps - Apps Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: #0F0F0F;
    color: #E8E8E8;
    width: 390px;
    min-height: 844px;
    -webkit-font-smoothing: antialiased;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 8px; font-size: 15px; font-weight: 600;
  }
  .status-bar .time { font-weight: 700; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: #E8E8E8; }

  .nav-header {
    display: flex; align-items: center; padding: 8px 16px 12px; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08); background: #161616;
  }
  .nav-back { display: flex; align-items: center; color: #6DB3F8; font-size: 16px; font-weight: 500; }
  .nav-back svg { width: 22px; height: 22px; fill: #6DB3F8; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; margin-right: 48px; }

  .list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: #1A1A1A; border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .row-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(109,179,248,0.12);
    display: flex; align-items: center; justify-content: center;
  }
  .row-icon svg { width: 20px; height: 20px; fill: #6DB3F8; }
  .row-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row-name { font-size: 15px; font-weight: 600; color: #E8E8E8; }
  .row-meta { font-size: 12px; color: #A0A0A0; }
  .chevron { width: 18px; height: 18px; fill: #A0A0A0; }

  .home-indicator {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="nav-header">
    <div class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="nav-title">Apps</div>
  </div>

  <div class="list">
    <div class="row">
      <div class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
      <div class="row-text">
        <div class="row-name">Product Photo Captions</div>
        <div class="row-meta">1 operation · 2h ago</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </div>

    <div class="row">
      <div class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
      <div class="row-text">

    </div>

    <div class="row">
      <div class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
      <div class="row-text">
        <div class="row-name">Meeting Notes Summarizer</div>
        <div class="row-meta">1 operation · 3 days ago</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </div>

    <div class="row">
      <div class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
      <div class="row-text">
        <div class="row-name">Recipe Translator</div>
        <div class="row-meta">2 operations · last week</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </div>

    <div class="row">
      <div class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg></div>
      <div class="row-text">
        <div class="row-name">Storyboard Assistant</div>
        <div class="row-meta">3 operations · last week</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
