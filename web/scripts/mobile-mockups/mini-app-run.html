<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Mini App - Running</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: #0F0F0F;
    color: #E8E8E8;
    width: 390px;
    min-height: 844px;
    -webkit-font-smoothing: antialiased;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 8px; font-size: 15px; font-weight: 600;
  }
  .status-bar .time { font-weight: 700; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: #E8E8E8; }

  .nav-header {
    display: flex; align-items: center; padding: 8px 16px 12px; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08); background: #161616;
  }
  .nav-back { display: flex; align-items: center; color: #6DB3F8; font-size: 16px; font-weight: 500; }
  .nav-back svg { width: 22px; height: 22px; fill: #6DB3F8; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; margin-right: 48px; }

  .app { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 15px; font-weight: 600; color: #E8E8E8; }
  .hint { font-size: 12px; color: #707070; }

  .input {
    background: #252525; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #E8E8E8;
    line-height: 21px;
  }
  .input.multiline { min-height: 84px; }

  .picker {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: #1A1A1A; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
  }
  .thumb {
    width: 56px; height: 56px; border-radius: 10px;
    background: linear-gradient(135deg, #3C6E8F 0%, #7A5C9E 60%, #C58A6B 100%);
  }
  .picker-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .picker-name { font-size: 14px; font-weight: 600; }
  .picker-btn {
    padding: 8px 14px; border-radius: 10px; background: rgba(109,179,248,0.12);
    color: #6DB3F8; font-size: 14px; font-weight: 600;
  }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .track {
    flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15);
    position: relative;
  }
  .track-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; border-radius: 2px; background: #6DB3F8; }
  .knob {
    position: absolute; left: 62%; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; border-radius: 10px; background: #6DB3F8;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .slider-value { font-size: 14px; font-weight: 600; color: #A0A0A0; min-width: 28px; text-align: right; }

  .select {
    display: flex; align-items: center; justify-content: space-between;
    background: #252525; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 12px 14px; font-size: 15px;
  }
  .select svg { width: 18px; height: 18px; fill: #A0A0A0; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 0;
  }
  .switch {
    width: 51px; height: 31px; border-radius: 16px; background: #6DB3F8;
    position: relative;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 27px; height: 27px; border-radius: 14px; background: #fff;
  }

  .button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #6DB3F8; border: 1px solid #6DB3F8; border-radius: 12px;
    padding: 14px; font-size: 16px; font-weight: 700; color: #fff;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 9px;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    transform: rotate(120deg);
  }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-label { font-size: 15px; font-weight: 600; color: #A0A0A0; }
  .progress-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .progress-fill { height: 100%; width: 45%; background: #6DB3F8; }

  .home-indicator {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="nav-header">
    <div class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="nav-title">Poster Studio</div>
  </div>

  <div class="app">
    <div class="app-title">Poster Studio</div>

    <div class="field">
      <div class="label">Source photo</div>
      <div class="picker">
        <div class="thumb"></div>
        <div class="picker-text">
          <div class="picker-name">IMG_4821.jpg</div>
          <div class="hint">Uploaded to the server</div>
        </div>
        <div class="picker-btn">Change</div>
      </div>
    </div>

    <div class="field">
      <div class="label">Prompt</div>
      <div class="input multiline">A minimal travel poster, flat colors, thick sans-serif title, late afternoon light</div>
    </div>

    <div class="field">
      <div class="label">Style strength</div>
      <div class="slider-row">
        <div class="track">
          <div class="track-fill"></div>
          <div class="knob"></div>
        </div>
        <div class="slider-value">0.62</div>
      </div>
    </div>

    <div class="field">
      <div class="label">Aspect ratio</div>
      <div class="select">
        <span>Portrait 2:3</span>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
    </div>

    <div class="switch-row">
      <div class="label">Keep the original colors</div>
      <div class="switch"></div>
    </div>

    <div class="button">
      <div class="spinner"></div>
      Make the poster
    </div>

    <div class="progress">
      <div class="progress-label">Rendering image · step 12/24</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
