# Pages that moved, mapped to the page that replaced them. Each entry becomes a
# redirect stub (see _plugins/search_coverage.rb). Add an entry only when the
# old page has a real successor: the same node under a new namespace, or the
# task page that now documents it. A removed node with no replacement should
# keep returning 404 rather than redirect to an unrelated page.
