# Site settings
title: NodeTool Documentation
description: >-
  Local-first visual environment for building and running AI workflows.
  Build agents visually, deploy anywhere, privacy by design.
baseurl: "" # the subpath of your site, e.g. /docs
url: "https://docs.nodetool.ai" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
# Using custom theme - no remote theme

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  # Note: Mermaid is handled by the local _plugins/mermaid.rb tag (the gem
  # double-loaded the script). The CDN URL lives under `mermaid.src` below.

# Social / SEO defaults (consumed by jekyll-seo-tag)
logo: /assets/logo.png
twitter:
  card: summary_large_image
social:
  name: NodeTool
  links:
    - https://github.com/nodetool-ai/nodetool
    - https://discord.gg/WmQTWZRcYE

# Default Open Graph / Twitter card image for every page. jekyll-seo-tag only
# reads a *page-level* `image`, so we set one site-wide via front-matter
# defaults; individual pages can override with their own `image:`.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/home.png
      # Explicit front-matter (layout: home / layout: redirect / layout: page)
      # always wins over this default. Pages that ship with no front matter at
      # all (e.g. generated via jekyll-optional-front-matter) still need the
      # "page" layout to get the sidebar, header/footer, and the "Edit this
      # page on GitHub" link in _layouts/page.html.
      layout: page
  # Node reference pages are pure generated Markdown. Some node descriptions
  # legitimately contain `{{ variable }}` / `{% ... %}` template syntax, which
  # Jekyll would otherwise try to parse as Liquid (and warn/err on). They need
  # no Liquid, so turn it off for the whole tree.
  - scope:
      path: "nodes"
    values:
      render_with_liquid: false
  # Internal engineering documents — PRDs, technical designs, implementation
  # plans, audits, and the SEO strategy itself. The 2026-08-10 Search Console
  # audit found 32 of them indexed, taking 306 impressions at zero clicks while
  # diluting the docs domain's 0.38% CTR (docs/SEO_STRATEGY.md § 0.10,
  # finding 7). `noindex` keeps them out of search; `sitemap: false` drops them
  # from sitemap.xml.
  #
  # Why noindex here and `exclude:` further down for the other internal docs:
  # excluding a page unpublishes it, which breaks every link pointing at it —
  # and these are cross-linked from published pages and from AGENTS.md, so
  # Docs CI's html-proofer step would fail. The ones under `exclude:` have no
  # such inbound links. Prefer `exclude:` when a doc is genuinely unreferenced;
  # use this list when it must stay reachable. Do not add a path to both — an
  # excluded page never becomes a page object, so its defaults never apply.
  #
  # Add a new plan/PRD/design/audit doc here in the same PR that adds the doc.
  # Anything a *user* would search for belongs in the indexed set instead.
  - scope:
      path: "plans"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "sdk"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: "KERNEL_PARITY_GAPS.md"
    values: &noindex
      noindex: true
      sitemap: false
  - scope: { path: "KERNEL_RUNNER_ANALYSIS.md" }
    values: *noindex
  - scope: { path: "RELIABILITY_ARCHITECTURE.md" }
    values: *noindex
  - scope: { path: "RELIABILITY_TASKS.md" }
    values: *noindex
  - scope: { path: "SEO_PROGRAMMATIC.md" }
    values: *noindex
  - scope: { path: "SEO_STRATEGY.md" }
    values: *noindex
  - scope: { path: "url-egress-inventory.md" }
    values: *noindex
  - scope: { path: "agent-resource-links-design.md" }
    values: *noindex
  - scope: { path: "codeact-design.md" }
    values: *noindex
  - scope: { path: "mini-app-build-harness-design.md" }
    values: *noindex
  - scope: { path: "mini-app-build-harness-implementation-plan.md" }
    values: *noindex
  - scope: { path: "mini-app-build-harness-prd.md" }
    values: *noindex
  - scope: { path: "multiplayer-design.md" }
    values: *noindex
  - scope: { path: "multiplayer-implementation-plan.md" }
    values: *noindex
  - scope: { path: "sandbox-package-design.md" }
    values: *noindex
  - scope: { path: "timeline-editor-performance-audit.md" }
    values: *noindex
  - scope: { path: "triggers-design.md" }
    values: *noindex
  - scope: { path: "triggers-implementation-plan.md" }
    values: *noindex
  - scope: { path: "triggers-prd.md" }
    values: *noindex
  - scope: { path: "workflow-supervisor-design.md" }
    values: *noindex
  - scope: { path: "workflow-supervisor-implementation-plan.md" }
    values: *noindex
  - scope: { path: "workflow-supervisor-prd.md" }
    values: *noindex
  - scope: { path: "workflow-supervisor-provider-retry-audit.md" }
    values: *noindex
  - scope: { path: "app-builder-assistant-harness-integration.md" }
    values: *noindex
  - scope: { path: "developer/node-editor-performance-audit.md" }
    values: *noindex
  - scope: { path: "rfc-generation-events.md" }
    values: *noindex

# Plugin settings
relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: false

readme_index:
  enabled: true
  remove_originals: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

# Navigation: the single source of truth is _includes/sidebar.html.
# The custom theme does not use Jekyll's Minima-only `header_pages`, and
# jekyll-sitemap already includes every page, so no mirrored list is kept here
# (it only drifted out of sync with the sidebar).

# Collections (optional, for organizing docs)
# collections:
#   guides:
#     output: true
#     permalink: /:collection/:name

# Exclude from processing
exclude:
  # Build tooling
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  # Contributor / engineering docs — kept in the repo (referenced by AGENTS.md),
  # but NOT published to docs.nodetool.ai. These are not user-facing.
  - README.md
  - AGENTS.md
  - BRAND.md
  - DESIGN.md
  - DEVELOPMENT_STANDARDS.md
  - WRITING_STYLE.md
  - THEME.md
  - CLOUD_NODE_CURATION.md
  - CODE_NODE_COVERAGE.md
  - COMPONENT_STREAMLINE_PLAN.md
  - runtime-package-interface.md
  # Internal product/design specs (PRDs, drafts) — not for the public site.
  - STUDIO_PRD.md
  - STUDIO_MVP_PROMPT.md
  - image-editor-prd.md
  - timeline-editor-prd.md
  - correlation-design.md
  # Internal implementation plans & specs (agentic-worker instructions).
  - COMPONENT_STREAMLINE_PLAN.md
  - superpowers/

# Custom theme settings
# Using custom futuristic dark theme located in _layouts, _includes, and assets

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

mermaid:
  src: https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js
