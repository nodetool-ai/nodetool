---
layout: default
---
<div class="home-page">
  {{ content }}
</div>

<style>
.home-page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--spacing-2xl) var(--spacing-lg);
}

.home-page > :first-child {
  margin-top: 0;
}

.hero-section {
  text-align: center;
  padding: var(--spacing-3xl) 0;
  margin-bottom: var(--spacing-3xl);
  position: relative;
}

.hero-title {
  font-size: 3.5rem;
  font-family: var(--font-heading);
  color: var(--color-text-primary);
  margin-bottom: var(--spacing-md);
}

.hero-subtitle {
  font-size: 1.3rem;
  color: var(--color-text-secondary);
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
}

.home-content {
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: var(--spacing-2xl);
  box-shadow: 0 4px 20px rgba(75, 150, 210, 0.08);
}

.home-content h2 {
  margin-top: 0;
}


.home-block {
  margin: var(--spacing-3xl, 4rem) 0;
}

.section-kicker {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 var(--spacing-sm);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--color-accent-magenta);
}

.section-kicker::before {
  content: "";
  width: 2rem;
  height: 1px;
  background: currentColor;
  opacity: 0.6;
}

.home-block h2 {
  margin: 0 0 var(--spacing-md);
  font-size: clamp(1.75rem, 3.5vw, 2.5rem);
  letter-spacing: -0.02em;
  line-height: 1.15;
  border: none;
  padding: 0;
}

.home-block h2::after {
  content: none;
}

.section-lead {
  max-width: 44rem;
  margin: 0 0 var(--spacing-xl);
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.section-note {
  margin-top: var(--spacing-lg);
  color: var(--color-text-muted);
}

.media-frame {
  margin: 0;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--color-bg-tertiary);
}

.media-frame video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-reel {
  margin: var(--spacing-xl) 0 var(--spacing-lg);
}

.hero-reel .media-frame {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(61, 104, 168, 0.15);
}

.hero-reel figcaption {
  margin-top: var(--spacing-sm);
  text-align: center;
  font-size: 0.9rem;
  color: var(--color-text-muted);
}

.agent-media {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  margin-bottom: var(--spacing-xl);
}

.agent-steps {
  counter-reset: agent-steps;
  list-style: none;
  margin: 0 0 var(--spacing-lg);
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--spacing-lg);
}

.agent-steps li {
  position: relative;
  padding-left: 2.75rem;
}

.agent-steps li::before {
  counter-increment: agent-steps;
  content: counter(agent-steps);
  position: absolute;
  left: 0;
  top: 0;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 50%;
  border: 1px solid var(--color-border-glow);
  background: var(--color-bg-tertiary);
  color: var(--color-accent-cyan);
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.agent-steps strong {
  display: block;
  color: var(--color-text-primary);
}

.agent-steps span {
  color: var(--color-text-muted);
  font-size: 0.95rem;
}

.agent-links {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-lg);
  margin: 0;
}

.surface-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--spacing-lg);
}

.surface-card {
  grid-column: span 2;
}

.surface-card,
.recipe-card {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--color-border);
  border-radius: 12px;
  background: var(--color-bg-secondary);
  overflow: hidden;
  transition: border-color var(--transition-fast), transform var(--transition-fast);
}

.surface-card.wide {
  grid-column: span 3;
}

.surface-card.full {
  grid-column: 1 / -1;
}

.surface-body,
.recipe-body {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  padding: var(--spacing-lg);
}

.surface-body h3,
.recipe-body h3 {
  margin: 0;
  font-size: 1.1rem;
}

.surface-body p,
.recipe-body p {
  margin: 0;
  color: var(--color-text-muted);
  font-size: 0.95rem;
  line-height: 1.5;
}

.surface-body a {
  margin-top: auto;
  font-size: 0.95rem;
}

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--spacing-lg);
}

.recipe-card {
  color: inherit;
  text-decoration: none;
}

.recipe-grid.ads {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.recipe-grid.films {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.recipe-grid.ads .media-frame {
  aspect-ratio: 9 / 16;
}

.recipe-grid.ads .recipe-body {
  padding: var(--spacing-md);
}

.example-heading {
  margin: var(--spacing-xl) 0 var(--spacing-xs);
  font-size: 1.25rem;
}

.example-lead {
  margin: 0 0 var(--spacing-lg);
  color: var(--color-text-muted);
}

.recipe-card:hover,
.surface-card:hover {
  border-color: var(--color-border-glow);
}

.recipe-card:hover {
  transform: translateY(-3px);
}

.recipe-card:focus-visible {
  outline: 2px solid var(--color-accent-cyan);
  outline-offset: 2px;
}

@media (max-width: 768px) {
  .agent-steps,
  .surface-grid,
  .recipe-grid {
    grid-template-columns: 1fr;
  }

  .surface-card,
  .surface-card.wide {
    grid-column: auto;
  }

  .recipe-grid.ads {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .recipe-grid.films {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 769px) and (max-width: 1024px) {
  .recipe-grid.ads {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .recipe-grid.films {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (prefers-reduced-motion: reduce) {
  .recipe-card:hover {
    transform: none;
  }
}

@media (max-width: 768px) {
  .home-page {
    padding: var(--spacing-xl) 0;
  }

  .hero-title {
    font-size: 2.5rem;
  }

  .hero-subtitle {
    font-size: 1.1rem;
  }

  .home-content {
    padding: var(--spacing-lg);
  }
}
</style>

<script>
  // Loops play only while on screen, so the page loads one video at a time.
  (function () {
    var videos = document.querySelectorAll(".inview-video");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) {
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.play().catch(function () {});
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: 0.35 });
    videos.forEach(function (video) {
      observer.observe(video);
    });
  })();
</script>
