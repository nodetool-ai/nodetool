<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="#050810" />
  <ellipse cx="1000" cy="120" rx="480" ry="300" fill="url(#glowA)" />
  <text x="96" y="96" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="40" font-weight="600" fill="#f8fafc" text-anchor="start">Call a node like a function</text>
  <text x="96" y="140" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#94a3b8" text-anchor="start">Await is the edge. A variable is the wire. Promise.all is the fan-out.</text>
  <rect x="64" y="190" width="1072" height="250" rx="18" fill="#080d1a" stroke="#334155" stroke-width="1" />
  <text x="96" y="262" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve">import </text>
  <text x="184.2" y="262" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#fcd34d" xml:space="preserve">"@nodetool-ai/sandbox-nodetool/flow"</text>
  <text x="637.8" y="262" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#94a3b8" xml:space="preserve">;</text>
  <text x="96" y="302" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve">import </text>
  <text x="184.2" y="302" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#f8fafc" xml:space="preserve">{ concat }</text>
  <text x="310.2" y="302" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve"> from </text>
  <text x="385.8" y="302" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#fcd34d" xml:space="preserve">"@nodetool-ai/sandbox-flow/nodetool.text"</text>
  <text x="902.4" y="302" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#94a3b8" xml:space="preserve">;</text>
  <text x="96" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve">const </text>
  <text x="171.6" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#f8fafc" xml:space="preserve">joined</text>
  <text x="247.2" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#94a3b8" xml:space="preserve"> = </text>
  <text x="285" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve">await </text>
  <text x="360.59999999999997" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#38bdf8" xml:space="preserve">concat</text>
  <text x="436.2" y="382" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#94a3b8" xml:space="preserve">({ a: inputs.left, b: inputs.right });</text>
  <text x="96" y="422" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#e879f9" xml:space="preserve">await </text>
  <text x="171.6" y="422" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#38bdf8" xml:space="preserve">output</text>
  <text x="247.2" y="422" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="21" fill="#94a3b8" xml:space="preserve">("joined", joined.output);</text>
  <text x="96" y="506" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">424 nodes across 68 namespaces, generated as typed async functions.</text>
  <text x="96" y="546" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">Streaming nodes carry .stream(inputs). Errors reject; try/catch is the supervisor.</text>
  <text x="96" y="586" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">Every call passes the permission gate and bills through the run.</text>
  <text x="96" y="634" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">@nodetool-ai/sandbox-flow</text>
</svg>
