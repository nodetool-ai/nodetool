# Native QML inventory and reviewed domain-only exceptions.
version = 1

# qml_callers enumerates static references in inventoried native QML only; dynamic C++/Loader mounts are excluded.
# test_scope distinguishes direct interaction coverage from build/import coverage.

[[file]]
path = "native/chat/qml/ChatComposer.qml"
category = "chrome"
controls = ["Ui.Surface", "ScrollView", "Ui.TextArea", "Ui.Text", "Ui.Progress", "Ui.EditorButton", "Ui.ToolbarIconButton", "FileDialog"]
signals = []
test_host = "node native/chat/scripts/check.mjs"
test_scope = "interaction"
qml_callers = ["native/chat/qml/ConversationView.qml"]
replacement = "NodeTool.UiPrimitives: Ui.Surface, Ui.TextArea, Ui.Text, Ui.Progress, Ui.EditorButton, Ui.ToolbarIconButton"

[[file]]
