controls = ["Ui.Surface", "ScrollView", "Ui.TextArea", "Ui.Text", "Ui.Progress", "Ui.EditorButton", "Ui.ToolbarIconButton", "FileDialog"]
signals = []
test_host = "node native/chat/scripts/check.mjs"
