<title>Music Mode Clips</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: native editor shell. Header with transport and tools, track lanes on a bar ruler on the left, music panel on the right. Phone stacks the panel under the lanes. */
:root {
  --canvas: #f5f5f6; --panel: #ffffff; --overlay: #f2f2f4; --input: #f9f9f9;
  --fg: #18181b; --fg2: #5b5b66; --fg3: #a1a1aa; --on-accent: #ffffff;
  --line: #e4e4e7; --ctl-line: #dcdce1; --strong: #5b5b66;
  --accent: #2f62c4; --accent-h: #244e9e; --accent-soft: rgba(47,98,196,.12);
  --warn: #dc6803; --warn-bg: #fff1d6; --warn-fg: #825100;
  --err: #d92d20; --err-bg: #ffebeb; --err-fg: #b42323; --ok: #16a34a;
  --hover: rgba(24,24,27,.04); --pressed: rgba(24,24,27,.10); --sel: rgba(24,24,27,.07);
  --lane: #fafafb; --lane-alt: #f3f3f5; --grid: rgba(24,24,27,.06); --grid-bar: rgba(24,24,27,.14);
  --range: rgba(47,98,196,.16); --range-edge: #2f62c4;
  --c-drums: #c2410c; --c-bass: #7c3aed; --c-keyboard: #0f766e; --c-guitar: #b45309; --c-other: #475569;
  --clip-bg: .14;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #08090a; --panel: #101113; --overlay: #17181b; --input: #17181a;
  --fg: #f7f8f8; --fg2: #8a8f98; --fg3: #686969;
  --line: #232426; --ctl-line: #27292e; --strong: #8a8f98;
  --accent: #3d68a8; --accent-h: #2a4d80; --accent-soft: rgba(61,104,168,.22);
  --warn: #ffb86c; --warn-bg: #3d2b10; --warn-fg: #ffd08a;
  --err: #ff5555; --err-bg: #441d21; --err-fg: #ffb3b3; --ok: #50fa7b;
  --hover: rgba(255,255,255,.02); --pressed: rgba(255,255,255,.08); --sel: rgba(255,255,255,.05);
  --lane: #0c0d0f; --lane-alt: #111215; --grid: rgba(255,255,255,.04); --grid-bar: rgba(255,255,255,.10);
  --range: rgba(91,140,214,.20); --range-edge: #6f9be0;
  --c-drums: #fb923c; --c-bass: #a78bfa; --c-keyboard: #2dd4bf; --c-guitar: #fbbf24; --c-other: #94a3b8;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #08090a; --panel: #101113; --overlay: #17181b; --input: #17181a;
  --fg: #f7f8f8; --fg2: #8a8f98; --fg3: #686969;
  --line: #232426; --ctl-line: #27292e; --strong: #8a8f98;
  --accent: #3d68a8; --accent-h: #2a4d80; --accent-soft: rgba(61,104,168,.22);
  --warn: #ffb86c; --warn-bg: #3d2b10; --warn-fg: #ffd08a;
  --err: #ff5555; --err-bg: #441d21; --err-fg: #ffb3b3; --ok: #50fa7b;
  --hover: rgba(255,255,255,.02); --pressed: rgba(255,255,255,.08); --sel: rgba(255,255,255,.05);
  --lane: #0c0d0f; --lane-alt: #111215; --grid: rgba(255,255,255,.04); --grid-bar: rgba(255,255,255,.10);
  --range: rgba(91,140,214,.20); --range-edge: #6f9be0;
  --c-drums: #fb923c; --c-bass: #a78bfa; --c-keyboard: #2dd4bf; --c-guitar: #fbbf24; --c-other: #94a3b8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--fg); font: 400 13px/1.35 var(--sans); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; min-height: 560px; }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.proj { display: flex; flex-direction: column; min-width: 0; }
.proj b { font-weight: 600; font-size: 15px; }
.proj span { color: var(--fg2); font-size: 11px; }
.group { display: flex; align-items: center; gap: 4px; }
.sep { width: 1px; height: 24px; background: var(--line); }
.btn {
  height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ctl-line);
  background: var(--overlay); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--pressed); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.btn:disabled { color: var(--fg3); cursor: not-allowed; background: var(--overlay); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.primary:hover { background: var(--accent-h); }
.btn.primary:disabled { background: var(--overlay); border-color: var(--ctl-line); color: var(--fg3); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--pressed); }
.btn svg { width: 14px; height: 14px; flex: none; }
kbd { font: 500 10px var(--mono); color: var(--fg2); border: 1px solid var(--ctl-line); border-radius: 3px; padding: 0 3px; }
.tempo { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--input); border: 1px solid var(--ctl-line); color: var(--fg2); }
.tempo b { color: var(--fg); font-weight: 500; }
.tempo svg { width: 12px; height: 12px; }
select.sel { height: 28px; border-radius: 6px; border: 1px solid var(--ctl-line); background: var(--input); padding: 0 6px; }
.pos { font: 500 13px var(--mono); min-width: 64px; text-align: right; color: var(--fg); }
.spacer { flex: 1; }

.try {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--canvas); border-bottom: 1px solid var(--line); color: var(--fg2); font-size: 12px;
}
.try .btn { height: 24px; font-size: 12px; padding: 0 8px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.tlwrap { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.tl { overflow: auto; flex: 1; position: relative; background: var(--lane); }
.tl-inner { position: relative; }
.row { display: flex; }
.th {
  position: sticky; left: 0; z-index: 3; width: 168px; flex: none;
  background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 8px 8px 8px 12px; display: flex; flex-direction: column; gap: 6px; justify-content: center;
}
.th .name { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.th .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.th .ctl { display: flex; align-items: center; gap: 4px; min-width: 0; }
.chip { height: 20px; border-radius: 10px; padding: 0 8px; font-size: 11px; border: 1px solid var(--ctl-line); background: var(--input); display: inline-flex; align-items: center; }
select.chip { padding: 0 4px 0 8px; }
.ms { width: 22px; height: 20px; border-radius: 4px; border: 1px solid var(--ctl-line); background: var(--overlay); font: 600 10px var(--mono); padding: 0; }
.ms[aria-pressed="true"].m { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn); }
.ms[aria-pressed="true"].s { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.ruler-row .th { height: 48px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--fg2); }
.ruler { position: relative; height: 48px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.ruler .bar { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid-bar); }
.ruler .bar span { position: absolute; left: 4px; top: 3px; font: 500 11px var(--mono); color: var(--fg2); }
.ruler .beat { position: absolute; top: 0; height: 6px; border-left: 1px solid var(--grid-bar); }
.ruler .loop { position: absolute; top: 18px; height: 6px; background: var(--accent); border-radius: 2px; opacity: .8; }
.ruler .ctx { position: absolute; bottom: 3px; height: 8px; border: 1px dashed var(--strong); border-top: none; }
.ruler .ctx span { position: absolute; left: 4px; top: -13px; font-size: 10px; color: var(--fg2); white-space: nowrap; }
.lane { position: relative; height: 88px; flex: none; border-bottom: 1px solid var(--line); touch-action: none; }
.lane.alt { background: var(--lane-alt); }
.lane .g { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); }
.lane .g.b { border-left-color: var(--grid-bar); }
.lane.range-tool { cursor: text; }

.clip {
  position: absolute; top: 6px; bottom: 6px; border-radius: 5px; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--cc) 70%, transparent);
  background: color-mix(in srgb, var(--cc) 16%, var(--lane));
}
.clip.selected { box-shadow: 0 0 0 2px var(--fg); }
.clip canvas { position: absolute; left: 0; right: 0; bottom: 0; top: 16px; width: 100%; height: calc(100% - 16px); }
.clip .lbl { position: absolute; left: 6px; right: 6px; top: 1px; height: 15px; display: flex; gap: 6px; align-items: center; font-size: 11px; white-space: nowrap; overflow: hidden; color: var(--fg); }
.clip .lbl .t { overflow: hidden; text-overflow: ellipsis; }
.badge { font: 600 10px var(--mono); padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--cc) 30%, var(--panel)); flex: none; }
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
.clip.pending { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--cc) 14%, var(--lane)) 0 8px, color-mix(in srgb, var(--cc) 26%, var(--lane)) 8px 16px); border-style: dashed; }
.clip.pending .state { position: absolute; left: 6px; bottom: 6px; font: 500 11px var(--mono); color: var(--fg2); }
.clip.failed { border-color: var(--err); }
.hatch { position: absolute; top: 16px; bottom: 0; background: repeating-linear-gradient(135deg, rgba(127,127,127,.0) 0 5px, color-mix(in srgb, var(--fg) 22%, transparent) 5px 7px); border-left: 1px dashed var(--fg2); border-right: 1px dashed var(--fg2); pointer-events: none; }
.hatch span { position: absolute; left: 4px; top: 2px; font: 500 10px var(--mono); color: var(--fg); background: var(--panel); padding: 0 3px; border-radius: 2px; }
.splice { position: absolute; top: 16px; bottom: 0; border-left: 1px solid var(--fg2); border-right: 1px solid var(--fg2); background: color-mix(in srgb, var(--fg) 6%, transparent); pointer-events: none; }
.selband { position: absolute; top: 0; bottom: 0; background: var(--range); border-left: 2px solid var(--range-edge); border-right: 2px solid var(--range-edge); pointer-events: none; z-index: 2; }
.selband span { position: absolute; top: 2px; font: 600 10px var(--mono); color: var(--on-accent); background: var(--range-edge); padding: 0 4px; border-radius: 2px; }
.selband .a { left: -2px; border-top-left-radius: 0; }
.selband .z { right: -2px; border-top-right-radius: 0; }
.playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--err); z-index: 4; pointer-events: none; }
.hint { padding: 8px 16px; color: var(--fg2); font-size: 11px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 4px 14px; }

aside.panel { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; min-height: 0; }
.sec { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.sec h3 .n { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.target { display: flex; flex-direction: column; gap: 2px; }
.target b { font-size: 15px; font-weight: 600; }
.target .mono { color: var(--fg2); font-size: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ctl-line); border-radius: 6px; overflow: hidden; }
.seg button { height: 32px; border: none; background: var(--input); border-right: 1px solid var(--ctl-line); font-size: 12px; position: relative; }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.seg button:disabled { color: var(--fg3); cursor: not-allowed; }
.seg button .auto { position: absolute; top: 3px; right: 4px; font: 600 8px var(--mono); color: var(--fg2); letter-spacing: .04em; }
.why { color: var(--fg2); font-size: 12px; }
.why.err { color: var(--err-fg); background: var(--err-bg); padding: 6px 8px; border-radius: 6px; }
.plan { font: 400 11px/1.5 var(--mono); color: var(--fg2); background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.plan b { color: var(--fg); font-weight: 500; }
textarea { width: 100%; min-height: 64px; resize: vertical; border-radius: 6px; border: 1px solid var(--ctl-line); background: var(--input); padding: 8px; line-height: 1.45; }
.recent { display: flex; flex-wrap: wrap; gap: 4px; }
.recent button { font-size: 11px; height: 22px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 11px; border: 1px solid var(--ctl-line); background: transparent; padding: 0 8px; color: var(--fg2); }
.recent button:hover { color: var(--fg); background: var(--pressed); }
.opts { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
.opts label { color: var(--fg2); font-size: 12px; }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--ctl-line); border-radius: 6px; overflow: hidden; width: max-content; }
.stepper button { width: 26px; height: 26px; border: none; background: var(--overlay); }
.stepper span { width: 28px; text-align: center; font: 500 12px var(--mono); }
.seedrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.seedrow input[type=text] { width: 90px; height: 26px; border-radius: 6px; border: 1px solid var(--ctl-line); background: var(--input); padding: 0 6px; font: 400 12px var(--mono); }
.seedrow input:disabled { color: var(--fg3); }
.opts select { height: 26px; border-radius: 6px; border: 1px solid var(--ctl-line); background: var(--input); padding: 0 4px; font: 400 12px var(--mono); max-width: 100%; }
.go { height: 36px; width: 100%; justify-content: center; font-size: 13px; }

.jobs, .takes { display: flex; flex-direction: column; gap: 6px; }
.empty { color: var(--fg3); font-size: 12px; }
.job { border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; background: var(--input); }
.job .l1 { display: flex; gap: 6px; align-items: center; min-width: 0; }
.job .l1 b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .st { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; background: var(--overlay); color: var(--fg2); flex: none; }
.job .st.running, .job .st.rendering, .job .st.placing { background: var(--accent-soft); color: var(--fg); }
.job .st.done { color: var(--ok); }
.job .st.failed { background: var(--err-bg); color: var(--err-fg); }
.job .meta { grid-column: 1 / -1; font: 400 11px var(--mono); color: var(--fg2); }
.job .err { grid-column: 1 / -1; font: 400 11px var(--mono); color: var(--err-fg); background: var(--err-bg); padding: 4px 6px; border-radius: 4px; }
.job .acts { display: flex; gap: 4px; align-items: start; }
.job .acts .btn { height: 24px; font-size: 11px; padding: 0 8px; }
.prog { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }

.take { border: 1px solid var(--line); border-radius: 6px; background: var(--input); }
.take.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.take .hd { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 6px 6px 8px; }
.take .pick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--strong); background: transparent; padding: 0; display: grid; place-items: center; }
.take.active .pick { border-color: var(--accent); }
.take.active .pick::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.take .info { min-width: 0; cursor: pointer; }
.take .info b { font-weight: 500; }
.take .info .mono { display: block; color: var(--fg2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.take .tag { font: 500 10px var(--mono); color: var(--fg2); margin-left: 4px; }
.take .acts { display: flex; gap: 2px; align-items: center; }
.take .acts .btn { width: 24px; height: 24px; }
.drift { font: 600 10px var(--mono); padding: 1px 4px; border-radius: 3px; background: var(--warn-bg); color: var(--warn-fg); margin-left: 4px; }
.take details { border-top: 1px solid var(--line); }
.take summary { cursor: pointer; padding: 4px 8px; color: var(--fg2); font-size: 11px; }
.rec { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 4px 8px 8px; font: 400 11px var(--mono); }
.rec dt { color: var(--fg2); }
.rec dd { margin: 0; overflow-wrap: anywhere; }
.foot { padding: 12px 16px; color: var(--fg2); font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
.foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.foot label { display: flex; gap: 6px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--overlay); border: 1px solid var(--ctl-line); border-radius: 6px; padding: 8px 12px; font-size: 12px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 860px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .tl { max-height: 420px; }
  aside.panel { border-left: none; border-top: 1px solid var(--line); }
  .th { width: 124px; padding-left: 8px; }
  .th select.chip { width: 0; flex: 1; min-width: 0; }
  header.bar .sep { display: none; }
  .try .lead { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="proj"><b>Night Drive</b><span>Music project · mockup, generation is simulated</span></div>
    <div class="sep"></div>
    <div class="group">
      <div class="tempo" title="Tempo is locked because the project contains audio. Remove all audio clips to change it.">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
        <b class="mono">120</b> BPM <b class="mono">4/4</b>
      </div>
      <select class="sel" id="keySel" aria-label="Key">

    </div>
    <div class="sep"></div>
    <div class="group" role="group" aria-label="Tools">
      <button class="btn" id="toolRange" aria-pressed="true" title="Range tool (R)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3v10M14 3v10M2 8h12"/></svg>Range <kbd>R</kbd></button>
      <button class="btn" id="toolSel" aria-pressed="false" title="Selection tool (V)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2l8 6-4 1-2 4z"/></svg>Select <kbd>V</kbd></button>
      <select class="sel" id="snapSel" aria-label="Grid">
        <option value="bar">Snap: bar</option><option value="beat">Snap: beat</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="btn icon" id="redoBtn" title="Redo (Shift+Ctrl+Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="group">

<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
// ---------- constants ----------

// ---------- utils ----------
const $ = s => document.querySelector(s);

const barOf = beat => Math.floor(beat / BPB) + 1;

// ---------- fake audio content ----------
function keyInfo(k) { const [t, m] = k.split(" "); return { pc: PC[t], scale: SCALES[m] }; }

const DECAY = { drums: 1.4, percussion: 1.2, bass: 2.2, keyboard: 7, guitar: 2.6 };
const decayOf = role => DECAY[role] || 12;

// ---------- document state (undoable) ----------
let doc = {
  key: "C minor",
  tracks: [
    { id: "t1", name: "Drums", role: "drums", mute: false, solo: false },
    { id: "t2", name: "Bass", role: "bass", mute: false, solo: false },
    { id: "t3", name: "Keyboard", role: "keyboard", mute: false, solo: false },
    { id: "t4", name: "Guitar", role: "guitar", mute: false, solo: false },

const undoStack = [], redoStack = [];
function edit(label, fn) { undoStack.push(JSON.stringify(doc)); if (undoStack.length > 100) undoStack.shift(); redoStack.length = 0; fn(); render(); }

// seed the starting project
(function seedProject() {
  const d = { id: "c1", trackId: "t1", start: 0, len: 8 * BPB, status: "generated", active: 0, takes: makeGenTakes("drums", doc.promptHistory[0], 40112, 2, 8 * BPB, 2, "C minor", TURBO, 0) };

})();

// ---------- view state ----------
const view = {
  tool: "range", snap: "bar", sel: { trackId: "t3", a: 32, b: 48 }, selectedClip: null,
  op: null, prompt: "warm Rhodes chords, lo-fi, slow swing", cands: 2, seedMode: "random", seed: 48213, model: null,
  playing: false, loop: true, playBeat: 0, failNext: false,
};
let ppb = 20; // pixels per beat
let jobs = [];
const estimates = {}; // run seconds per generated second, per task+model

// ---------- queries ----------
const trackById = id => doc.tracks.find(t => t.id === id);
const clipById = id => doc.clips.find(c => c.id === id);
const anySolo = () => doc.tracks.some(t => t.solo);

const hasAudio = c => c.status === "generated" && c.takes.length > 0;
const clipsOn = (tid, a, b) => doc.clips.filter(c => c.trackId === tid && c.start < b && c.start + c.len > a);

// ---------- planner (MD12) ----------

    } else {

// ---------- timeline render ----------

}

  let h = `<div class="row ruler-row"><div class="th">Bars</div><div class="ruler" style="width:${W}px">`;

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (typing) return;
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "r" || e.key === "R") { view.tool = "range"; render(); }
  else if (e.key === "v" || e.key === "V") { view.tool = "select"; render(); }
  else if (e.key === "l" || e.key === "L") { view.loop = !view.loop; render(); }
  else if (e.key === "[" || e.key === "]") { const c = takesClip(); if (c && c.status === "generated" && c.takes.length > 1) { const n = c.takes.length; setTake(c, (c.active + (e.key === "]" ? 1 : n - 1)) % n); toast(clipById(c.id).takes[clipById(c.id).active].label); } }
  else if ((e.key === "Delete" || e.key === "Backspace") && view.selectedClip) { const id = view.selectedClip; edit("deleteClip", () => { doc.clips = doc.clips.filter(c => c.id !== id); }); view.selectedClip = null; render(); }
  else if (e.key === "Escape") { view.sel = null; view.selectedClip = null; render(); }
});
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- audio (simulated takes) ----------
let ac = null, master = null, noise = null, nextStepTime = 0, curStep = 0, schedTimer = null;
function ensureAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.45; master.connect(ac.destination);
  noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function env(t, a, dec, attack = 0.003) { const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(a, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dec); g.connect(master); return g; }
function voice(role, s, t) {
  const ki = keyInfo(doc.key);
  if (role === "drums" || role === "percussion") {
    if (s.n === 0) { const o = ac.createOscillator(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); o.connect(env(t, s.a * 0.9, 0.32)); o.start(t); o.stop(t + 0.35); }
    else { const src = ac.createBufferSource(); src.buffer = noise; const f = ac.createBiquadFilter(); f.type = s.n === 1 ? "bandpass" : "highpass"; f.frequency.value = s.n === 1 ? 1800 : 7500; src.connect(f); f.connect(env(t, s.a * (s.n === 1 ? 0.6 : 0.25), s.n === 1 ? 0.16 : 0.045)); src.start(t); src.stop(t + 0.2); }
  } else if (role === "bass") {
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz(s.n); const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420; o.connect(f); f.connect(env(t, s.a * 0.35, 0.28)); o.start(t); o.stop(t + 0.3);
  } else if (role === "keyboard") {
    for (const k of [0, 2, 4]) { const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = hz(midi(ki, s.n + k, 4)); o.connect(env(t, s.a * 0.09, 0.95, 0.01)); o.start(t); o.stop(t + 1); }
  } else if (role === "guitar") {
    const o = ac.createOscillator(); o.type = "square"; o.frequency.value = hz(s.n); const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1600; o.connect(f); f.connect(env(t, s.a * 0.08, 0.32)); o.start(t); o.stop(t + 0.35);
  } else {
    for (const det of [-6, 6]) { const o = ac.createOscillator(); o.type = "sawtooth"; o.detune.value = det; o.frequency.value = hz(midi(ki, s.n, 4)); const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1100; o.connect(f); f.connect(env(t, s.a * 0.05, 1.8, 0.08)); o.start(t); o.stop(t + 1.9); }
  }
}
function loopBounds() { return view.loop && view.sel ? [Math.round(view.sel.a * SPB), Math.round(view.sel.b * SPB)] : [0, BEATS * SPB]; }
function schedule() {
  while (nextStepTime < ac.currentTime + 0.12) {
    const [l0, l1] = loopBounds();
    if (curStep < l0 || curStep >= l1) curStep = l0;
    const beat = curStep / SPB;
    for (const tr of doc.tracks) {
      if (!audible(tr)) continue;
      const c = clipAt(tr.id, beat); if (!c || !hasAudio(c)) continue;
      const s = c.takes[c.active].steps[curStep - Math.round(c.start * SPB)];
      if (s && s.a) voice(tr.role || "synth", s, nextStepTime);
    }
    stepTimes.push([nextStepTime, curStep]);
    nextStepTime += STEP_S; curStep++;
  }
}
let stepTimes = [];
function togglePlay() {
  ensureAudio(); if (ac.state === "suspended") ac.resume();
  view.playing = !view.playing;
  if (view.playing) {
    const [l0] = loopBounds(); curStep = l0; nextStepTime = ac.currentTime + 0.05; stepTimes = [];
    schedTimer = setInterval(schedule, 25); schedule();
  } else { clearInterval(schedTimer); }
  render();
}
// ---------- frame loop: playhead, job clocks ----------
function frame() {
  if (view.playing && ac) {
    const now = ac.currentTime; while (stepTimes.length > 1 && stepTimes[1][0] <= now) stepTimes.shift();
    if (stepTimes.length) { const [t0, st] = stepTimes[0]; view.playBeat = (st + Math.max(0, Math.min(1, (now - t0) / STEP_S))) / SPB; }
    const ph = document.getElementById("playhead"); if (ph) { ph.hidden = false; ph.style.left = ((window.innerWidth <= 860 ? 124 : 168) + view.playBeat * ppb) + "px"; }
    $("#posReadout").textContent = bbs(Math.floor(view.playBeat * SPB) / SPB);
  }
  for (const j of jobs) {
    if (j.state !== "running") continue;
    const el = (performance.now() - j.runStart) / 1000, est = estimates[j.op + "|" + j.model];
    const m = panel.querySelector(`[data-jmeta="${j.id}"]`); if (m) m.textContent = est ? `${fmtClock(el)} of about ${fmtClock(est * j.genSec + 0.5)}` : `${fmtClock(el)} elapsed · no estimate yet`;
    const pr = panel.querySelector(`[data-jprog="${j.id}"]`); if (pr) pr.style.width = Math.min(100, el / (est * j.genSec) * 100) + "%";
    const cs = tlInner.querySelector(`[data-cstate="${j.clipId}"]`); if (cs) cs.textContent = `Generating ${fmtClock(el)}`;
  }

}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderTimeline); } catch (e) {}
new MutationObserver(renderTimeline).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderTimeline, 80); });
render(); requestAnimationFrame(frame);
})();
</script>
