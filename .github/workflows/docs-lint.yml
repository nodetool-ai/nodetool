name: Docs Lint

# Validates Markdown documentation and the agent instruction tree. Runs only
# when Markdown or the skill links change.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".agents/**"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".agents/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR; the latest push is what matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Markdown link check (relative links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check relative links in Markdown
        # --offline checks only on-disk (relative) link targets, so the job is
        # deterministic and never flakes on external URLs. Advisory for now
        # (fail: false) while the existing docs backlog is cleaned up; flip to
        # fail: true once the tree is green.
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: false

  # The quality gate's `deps` leg runs the same check, but the gate skips
  # every leg for a prose-only diff, which is exactly when AGENTS.md pairing,
  # reachability and the .agents/skills links can break.
  agents-docs:
    name: Agent docs (AGENTS.md pairing, skill links)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Check agent docs
        run: node scripts/check-agents-docs.mjs
