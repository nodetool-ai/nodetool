name: Packed Core CLI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/smoke-packed-cli.mjs'
      - 'scripts/packed-*.mjs'
      - 'scripts/fixtures/packed-fal-preload.mjs'
      - 'scripts/__tests__/packed-*.test.mjs'
      - 'scripts/packed-verification.mjs'
      - 'scripts/package-manager.mjs'
      - 'scripts/test-affected.mjs'
      - 'scripts/ci-plan.mjs'
      - 'scripts/run-turbo.mjs'
      - 'scripts/__tests__/packed-verification.test.mjs'
      - 'web/jest.config.ts'
      - 'scripts/__tests__/jest-worker-memory.test.mjs'
      - 'scripts/fixtures/codec-identity.mp4'
      - 'scripts/node-catalog/tiers.mjs'
      - 'scripts/prepare-publish.mjs'
      - 'scripts/publish-packages.mjs'
      - 'scripts/release/**'
      - 'scripts/__tests__/pin-catalog.test.mjs'
      - 'scripts/__tests__/publish-packages.test.mjs'
      - 'scripts/__tests__/smoke-packed-cli.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/actions/setup-build/**'
      - '.github/actions/chromium-sandbox/**'
      - 'docker/ci/**'
      - '.github/workflows/packed-core-cli.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Pull the CI image.
  packages: read

concurrency:
  group: packed-core-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The Linux image the jobs below run in (docker/ci/). Built here on the
  # first run after docker/ci/ changes, found in seconds otherwise.
  ci-image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  # A pull request into `main` also runs the Test workflow, whose Quality
  # Gate runs these same checks in parallel shards: the affected suites,
  # typecheck, lint, harness gate and backend smoke. Running them again
  # here costs a second set of runners for the same selection. Stacked pull
  # requests into other branches get no Test run, so they still verify
  # here, as do manual runs. Skipping the plan skips the verification
  # matrix that needs it.
  verification-plan:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Freeze the canonical affected selection
        id: plan
        run: node scripts/packed-verification.mjs plan "$RUNNER_TEMP/packed-verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-verification-plan
          path: ${{ runner.temp }}/packed-verification.json
          if-no-files-found: error
  verification:
    needs: [ci-image, verification-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verification-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001 --privileged
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verification-plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-verification-plan
          path: ${{ runner.temp }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Restore the frozen selection base
        run: node scripts/packed-verification.mjs prepare "$RUNNER_TEMP/packed-verification.json"
      - uses: ./.github/actions/setup-build
        with:
          cache: read-only
      - name: Install Chromium for native 3D tests
        run: npx playwright install chromium
      - name: Enable and verify the Chromium sandbox
        uses: ./.github/actions/chromium-sandbox

      - name: Install mobile check dependencies
        run: npm --prefix mobile ci
      - name: Prepare Chromium crash capture
        if: matrix.task == 'test-packages-game'
        run: |
          crash_dir="$RUNNER_TEMP/chromium-crashes"
          mkdir -p "$crash_dir/cores" "$crash_dir/upload"
          echo "Original kernel.core_pattern:"
          cat /proc/sys/kernel/core_pattern | tee "$crash_dir/core_pattern"
          systemctl status systemd-coredump.socket apport.service --no-pager || true
          dpkg-query -W systemd-coredump apport gdb || true
          sudo sysctl -w "kernel.core_pattern=$crash_dir/cores/core.%e.%p.%t"
          find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -executable \
            -exec sh -c '"$1" --version; sha256sum "$1"' sh {} \;
          if [[ -v DBUS_SESSION_BUS_ADDRESS ]]; then
            echo "DBUS_SESSION_BUS_ADDRESS is set (value not logged)"
          else
            echo "DBUS_SESSION_BUS_ADDRESS is unset"
          fi
          df -h /dev/shm "$RUNNER_TEMP"
          free -h
          # Apply the limit to the unchanged, pinned bucket command only.
          cat > "$crash_dir/bash-env" <<'SH'
          unset BASH_ENV
          ulimit -c unlimited
          echo "Core limit: $(ulimit -c)"
          : > "$RUNNER_TEMP/chromium-crashes/processes.log"
          (
            while true; do
              date -u +%FT%TZ
              ps -eo pid,ppid,stat,comm,args | awk '/chrome-headless-shell/ && !/awk/ { print; if ($0 !~ /--type=/) browsers++ } END { print "live browser parents:", browsers+0 }'
              free -h
              df -h /dev/shm "$RUNNER_TEMP"
              sleep 1
            done
          ) > "$RUNNER_TEMP/chromium-crashes/processes.log" 2>&1 &
          monitor_pid=$!
          capture_exit() {
            status=$?
            trap - EXIT
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            if (( status != 0 )); then
              free -h || true
              df -h /dev/shm "$RUNNER_TEMP" || true
              tail -100 "$RUNNER_TEMP/chromium-crashes/processes.log" || true
            fi
            exit "$status"
          }
          trap capture_exit EXIT
          SH
      - name: Run the selected verification bucket
        id: verification-bucket
        shell: bash
        env:
          NODETOOL_WEB_TEST_RECYCLE_WORKERS: "1"
          NODETOOL_TURBO_CONCURRENCY: "1"
          NODETOOL_TEST_WORKERS: "1"
          PACKED_TASK: ${{ matrix.task }}
          BASH_ENV: ${{ matrix.task == 'test-packages-game' && format('{0}/chromium-crashes/bash-env', runner.temp) || '/dev/null' }}
          DEBUG: ${{ matrix.task == 'test-packages-game' && 'pw:browser' || '' }}
        run: node scripts/packed-verification.mjs run "$RUNNER_TEMP/packed-verification.json" "$PACKED_TASK"
      - name: Diagnose Chromium cores and restore the core handler
        if: always() && matrix.task == 'test-packages-game'
        env:
          BUCKET_OUTCOME: ${{ steps.verification-bucket.outcome }}
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          crash_dir="$RUNNER_TEMP/chromium-crashes"
          if [[ -f "$crash_dir/core_pattern" ]]; then
            sudo tee /proc/sys/kernel/core_pattern < "$crash_dir/core_pattern" > /dev/null
          fi
          if [[ "$BUCKET_OUTCOME" != failure ]]; then
            exit 0
          fi
          free -h
          df -h /dev/shm "$RUNNER_TEMP"
          sudo journalctl -k --since "-30 min" --no-pager | tail -200 || true
          shopt -s nullglob
          cores=("$crash_dir"/cores/core.*)
          echo "Captured ${#cores[@]} core files"
          # Playwright already supplies --disable-breakpad. The observed headless
          # stack handler re-raises SIGSEGV, so leave launch flags unchanged.
          executable=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -executable -print -quit)
          total=0
          for core in "${cores[@]}"; do
            name=$(basename "$core")
            file "$core"
            timeout 120s gdb -nx -batch \
              -iex 'set auto-load off' -iex 'set debuginfod enabled on' \
              -ex 'set pagination off' -ex 'info files' -ex 'info sharedlibrary' \
              -ex 'info registers' -ex 'thread apply all bt full' \
              "$executable" "$core" 2>&1 | tee "$crash_dir/upload/$name.txt" || true
            # Bound compression work and the total uploaded core payload.
            if [[ $(stat -c %s "$core") -le 1073741824 ]]; then
              if timeout 60s gzip -c "$core" > "$crash_dir/$name.gz"; then
                size=$(stat -c %s "$crash_dir/$name.gz")
                if (( total + size <= 104857600 )); then
                  mv "$crash_dir/$name.gz" "$crash_dir/upload/"
                  total=$((total + size))
                else
                  echo "Omitting $name: compressed cores would exceed 100 MiB"
                fi
              fi
              rm -f "$crash_dir/$name.gz"
            else
              echo "Omitting $name: raw core exceeds 1 GiB"
            fi
            rm -f "$core"
          done
          cp "$crash_dir/processes.log" "$crash_dir/upload/" || true
      - name: Upload Chromium crash diagnostics
        if: failure() && matrix.task == 'test-packages-game' && steps.verification-bucket.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-crashes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chromium-crashes/upload/
          retention-days: 3
          if-no-files-found: warn
  packed-install:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-build frees the runner's unused SDKs first.
      - uses: ./.github/actions/setup-build
        with:
          cache: off
      - name: Pin workspace versions in the test tarballs
        run: node scripts/prepare-publish.mjs
      - name: Pack and pin original release artifacts once
        run: node scripts/publish-packages.mjs --pack-only --tarballs-dir .packed-artifacts
      - name: Smoke-test the packed core-only CLI
        run: node scripts/smoke-packed-cli.mjs --core-only --tarballs-dir .packed-artifacts
      - name: Report disk space before full smoke
        run: df -h /
      - name: Smoke-test the packed full CLI
        run: node scripts/smoke-packed-cli.mjs --tarballs-dir .packed-artifacts
  core-smoke:
    needs: [verification-plan, verification, packed-install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete verification and packed installation
        env:
          PLAN_RESULT: ${{ needs.verification-plan.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          PACKED_INSTALL_RESULT: ${{ needs.packed-install.result }}
          QUALITY_GATE_VERIFIES: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          if [ "$PACKED_INSTALL_RESULT" != "success" ]; then
            echo "Packed CLI installation did not pass."
            exit 1
          fi
          if [ "$PLAN_RESULT" = "skipped" ] && [ "$VERIFICATION_RESULT" = "skipped" ] && [ "$QUALITY_GATE_VERIFIES" = "true" ]; then
            echo "The Test workflow's Quality Gate verifies this pull request into main."
            exit 0
          fi
          if [ "$PLAN_RESULT" != "success" ] || [ "$VERIFICATION_RESULT" != "success" ]; then
            echo "Packed CLI verification did not pass."
            exit 1
          fi
  release-pins:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          cache: read-only
      - name: Pin workspace versions in the test tarballs
        run: node scripts/prepare-publish.mjs
      - name: Measure and pin original pack tarballs without publishing
        run: node scripts/publish-packages.mjs --pack-only --tarballs-dir .release-pins
