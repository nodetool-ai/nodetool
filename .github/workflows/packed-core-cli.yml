name: Packed Core CLI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/smoke-packed-cli.mjs'
      - 'scripts/fixtures/codec-identity.mp4'
      - 'scripts/node-catalog/tiers.mjs'
      - 'scripts/prepare-publish.mjs'
      - 'scripts/publish-packages.mjs'
      - 'scripts/release/**'
      - 'scripts/__tests__/pin-catalog.test.mjs'
      - 'scripts/__tests__/publish-packages.test.mjs'
      - 'scripts/__tests__/smoke-packed-cli.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/actions/setup-build/**'
      - '.github/workflows/packed-core-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packed-core-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request into `main` also runs the Test workflow, whose Quality
  # Gate runs these same checks in parallel shards: the affected suites,
  # typecheck, lint, harness gate and backend smoke. Running them again
  # here, serially on one runner, cost a second runner for up to 90
  # minutes and timed out on diffs that select every suite. Stacked pull
  # requests into other branches get no Test run, so they still verify
  # here, as do manual runs.
  verification:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          cache: read-only
          extra-apt: ffmpeg mesa-vulkan-drivers
      - name: Install Chromium for native 3D tests
        run: npx playwright install --with-deps chromium

      # Ubuntu restricts user namespaces for downloaded Chromium binaries.
      # Allow only Playwright's browser paths so capture keeps its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Enable and verify the Chromium sandbox
        run: |
          sudo tee /etc/apparmor.d/nodetool-playwright > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile nodetool-playwright-chromium /@{HOME}/.cache/ms-playwright/chromium-*/chrome-linux*/chrome flags=(unconfined) {
            userns,
          }

          profile nodetool-playwright-headless /@{HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/nodetool-playwright
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true });
          await browser.close();
          JS

      - name: Install mobile check dependencies
        run: npm --prefix mobile ci
      - name: Verify affected tests
        env:
          NODETOOL_TURBO_CONCURRENCY: "1"
          NODETOOL_TEST_WORKERS: "1"
        run: npm run test:affected
      - name: Verify types
        run: npm run typecheck
      - name: Verify lint
        run: npm run lint
      - name: Verify harnesses
        env:
          NODETOOL_TEST_WORKERS: "1"
        run: npm run dev:nodetool -- harness gate --base origin/main --jobs 1
      - name: Verify the packaged backend
        run: npm run backend:smoke
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-build
        with:
          cache: read-only
      - name: Pin workspace versions in the test tarballs
        run: node scripts/prepare-publish.mjs
      - name: Smoke-test the packed core-only CLI
        run: node scripts/smoke-packed-cli.mjs --core-only
      - name: Smoke-test the packed full CLI
        run: node scripts/smoke-packed-cli.mjs
  core-smoke:
    needs: [verification, packed-install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete verification and packed installation
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          PACKED_INSTALL_RESULT: ${{ needs.packed-install.result }}
          QUALITY_GATE_VERIFIES: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          if [ "$PACKED_INSTALL_RESULT" != "success" ]; then
            echo "Packed CLI installation did not pass."
            exit 1
          fi
          if [ "$VERIFICATION_RESULT" = "skipped" ] && [ "$QUALITY_GATE_VERIFIES" = "true" ]; then
            echo "The Test workflow's Quality Gate verifies this pull request into main."
            exit 0
          fi
          if [ "$VERIFICATION_RESULT" != "success" ]; then
            echo "Packed CLI verification did not pass."
            exit 1
          fi
  release-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-build
        with:
          cache: read-only
      - name: Pin workspace versions in the test tarballs
        run: node scripts/prepare-publish.mjs
      - name: Measure and pin original pack tarballs without publishing
        run: node scripts/publish-packages.mjs --pack-only --tarballs-dir .release-pins
