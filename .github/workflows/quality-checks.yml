name: Quality Checks

on:
  workflow_call:
    inputs:
      fail-fast:
        description: >-
          Matrix fail-fast. When false (the default) every check leg runs to
          completion so each reports its own independent red/green signal. When
          true, the first failing leg cancels the others (saves runner minutes
          at the cost of partial signal).
        required: false
        type: boolean
        default: false
      skip-tests:
        description: 'Whether to skip the package + app test legs (keeps deps/typecheck/lint).'
        required: false
        type: boolean
        default: false
      docs-only:
        description: >-
          Whether this push changes documentation only. When true every check
          leg is skipped — none of them has anything to say about prose — while
          the `quality` gate job still runs and reports, so a required status
          check that must land on every push is not left Pending. The caller
          decides (test.yml computes it from the diff); the default runs
          everything.
        required: false
        type: boolean
        default: false
    outputs:
      all-passed:
        description: 'Whether every quality check leg passed.'
        value: ${{ jobs.quality.outputs.all-passed }}

# Least privilege: every leg only checks out the repo and runs checks — none
# write to it. An explicit read-only token also satisfies CodeQL's
# "workflow does not contain permissions" rule.
permissions:
  contents: read
  # The `docker` leg reads main's buildcache from GHCR. Read-only: it never
  # pushes an image or writes the cache.
  packages: read

jobs:
  # Which parts of the tree this push touched. The caller (test.yml) runs the
  # gate on every PR with no `paths` filter, because a path-filtered REQUIRED
  # check is left Pending forever when a push matches nothing. That decision is
  # right for the required check and wrong for the expensive `docker` leg, so
  # the paths are computed here instead and used to skip that one job.
  #
  # The event of the caller propagates into a reusable workflow, so on
  # pull_request the filter diffs against the PR base and on push against the
  # commit before the push — both out of the box. It fails open: the step is
  # continue-on-error and the output falls back to "true", so a filter that
  # cannot resolve a base builds the image rather than waving it through.
  changes:
    name: changes
    # Nothing to decide when the caller already knows the diff is prose: the
    # only consumer of this job is the `docker` leg, which is skipped too.
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect docker-relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'packages/**'
              - 'web/**'
              - 'scripts/docker-smoke.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/quality-checks.yml'

  # Static checks that need no built packages. Kept independent of `build` so
  # the fastest signals (lint, dependency guards) are not delayed behind the
  # ~minutes-long package build. Each leg surfaces its own status check.
  static:
    name: ${{ matrix.check }}
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          # Workspace, circular-dependency, key-boundary, coupled-dependency,
          # and lockfile-sync guards (run on source, no build).
          - check: deps
            command: node scripts/check-workspace-deps.mjs && node scripts/check-circular-deps.mjs && node scripts/check-key-boundaries.mjs && node scripts/check-coupled-deps.mjs && node scripts/check-lockfile-sync.mjs && node scripts/check-execution-boundary.mjs
          # oxlint + web design-token lint. Neither needs package dist.
          - check: lint
            command: npm run lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node, install deps
        uses: ./.github/actions/setup-build
        with:
          build-packages: "false"

      - name: Run npm audit (advisory)
        # Advisory only (continue-on-error) so a pre-existing vulnerability
        # backlog doesn't block every PR, but high/critical issues in the
        # production dependency closure are surfaced in the job summary.
        if: matrix.check == 'deps'
        continue-on-error: true
        run: |
          echo "::group::npm audit (production deps, high+)"
          echo "## npm audit (production deps, high and critical)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev --audit-level=high 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"

      - name: Run ${{ matrix.check }}
        run: |
          echo "::group::${{ matrix.check }}"
          ${{ matrix.command }}
          echo "::endgroup::"

  # Build the ~55 backend packages ONCE and publish their dist as an artifact.
  # The `built` legs below consume it instead of each rebuilding from scratch,
  # which on a fresh commit (cold per-SHA Turbo cache) means one build instead
  # of five racing in parallel. setup-build also persists the per-SHA Turbo
  # cache here, so the test-packages leg's `turbo run test` restores `build`
  # as a cache hit rather than rebuilding its `^build` dependencies.
  build:
    name: build
    # `built` needs this job, so skipping it skips every leg that consumes the
    # dist artifact too.
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node, install deps, build packages
        uses: ./.github/actions/setup-build
        with:
          build-packages: "true"

      - name: Upload package dist
        uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

      # `reliability/harness` is a workspace outside `packages/*` (turbo still
      # builds it above — it's `packages/cli`'s dependency, pulled in via
      # `dependsOn: ["^build"]` regardless of the `--filter` path pattern) but
      # its dist isn't under the glob the artifact above captures. Uploaded
      # separately so its own directory structure survives the round trip
      # (mixing it into `packages/*/dist` would change upload-artifact's
      # common-ancestor computation and break both globs' download paths).
      # Only the `bundle` leg of the `built` job below downloads it.
      - name: Upload reliability harness dist
        uses: actions/upload-artifact@v7
        with:
          name: reliability-harness-dist
          path: reliability/harness/dist
          retention-days: 1
          if-no-files-found: error

  # Checks that need the built packages on disk. They download the dist artifact
  # and set build-packages:false, so they skip the redundant per-leg build. The
  # app legs (typecheck/test-app) and parity/base-nodes run plain tsc/jest/vitest
  # against the prebuilt dist; test-packages runs Turbo and rides the warm
  # per-SHA Turbo cache the `build` job populated.
  #
  # Five legs, not eight. Every leg pays ~1-2 min of checkout, install and
  # artifact download before its real work, and the account-wide runner cap
  # (~20 concurrent jobs) makes each extra leg queue time for the whole PR. The
  # cheap checks are therefore chained inside one leg — `typecheck` runs
  # typecheck + parity + examples, `bundle` runs the packaged-backend smoke +
  # Ring 0 reliability — while the three long legs (test-packages, test-app,
  # app-build) keep their own runner so the critical path stays short. Chained
  # with `&&`, mirroring the `deps` leg: the first failure stops the chain, so
  # a red leg names one problem at a time.
  built:
    name: ${{ matrix.check }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          # Three cheap checks in one leg:
          #   1. `npm run typecheck` — web, electron, mobile.
          #   2. The web design-token lint plus the base-nodes parity/contract
          #      suite (Python-parity + example-workflow contracts). These
          #      encode intentional behavior contracts (see the revert in
          #      commit 2c0fd8fad), hence is-test:false — they stay a required
          #      gate even when skip-tests drops the bulk test legs.
          #   3. `npm run validate:examples` — rot detector for the shipped
          #      example workflows, both `packages/**/examples/` (templates and
          #      app bundles) and `examples/workflows/` (the CLI samples):
          #      `nodetool validate` against the current node
          #      registry (unknown node types, missing required properties,
          #      unselected models, dangling/mis-typed edges).
          #      --warnings-as-errors (set in the script) so a warning-level
          #      drift fails the gate too. File targets need no DB, only the
          #      built node registry from the `build` job's dist.
          #   4. `npm run codegen:dsl:check` — the same rot detector for the
          #      generated TypeScript DSL (packages/dsl/src/generated). It is
          #      the graph-authoring surface agents write against, so a node
          #      the registry no longer has must not survive there. Reads the
          #      built node registry, writes nothing.
          #   5. `npm run build:sandbox-dsl:check` — the same detector one layer
          #      down. `@nodetool-ai/sandbox-dsl` ships its own built copy of
          #      that DSL, and the copy is what a Code node imports, so it must
          #      not drift from `packages/dsl` either. Writes nothing.
          #   6. `npm run build:sandbox-flow:check` — the same, for
          #      `@nodetool-ai/sandbox-flow`: the guest copy of the native flow
          #      surface (packages/dsl/src/flow/generated plus its guest core).
          #   7. `npm run typecheck:examples` — `tsc --noEmit` over the three
          #      example apps (chat_app, nextjs-vercel, nextjs-cloudflare).
          #      They compile against the live tRPC router and SDK types, so
          #      this is what fails a PR that prunes an API procedure an
          #      example still calls (threads.create in #4448 shipped exactly
          #      that break). Deliberately typecheck only — the full
          #      `next build`s cost minutes each and belong to deploys, not
          #      the PR gate.
          - check: typecheck
            command: npm run typecheck && npm run lint:design --workspace=web && npm test --workspace=@nodetool-ai/base-nodes -- parity example-workflows && npm run validate:examples && npm run codegen:dsl:check && npm run build:sandbox-dsl:check && npm run build:sandbox-flow:check && npm run typecheck:examples
            mobile-deps: "true"
            extra-apt: ""
            is-test: "false"
            fetch-depth: "1"
          # mesa-vulkan-drivers ships lavapipe (CPU Vulkan ICD) so Dawn can
          # acquire a WebGPU adapter on GPU-less runners — without it the
          # shader-backed base-nodes tests fail with "No WebGPU adapter
          # available (Node/Dawn)". ffmpeg decodes the clip the runtime's
          # video-frame fallback samples for providers with no video content
          # part; without it those tests have nothing to decode.
          - check: test-packages
            # On PRs, `--affected` prunes the Turbo graph to packages changed
            # since the base commit plus their dependents, so unaffected backend
            # tests are skipped entirely (not just cache-restored). On push to
            # main (no base sha) the full suite runs. Needs fetch-depth: 0 for
            # the SCM diff and TURBO_SCM_BASE (set on the Run step below).
            command: npm run test:packages${{ github.event_name == 'pull_request' && ' -- --affected' || '' }}
            mobile-deps: "false"
            extra-apt: "mesa-vulkan-drivers ffmpeg"
            is-test: "true"
            fetch-depth: "0"
          - check: test-app
            command: npm run test
            mobile-deps: "true"
            extra-apt: ""
            is-test: "true"
            fetch-depth: "1"
          # Two release gates in one leg:
          #   1. `npm run backend:smoke` stages the packaged backend and boots
          #      it. Nothing outside the release workflow used to build the
          #      bundle, so a packaging regression only surfaced once a release
          #      was cut — and the release's smoke-launch spawns the Electron
          #      main process, which survives its backend child dying.
          #      v0.7.1-nightly.20260728.713 shipped a sharp/@img major skew
          #      that killed server.mjs on import with every other check green.
          #   2. `npm run reliability:ring0` (docs/RELIABILITY_TASKS.md Track F,
          #      task F2; docs/RELIABILITY_ARCHITECTURE.md §11): the five
          #      fastest golden journeys (linear-text-pipeline,
          #      fan-out-fan-in-dag, error-in-one-branch, mid-run-cancel-node,
          #      mid-run-cancel-streaming — journeys 1/3/6a/6b/13) on the kernel
          #      surface, strict lifecycle mode always on
          #      (reliability/harness/src/drivers/kernel.ts). No network, no
          #      cross-surface diff — that's Ring 1.
          # is-test:false — these are release gates, not unit suites, so they
          # stay required even when skip-tests drops the bulk test legs
          # (matching the Ring 0 flake budget of zero).
          - check: bundle
            command: npm run backend:smoke && npm run reliability:ring0
            mobile-deps: "false"
            extra-apt: ""
            is-test: "false"
            fetch-depth: "1"
          # The `app-build` suite's two deterministic cases: a pinned spec over
          # template graphs, authored by a script instead of a model, run on the
          # real kernel. They call no provider, so no API key is needed — the
          # `-p ollama -m none` provider is constructed and never used. This is
          # the mini-app build harness's regression gate (the full suite runs
          # nightly in app-build-eval.yml, where a model is in the loop).
          # --min-success 1 because a deterministic case has no variance: if it
          # is not green, the harness broke.
          - check: app-build
            command: npm run dev:nodetool -- eval app-build --cases greeting-card,draft-then-publish -p ollama -m none --no-find-model --min-success 1
            mobile-deps: "false"
            extra-apt: ""
            is-test: "false"
            fetch-depth: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Most legs only need the tip; the test-packages leg needs full history
          # so Turbo's `--affected` can diff against the PR base commit.
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Set up Node, install deps
        uses: ./.github/actions/setup-build
        with:
          extra-apt: ${{ matrix.extra-apt }}
          # The dist comes from the artifact below; don't rebuild it per leg.
          build-packages: "false"

      - name: Download package dist
        uses: actions/download-artifact@v8
        with:
          name: packages-dist
          path: packages

      # See the matching upload step in the `build` job above — the Ring 0
      # reliability run (the `bundle` leg's second command) needs
      # @nodetool-ai/reliability-harness's dist (the CLI dynamic-imports it at
      # run time) alongside the packages-dist download.
      - name: Download reliability harness dist
        if: matrix.check == 'bundle'
        uses: actions/download-artifact@v8
        with:
          name: reliability-harness-dist
          path: reliability/harness/dist

      # mobile is NOT a root workspace (separate dependency tree), so its
      # node_modules is cached on its own lockfile and `npm ci` is skipped on hit.
      - name: Cache mobile node_modules
        if: matrix.mobile-deps == 'true'
        id: mobile-node-modules
        uses: actions/cache@v6
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-modules-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install mobile dependencies
        if: matrix.mobile-deps == 'true' && steps.mobile-node-modules.outputs.cache-hit != 'true'
        run: cd mobile && npm ci

      - name: Run ${{ matrix.check }}
        # skip-tests drops the package + app test legs without touching the
        # static checks. The leg still spins up but does no work, so it stays
        # green (a skipped leg must not block the gate).
        if: ${{ !(inputs.skip-tests && matrix.is-test == 'true') }}
        env:
          # Base commit for Turbo's `--affected` diff (test-packages leg on PRs).
          # Empty on push, where the test-packages command omits `--affected`.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "::group::${{ matrix.check }}"
          ${{ matrix.command }}
          echo "::endgroup::"

  # The deploy artifact. docker.yml only builds after a merge to main, so until
  # this leg existed nothing verified the image before it landed: a Dockerfile
  # that could not build survived 49 commits on main, taking the Fly deploy with
  # it (fly-deploy.yml gates on docker.yml). Runs here, inside the gate, so it
  # blocks through the existing required check rather than a new one.
  #
  # Independent of `build` — it builds its own image and shares no artifact, so
  # it starts as soon as `changes` reports.
  #
  # Skipped when the push touches nothing the image contains. Building and
  # booting a container costs a runner for ~10 minutes, and the account-wide
  # concurrency cap makes that time other jobs spend queued. A skipped leg
  # counts as a pass in the aggregate below, so the required check still lands.
  docker:
    name: docker
    needs: changes
    if: ${{ !inputs.docs-only && needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        # Only to read the buildcache. Fork PRs get a token that cannot, so a
        # failure here costs cache hits, not the leg.
        continue-on-error: true
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chromium downloads while nothing else needs the runner, so the browser
      # is ready the moment the container is.
      #
      # Installed in a scratch directory, never the repo: `npm install` at the
      # workspace root would reify all 60-odd workspaces, which is minutes of
      # work this leg has no use for — it talks to the container over HTTP and
      # needs nothing from the source tree but the script itself.
      #
      # No --with-deps: the ubuntu-latest image already carries the shared
      # libraries Chromium links against, and the apt update it triggers costs
      # more than the browser download.
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/smoke
          cp scripts/docker-smoke.mjs /tmp/smoke/
          cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.60.0
          npx playwright install chromium

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nodetool:ci
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          # Reuse the layers main already published. cache-to is deliberately
          # absent — a PR must not overwrite the cache main builds from. A PR
          # that touches nothing in the image context hits cache throughout.
          cache-from: type=registry,ref=ghcr.io/nodetool-ai/nodetool:buildcache
          provenance: false
          sbom: false

      # --network host so requests reach the server over loopback. Under a
      # published port they arrive from the bridge gateway, which `local` auth
      # mode treats as remote and answers 401.
      - name: Start container
        run: |
          docker run -d --name nodetool-smoke --network host \
            -e DB_PATH=/workspace/nodetool.sqlite \
            -e SECRETS_MASTER_KEY="RE9DS0VSX1NNT0tFX0tFWV9ET19OT1RfVVNFISE=" \
            nodetool:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fs http://localhost:7777/health >/dev/null; then
              echo "Healthy after ${attempt}s."
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=nodetool-smoke)" ]; then
              echo "::error::Container exited before serving /health."
              exit 1
            fi
            sleep 1
          done
          echo "::error::/health did not answer within 60s."
          exit 1

      - name: Load the app in a browser
        working-directory: /tmp/smoke
        run: node docker-smoke.mjs http://localhost:7777

      - name: Dump container logs
        if: failure()
        run: docker logs nodetool-smoke 2>&1 | tail -100

      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-screenshot
          path: /tmp/smoke/docker-smoke.png
          if-no-files-found: ignore

      - name: Stop container
        if: always()
        run: docker rm -f nodetool-smoke || true

  # Aggregating gate. Kept as job id `quality` (no custom name) so the surfaced
  # status check stays "Quality Gate (npm run check) / quality" — the existing
  # REQUIRED check, so branch protection needs no change.
  #
  # `always()` so the gate reports even when a leg is skipped. A `skipped` job
  # passes: `docker` is skipped by design when the diff cannot reach the image,
  # and a leg skipped that way must not hold the required check red. Anything
  # else — failure, cancelled, or a leg skipped because its own upstream failed
  # — fails the gate.
  quality:
    name: quality
    needs: [changes, static, build, built, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all-passed: ${{ steps.gate.outputs.all-passed }}
    steps:
      - name: Aggregate check results
        id: gate
        run: |
          failed=""
          echo "## Quality Gate" >> $GITHUB_STEP_SUMMARY
          for leg in \
            "changes:${{ needs.changes.result }}" \
            "static:${{ needs.static.result }}" \
            "build:${{ needs.build.result }}" \
            "built:${{ needs.built.result }}" \
            "docker:${{ needs.docker.result }}"; do
            name="${leg%%:*}"
            result="${leg#*:}"
            echo "- \`$name\`: $result" >> $GITHUB_STEP_SUMMARY
            case "$result" in
              success|skipped) ;;
              *) failed="$failed $name" ;;
            esac
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -z "$failed" ]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
            echo "✅ **All quality checks passed.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
            echo "❌ **Quality checks failed:**$failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See the individual check legs above to find which one." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
