name: Quality Checks

on:
  workflow_call:
    inputs:
      fail-fast:
        description: >-
          Matrix fail-fast. When false (the default) every check leg runs to
          completion so each reports its own independent red/green signal. When
          true, the first failing leg cancels the others (saves runner minutes
          at the cost of partial signal).
        required: false
        type: boolean
        default: false
      skip-tests:
        description: 'Whether to skip the package + app test legs (keeps deps/typecheck/lint).'
        required: false
        type: boolean
        default: false
      docs-only:
        description: >-
          Whether this push changes documentation only. When true every check
          leg is skipped — none of them has anything to say about prose — while
          the `quality` gate job still runs and reports, so a required status
          check that must land on every push is not left Pending. The caller
          decides (test.yml computes it from the diff); the default runs
          everything.
        required: false
        type: boolean
        default: false
      shared:
        description: >-
          Whether this push can reach the root workspace tree — everything but
          `marketing/`, which is a separate npm project with its own lockfile,
          built and deployed by marketing-ci.yml. When false, every leg here is
          skipped for the same reason `docs-only` skips them: none of them
          reads a line the diff touched. The `quality` gate job still runs and
          reports, so a required status check is never left Pending.

          `mobile/` is deliberately NOT carved out. It is also a separate npm
          project, but its typecheck resolves `@nodetool-ai/websocket`'s router
          types and `@nodetool-ai/protocol` through the root workspace, so it
          is not separable from this gate without a change to how mobile
          resolves those packages. See the workflows README.
        required: false
        type: boolean
        default: true
      plan:
        description: >-
          JSON from `node scripts/ci-plan.mjs plan`: which legs this diff
          needs. Empty runs every leg.
        required: false
        type: string
        default: ""
      base-sha:
        description: >-
          The commit the diff is measured from (the PR base, the merge group
          base, or the commit before a push). It scopes Turbo's `--affected`,
          the harness gate and the app test legs. Empty runs them in full.
        required: false
        type: string
        default: ""
    outputs:
      all-passed:
        description: 'Whether every quality check leg passed.'
        value: ${{ jobs.quality.outputs.all-passed }}

# Least privilege: every leg only checks out the repo and runs checks — none
# write to it. An explicit read-only token also satisfies CodeQL's
# "workflow does not contain permissions" rule.
permissions:
  contents: read
  # The `docker` leg reads main's buildcache from GHCR. Read-only: it never
  # pushes an image or writes the cache.
  packages: read

jobs:
  # Which legs this diff needs. The caller (test.yml) runs `scripts/ci-plan.mjs`
  # over the diff and passes its JSON as `plan`; this job turns it into the
  # `static` and `built` matrices, so a leg the diff cannot reach never takes
  # a runner. GitHub cannot drop a static matrix entry by expression (an
  # `include` entry whose key was excluded comes back as a new combination),
  # so the leg list lives here as data and jq filters it. An empty or
  # unparseable plan runs every leg: only an explicit plan skips work.
  #
  # Each leg's `when` names the plan key that selects it (`always`: every run
  # with code). `docker` is the image smoke test: the caller turns it off on
  # push, where docker.yml builds main and gates the deploy.
  #
  # Notes on the legs, kept beside their definitions:
  #
  # `deps`:
  #   Workspace, circular-dependency, key-boundary, coupled-dependency,
  #   and lockfile-sync guards (run on source, no build).
  #
  # `lint`:
  #   oxlint + web design-token lint. Neither needs package dist.
  #
  # `typescript-6-fallback`:
  #   Keep the JavaScript compiler rollback exercised after the native
  #   compiler becomes the default. This is intentionally a separate
  #   static leg so it remains visible in the required quality gate.
  #
  # `typecheck`:
  #   Three cheap checks in one leg:
  #     1. `npm run typecheck` — web, electron, mobile.
  #     2. The web design-token lint plus the base-nodes parity/contract
  #        suite (Python-parity + example-workflow contracts). These
  #        encode intentional behavior contracts (see the revert in
  #        commit 2c0fd8fad), hence is-test:false — they stay a required
  #        gate even when skip-tests drops the bulk test legs.
  #     3. `npm run validate:examples` — rot detector for the shipped
  #        example workflows, both `packages/**/examples/` (templates and
  #        app bundles) and `examples/workflows/` (the CLI samples):
  #        `nodetool validate` against the current node
  #        registry (unknown node types, missing required properties,
  #        unselected models, dangling/mis-typed edges).
  #        --warnings-as-errors (set in the script) so a warning-level
  #        drift fails the gate too. File targets need no DB, only the
  #        built node registry from the `build` job's dist.
  #     4. `npm run codegen:dsl:check` — the same rot detector for the
  #        generated TypeScript DSL (packages/dsl/src/generated). It is
  #        the graph-authoring surface agents write against, so a node
  #        the registry no longer has must not survive there. Reads the
  #        built node registry, writes nothing.
  #     5. `npm run build:sandbox-dsl:check` — the same detector one layer
  #        down. `@nodetool-ai/sandbox-dsl` ships its own built copy of
  #        that DSL, and the copy is what a Code node imports, so it must
  #        not drift from `packages/dsl` either. Writes nothing.
  #     6. `npm run build:sandbox-flow:check` — the same, for
  #        `@nodetool-ai/sandbox-flow`: the guest copy of the native flow
  #        surface (packages/dsl/src/flow/generated plus its guest core).
  #     7. `npm run typecheck:examples` — `tsc --noEmit` over the three
  #        example apps (chat_app, nextjs-vercel, nextjs-cloudflare).
  #        They compile against the live tRPC router and SDK types, so
  #        this is what fails a PR that prunes an API procedure an
  #        example still calls (threads.create in #4448 shipped exactly
  #        that break). Deliberately typecheck only — the full
  #        `next build`s cost minutes each and belong to deploys, not
  #        the PR gate.
  #     8. `npm run capabilities:check` — the capability coverage table
  #        (packages/cli/src/harness/capability-table.ts) regenerated
  #        from the live registry and diffed against the checked-in one.
  #        Fails on a capability with no suite, no eval case and no gap
  #        note, and on a table the diff left stale. Imports
  #        packages/cli/dist and packages/agents/dist, both in the
  #        `build` job's artifact; nothing else ran it, so the invariant
  #        packages/agents/AGENTS.md documents held only when someone
  #        remembered to run it by hand.
  #
  # `test-packages-websocket`:
  #   The four backend test shards. Each runs `turbo run test` over a
  #   disjoint slice of the workspace graph: the two heaviest packages
  #   alone, the node packages (`./packages/*-nodes` plus the packages
  #   only they use), and everything else. The `core` shard runs
  #   game-runtime, game-renderer, and cli serially before the other packages
  #   because their script deadlines are sensitive to CPU contention.
  #   It also carries the two root-level
  #   suites (`test:oxlint-rules`, `test:scripts`), which take a second.
  #   The `nodes` and `core` filter lists are the
  #   same list with the sign flipped — a package added to one must be
  #   removed from the other, or it runs twice or not at all.
  #
  #   `$TURBO_AFFECTED` (set on the `built` Run step) is `--affected`
  #   whenever there is a base commit: turbo intersects it with the
  #   shard's `--filter`. A shard the diff cannot reach is not in the
  #   matrix at all. In the nightly full run it is empty and the full
  #   slice runs. Needs fetch-depth: 0 for the SCM diff. The flag
  #   is passed to turbo directly rather than through
  #   `npm run test:packages -- --affected`: npm appends `--` arguments
  #   to the END of the script string, so on the old `turbo && npm run
  #   a && npm run b` script the flag landed on the last command and
  #   turbo ran every package on every PR.
  #
  #   mesa-vulkan-drivers ships lavapipe (CPU Vulkan ICD) so Dawn can
  #   acquire a WebGPU adapter on GPU-less runners — without it the
  #   shader-backed base-nodes tests fail with "No WebGPU adapter
  #   available (Node/Dawn)". ffmpeg decodes the clip the runtime's
  #   video-frame fallback samples for providers with no video content
  #   part; without it those tests have nothing to decode. Every shard
  #   installs both: the apt step costs seconds, and a package that
  #   moves between shards must not lose its driver on the way.
  #
  # `test-packages-nodes`:
  #   This shard also runs the Blender integration suites
  #   (`packages/blender-nodes/tests/*`), which skip without a Blender
  #   binary. The X11/GL libraries below are what the Blender tarball
  #   links against for a headless (`-b`) run — EEVEE in `-b` on a
  #   display-less runner needs a GL/EGL context (`libegl1`), and older
  #   tarballs also dlopen `libsm6`; the Install Blender
  #   step further down puts 5.2 on PATH and sets
  #   NODETOOL_REQUIRE_BLENDER=1, so a missing Blender fails the
  #   suite instead of skipping it.
  #
  # `bundle`:
  #   The packaged-backend release gate: `npm run backend:smoke` stages
  #   the packaged backend and boots it. Nothing outside the release
  #   workflow used to build the bundle, so a packaging regression only
  #   surfaced once a release was cut — and the release's smoke-launch
  #   spawns the Electron main process, which survives its backend child
  #   dying. v0.7.1-nightly.20260728.713 shipped a sharp/@img major skew
  #   that killed server.mjs on import with every other check green.
  #   `nodetool harness gate`'s `backend-smoke` selfcheck runs the same
  #   command but is `cost: "expensive"`, so the default gate (below)
  #   skips it — this leg is what keeps it on every PR. The Ring 0
  #   golden journeys used to run here too
  #   (docs/RELIABILITY_TASKS.md Track F, task F2); they moved to the
  #   `harness-gate` leg's `reliability-ring0` selfcheck, which runs on
  #   any diff touching `packages/kernel/` (or the other
  #   `workflow-execution` surface paths) without hand-listing them here.
  #   is-test:false — a release gate, not a unit suite, so it stays
  #   required even when skip-tests drops the bulk test legs.
  #
  # `harness-gate`:
  #   `nodetool harness gate` — see the `built` job's header comment
  #   below for what it does and why the old `reliability:ring0` half of
  #   `bundle` and the standalone `app-build` leg both folded into it.
  #   `$CI_BASE_SHA` is set on the `built` Run step, so no `${{ }}`
  #   templating is needed inside the matrix command. `--json` for a
  #   machine-readable log (rule 6, docs/HARNESS_FIRST.md). is-test:false
  #   for the same reason as
  #   `bundle`: this is a gate, not a unit suite.
  #
  changes:
    name: changes
    if: ${{ !inputs.docs-only && inputs.shared }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.legs.outputs.static }}
      built: ${{ steps.legs.outputs.built }}
      docker: ${{ steps.legs.outputs.docker }}
    steps:
      - name: Select legs from the plan
        id: legs
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object"' <<<"${PLAN:-null}" >/dev/null 2>&1; then
            echo "::notice::No usable plan; running every leg."
            PLAN='{"full":true,"web":"full","electron":true,"mobile":true,"packages_websocket":true,"packages_agents":true,"packages_nodes":true,"packages_core":true,"tsc6":true,"docker":true}'
          fi
          select_legs() {
            jq -c --argjson p "$PLAN" '
              def on($w): $w == "always" or $p[$w] == true
                or ($w == "web_full" and $p.web == "full")
                or ($w == "web_related" and $p.web == "related")
                or ($w == "electron_or_mobile" and ($p.electron == true or $p.mobile == true));
              map(select(on(.when)) | del(.when)
                | if .check == "test-electron-mobile" then .["mobile-deps"] = ($p.mobile == true | tostring) else . end)
              | {include: .}'
          }
          static=$(select_legs <<'JSON'
          [
            {
              "check": "deps",
              "command": "node scripts/check-workspace-deps.mjs && node scripts/check-circular-deps.mjs && node scripts/check-key-boundaries.mjs && node scripts/check-coupled-deps.mjs && node scripts/check-lockfile-sync.mjs && node scripts/check-execution-boundary.mjs",
              "when": "always"
            },
            {
              "check": "lint",
              "command": "npm run lint",
              "when": "always"
            },
            {
              "check": "typescript-6-fallback",
              "command": "npm run build:tsc6",
              "when": "tsc6"
            }
          ]
          JSON
          )
          built=$(select_legs <<'JSON'
          [
            {
              "check": "typecheck",
              "command": "npm run typecheck && npm run lint:design --workspace=web && npm test --workspace=@nodetool-ai/base-nodes -- parity example-workflows && npm run validate:examples && npm run codegen:dsl:check && npm run build:sandbox-dsl:check && npm run build:sandbox-flow:check && npm run typecheck:examples && npm run capabilities:check",
              "mobile-deps": "true",
              "extra-apt": "",
              "is-test": "false",
              "fetch-depth": "1",
              "when": "always",
              "jest-cache": ""
            },
            {
              "check": "test-packages-websocket",
              "command": "npx turbo run test --filter=@nodetool-ai/websocket $TURBO_AFFECTED",
              "mobile-deps": "false",
              "extra-apt": "mesa-vulkan-drivers ffmpeg",
              "is-test": "true",
              "fetch-depth": "0",
              "when": "packages_websocket",
              "jest-cache": ""
            },
            {
              "check": "test-packages-agents",
              "command": "npx turbo run test --filter=@nodetool-ai/agents $TURBO_AFFECTED",
              "mobile-deps": "false",
              "extra-apt": "mesa-vulkan-drivers ffmpeg",
              "is-test": "true",
              "fetch-depth": "0",
              "when": "packages_agents",
              "jest-cache": ""
            },
            {
              "check": "test-packages-nodes",
              "command": "npx turbo run test --filter='./packages/*-nodes' --filter=@nodetool-ai/gpu --filter=@nodetool-ai/workflow-runner --filter=@nodetool-ai/nodes-utils $TURBO_AFFECTED",
              "mobile-deps": "false",
              "extra-apt": "mesa-vulkan-drivers ffmpeg libgl1 libegl1 libsm6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libxxf86vm1",
              "is-test": "true",
              "fetch-depth": "0",
              "when": "packages_nodes",
              "jest-cache": ""
            },
            {
              "check": "test-packages-core",
              "command": "npm run test:oxlint-rules && npm run test:scripts && npx turbo run test --filter=@nodetool-ai/game-runtime --filter=@nodetool-ai/game-renderer --filter=@nodetool-ai/cli --concurrency=1 $TURBO_AFFECTED && npx turbo run test --filter='./packages/*' --filter='./reliability/*' --filter='!./packages/*-nodes' --filter='!@nodetool-ai/gpu' --filter='!@nodetool-ai/workflow-runner' --filter='!@nodetool-ai/nodes-utils' --filter='!@nodetool-ai/websocket' --filter='!@nodetool-ai/agents' --filter='!@nodetool-ai/game-runtime' --filter='!@nodetool-ai/game-renderer' --filter='!@nodetool-ai/cli' $TURBO_AFFECTED",
              "mobile-deps": "false",
              "extra-apt": "mesa-vulkan-drivers ffmpeg",
              "is-test": "true",
              "fetch-depth": "0",
              "when": "packages_core",
              "jest-cache": ""
            },
            {
              "check": "test-web-1",
              "command": "npm test --workspace=web -- --shard=1/3 --cacheDirectory=\"$GITHUB_WORKSPACE/.jest-cache\"",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "true",
              "fetch-depth": "1",
              "jest-cache": "web-1",
              "when": "web_full"
            },
            {
              "check": "test-web-2",
              "command": "npm test --workspace=web -- --shard=2/3 --cacheDirectory=\"$GITHUB_WORKSPACE/.jest-cache\"",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "true",
              "fetch-depth": "1",
              "jest-cache": "web-2",
              "when": "web_full"
            },
            {
              "check": "test-web-3",
              "command": "npm test --workspace=web -- --shard=3/3 --cacheDirectory=\"$GITHUB_WORKSPACE/.jest-cache\"",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "true",
              "fetch-depth": "1",
              "jest-cache": "web-3",
              "when": "web_full"
            },
            {
              "check": "test-web",
              "command": "node scripts/ci-plan.mjs run web --base \"$CI_BASE_SHA\"",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "true",
              "fetch-depth": "1",
              "when": "web_related",
              "jest-cache": ""
            },
            {
              "check": "test-electron-mobile",
              "command": "node scripts/ci-plan.mjs run electron mobile ${CI_BASE_SHA:+--base \"$CI_BASE_SHA\"}",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "true",
              "fetch-depth": "1",
              "when": "electron_or_mobile",
              "jest-cache": ""
            },
            {
              "check": "bundle",
              "command": "npm run backend:smoke",
              "mobile-deps": "false",
              "extra-apt": "",
              "is-test": "false",
              "fetch-depth": "1",
              "when": "always",
              "jest-cache": ""
            },
            {
              "check": "harness-gate",
              "command": "if [ -n \"$CI_BASE_SHA\" ]; then npm run dev:nodetool -- harness gate --base \"$CI_BASE_SHA\" --json --timeout 900; else npm run dev:nodetool -- harness gate --all --json --timeout 900; fi",
              "mobile-deps": "false",
              "extra-apt": "mesa-vulkan-drivers ffmpeg",
              "is-test": "false",
              "fetch-depth": "0",
              "when": "always",
              "jest-cache": ""
            }
          ]
          JSON
          )
          {
            echo "static=$static"
            echo "built=$built"
            echo "docker=$(jq -r --arg event "$GITHUB_EVENT_NAME" '.docker == true and $event != "push"' <<<"$PLAN")"
          } >> "$GITHUB_OUTPUT"
          jq -r '.include[].check' <<<"$built" | sed 's/^/built: /'
          jq -r '.include[].check' <<<"$static" | sed 's/^/static: /'

  # Static checks that need no built packages. Kept independent of `build` so
  # the fastest signals (lint, dependency guards) are not delayed behind the
  # ~minutes-long package build. Each leg surfaces its own status check.
  static:
    name: ${{ matrix.check }}
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.changes.outputs.static) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node, install deps
        uses: ./.github/actions/setup-build
        with:
          build-packages: "false"

      - name: Run npm audit (advisory)
        # Advisory only (continue-on-error) so a pre-existing vulnerability
        # backlog doesn't block every PR, but high/critical issues in the
        # production dependency closure are surfaced in the job summary.
        if: matrix.check == 'deps'
        continue-on-error: true
        run: |
          echo "::group::npm audit (production deps, high+)"
          echo "## npm audit (production deps, high and critical)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev --audit-level=high 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"

      - name: Run ${{ matrix.check }}
        run: |
          echo "::group::${{ matrix.check }}"
          ${{ matrix.command }} || exit $?
          echo "::endgroup::"

      - name: Check production release workflow contracts
        if: matrix.check == 'lint'
        run: node --test .github/tests/docker-deploy.test.mjs

  # Build the ~55 backend packages ONCE and publish their dist as an artifact.
  # The `built` legs below consume it instead of each rebuilding from scratch,
  # which on a fresh commit (cold per-SHA Turbo cache) means one build instead
  # of eight racing in parallel. setup-build also persists the per-SHA Turbo
  # cache here, so each test-packages shard's `turbo run test` restores
  # `build` as a cache hit rather than rebuilding its `^build` dependencies.
  build:
    name: build
    # `built` needs this job, so skipping it skips every leg that consumes the
    # dist artifact too.
    if: ${{ !inputs.docs-only && inputs.shared }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node, install deps, build packages
        uses: ./.github/actions/setup-build
        with:
          build-packages: "true"

      - name: Upload package dist
        uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

      # `reliability/harness` is a workspace outside `packages/*` (turbo still
      # builds it above — it's `packages/cli`'s dependency, pulled in via
      # `dependsOn: ["^build"]` regardless of the `--filter` path pattern) but
      # its dist isn't under the glob the artifact above captures. Uploaded
      # separately so its own directory structure survives the round trip
      # (mixing it into `packages/*/dist` would change upload-artifact's
      # common-ancestor computation and break both globs' download paths).
      # Only the `bundle` leg of the `built` job below downloads it.
      - name: Upload reliability harness dist
        uses: actions/upload-artifact@v7
        with:
          name: reliability-harness-dist
          path: reliability/harness/dist
          retention-days: 1
          if-no-files-found: error

  # Checks that need the built packages on disk. They download the dist artifact
  # and set build-packages:false, so they skip the redundant per-leg build. The
  # app legs (typecheck, test-web*, test-electron-mobile) and parity/base-nodes
  # run plain tsc/jest/vitest
  # against the prebuilt dist; test-packages runs Turbo and rides the warm
  # per-SHA Turbo cache the `build` job populated.
  #
  # Every leg pays ~1-2 min of checkout, install and artifact download before
  # its real work, and the account-wide runner cap (~20 concurrent jobs) makes
  # each extra leg queue time for the whole PR. The cheap checks are therefore
  # chained inside one leg — `typecheck` runs typecheck + parity + examples,
  # `bundle` runs the packaged-backend smoke. Chained with `&&`, mirroring the
  # `deps` leg: the first failure stops the chain, so a red leg names one
  # problem at a time.
  #
  # `harness-gate` runs `nodetool harness gate` (docs/HARNESS_FIRST.md § The
  # gate): it maps the diff against `inputs.base-sha` onto the surfaces in
  # `packages/cli/src/harness/registry.ts` and runs the keyless selfcheck of
  # every harness covering a touched surface — the diff selects the checks,
  # not this file. This is what replaced the old `reliability:ring0` half of
  # the `bundle` leg (still runs on any diff touching `packages/kernel/` —
  # see the `workflow-execution` surface in the registry) and the standalone
  # `app-build` leg (its two deterministic cases are the `app-build`
  # harness's selfcheck, run when a diff touches `packages/agents/src/app-build/`).
  # A changed code file no surface claims fails the leg (see
  # docs/harnesses.md § nodetool harness); `--strict` is left off so a diff
  # touching a documented gap (mobile/, electron/) still passes;
  # `--timeout` bounds each selfcheck so a hang fails the leg
  # instead of the job's own timeout cutting it off with no verdict. A PR that
  # touches nothing the registry maps runs no selfcheck at all — intended, not
  # a gap: see docs/HARNESS_FIRST.md. With no base (the nightly full run) the
  # leg runs every selfcheck instead (`--all`). Either way the
  # gate skips `cost: "expensive"` selfchecks (Blender render, the packaged
  # backend, …) unless `--expensive` is passed, so `backend:smoke` stays a
  # leg of its own rather than folding into this one.
  #
  # `suiteOnly` selfchecks (they only re-run workspace test suites) are skipped
  # by the gate unless `--include-suites` is passed. No flag here: the
  # `test-packages-*` and app test legs run those suites (`--affected` with a
  # base, in full nightly), and test.yml passes `skip-tests: false`. If a
  # caller ever sets `skip-tests: true`, add `--include-suites` below, because
  # this leg is `is-test: "false"` and would then be the only one left.
  #
  # The backend suite goes the other way: it is split across four runners
  # (`test-packages-*`). As one leg it was the gate's critical path by about
  # ten minutes — every other leg finished within six minutes of `build`, that
  # one took fourteen — because ~58 vitest processes, each spawning a worker
  # per core, shared four cores. `websocket` (251 files) and `agents` (245
  # files) each get a runner of their own: their cost is one process
  # re-importing the whole backend per test file, so they are bounded by
  # cores, not by the rest of the graph. The node packages and everything
  # else split the remaining two.
  #
  # The web Jest suite (~1,600 files, ~7.5 min on one runner) is split the
  # same way, three `--shard`s, when a package it depends on changed. When
  # only files under web/src changed, one `test-web` leg runs the tests
  # related to them (`scripts/ci-plan.mjs run web`). Electron and mobile are
  # small suites and share one leg.
  built:
    name: ${{ matrix.check }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.changes.outputs.built) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Most legs only need the tip; the test-packages shards and
          # harness-gate need full history — the former for Turbo's
          # `--affected` diff against `inputs.base-sha`, the latter so
          # `git diff --name-only <base-sha>...HEAD` (inside `harness gate
          # --base`) has the commits to diff. The app legs that run
          # `scripts/ci-plan.mjs run` fetch the one base commit they diff
          # against themselves.
          fetch-depth: ${{ matrix.fetch-depth }}

      - name: Set up Node, install deps
        uses: ./.github/actions/setup-build
        with:
          extra-apt: ${{ matrix.extra-apt }}
          # The dist comes from the artifact below; don't rebuild it per leg.
          build-packages: "false"

      - name: Install Chromium for native 3D tests
        if: matrix.check == 'test-packages-core' || matrix.check == 'test-packages-agents' || matrix.check == 'harness-gate'
        run: npx playwright install --with-deps chromium

      # Ubuntu restricts user namespaces for downloaded Chromium binaries.
      # Allow only Playwright's browser paths so capture keeps its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Enable and verify the Chromium sandbox
        if: matrix.check == 'test-packages-core' || matrix.check == 'test-packages-agents' || matrix.check == 'harness-gate'
        run: |
          sudo tee /etc/apparmor.d/nodetool-playwright > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile nodetool-playwright-chromium /@{HOME}/.cache/ms-playwright/chromium-*/chrome-linux*/chrome flags=(unconfined) {
            userns,
          }

          profile nodetool-playwright-headless /@{HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/nodetool-playwright
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true });
          await browser.close();
          JS

      - name: Download package dist
        uses: actions/download-artifact@v8
        with:
          name: packages-dist
          path: packages

      # See the matching upload step in the `build` job above — a Ring 0
      # reliability run needs @nodetool-ai/reliability-harness's dist (the CLI
      # dynamic-imports it at run time) alongside the packages-dist download.
      # Only `harness-gate` can trigger one now: its `reliability-ring0`
      # selfcheck runs on any diff touching `packages/kernel/`, or on every
      # selfcheck via `--all` on push to main.
      - name: Download reliability harness dist
        if: matrix.check == 'harness-gate'
        uses: actions/download-artifact@v8
        with:
          name: reliability-harness-dist
          path: reliability/harness/dist

      # Blender 5.2 for the nodes shard only (the blender-nodes integration
      # suites skip without a binary). Ubuntu's archive ships a Blender far
      # below the 5.2 floor, so the leg downloads the release tarball from
      # download.blender.org once and caches the extracted tree — the same
      # cache-restore shape as the Playwright browsers in test.yml's
      # workflow-runner job. The version lives in one place (BLENDER_VERSION
      # below); bump it and the cache key together with the floor in
      # `blender-binary.ts`.
      - name: Cache Blender
        if: matrix.check == 'test-packages-nodes'
        uses: actions/cache@v5
        with:
          path: ~/blender
          key: ${{ runner.os }}-blender-5.2.1

      - name: Install Blender
        if: matrix.check == 'test-packages-nodes'
        env:
          BLENDER_VERSION: 5.2.1
        run: |
          if [ ! -x "$HOME/blender/blender" ]; then
            rm -rf "$HOME/blender"
            mkdir -p "$HOME/blender"
            BLENDER_RELEASE="Blender$(echo "$BLENDER_VERSION" | cut -d. -f1,2)"
            curl -fsSL "https://download.blender.org/release/${BLENDER_RELEASE}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
            tar -xJ -f /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
            rm /tmp/blender.tar.xz
          fi
          "$HOME/blender/blender" --version
          # Fail the blender-nodes suites instead of skipping them when the
          # binary above did not land (see `failWhenBlenderRequired`).
          echo "BLENDER_PATH=$HOME/blender/blender" >> "$GITHUB_ENV"
          echo "NODETOOL_REQUIRE_BLENDER=1" >> "$GITHUB_ENV"

      # mobile is NOT a root workspace (separate dependency tree), so its
      # node_modules is cached on its own lockfile and `npm ci` is skipped on hit.
      - name: Cache mobile node_modules
        if: matrix.mobile-deps == 'true'
        id: mobile-node-modules
        uses: actions/cache@v6
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-modules-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install mobile dependencies
        if: matrix.mobile-deps == 'true' && steps.mobile-node-modules.outputs.cache-hit != 'true'
        run: cd mobile && npm ci

      # Turbo test results from earlier runs of this shard. setup-build restores
      # the per-SHA `build` cache the `build` job saved, which never holds a
      # test task — restore-only legs do not save, so a test task was a cache
      # miss on every run of every commit. This restore brings in the newest
      # test-results archive for the shard (from main, or from this branch)
      # and the next step layers it onto the turbo cache; turbo keys each
      # task on its inputs and its dependencies' build hashes, so a package
      # the commit did not reach replays its last pass instead of running. On
      # PRs `--affected` prunes first, so this mostly pays on push to main,
      # where nothing else prunes.
      #
      # The archive is `.turbo/test-results`, not `.turbo/cache`: the cache
      # dir also holds the restored build outputs, ~650 MB, and four shards
      # saving that per commit would evict the node_modules and build caches
      # from the repo's 10 GB. Only the entries turbo writes during the run
      # (test tasks: logs, no outputs, tens of KB each) are collected after
      # it, on top of what was restored, and entries older than two weeks are
      # dropped so the archive stays bounded. A separate key namespace
      # (`test-results-`, not `turbo-`) so the build job's prefix fallback
      # never picks one of these up in place of a build cache.
      # ts-jest transforms every web suite's TypeScript on a cold cache. The
      # cache is keyed by file content, so main's transforms stay valid for a
      # PR. Saved only off pull requests: three shards saving per PR commit
      # would evict the node_modules and build caches from the repository's
      # 10 GB.
      - name: Restore Jest transform cache
        if: matrix.jest-cache != ''
        uses: actions/cache/restore@v5
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ matrix.jest-cache }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ matrix.jest-cache }}-

      - name: Restore backend test results
        if: startsWith(matrix.check, 'test-packages-')
        uses: actions/cache/restore@v5
        with:
          path: .turbo/test-results
          key: ${{ runner.os }}-test-results-${{ matrix.check }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-results-${{ matrix.check }}-

      # `--update=none`: a hash already in the cache dir (a build entry) is never
      # overwritten. The marker's mtime is what "written during the run"
      # means below; tar restores the archive's own mtimes, so restored
      # entries sit before it.
      - name: Layer saved test results onto the turbo cache
        if: startsWith(matrix.check, 'test-packages-')
        run: |
          mkdir -p .turbo/cache .turbo/test-results
          cp -a --update=none .turbo/test-results/. .turbo/cache/
          touch .turbo/run-start

      - name: Record native game capture environment
        if: matrix.check == 'harness-gate'
        run: |
          mkdir -p "${{ runner.temp }}/native-game-golden-diagnostics"
          node --input-type=module -e 'import { chromium } from "playwright"; import { execFileSync } from "node:child_process"; console.log(JSON.stringify({ node: process.version, chromiumExecutable: chromium.executablePath(), chromiumVersion: execFileSync(chromium.executablePath(), ["--version"], { encoding: "utf8" }).trim() }));' > "${{ runner.temp }}/native-game-golden-diagnostics/environment.json"
          cat /etc/os-release > "${{ runner.temp }}/native-game-golden-diagnostics/os-release.txt"
          fc-match system-ui > "${{ runner.temp }}/native-game-golden-diagnostics/fonts.txt"
          fc-match sans-serif >> "${{ runner.temp }}/native-game-golden-diagnostics/fonts.txt"

      - name: Run ${{ matrix.check }}
        # skip-tests drops the package + app test legs without touching the
        # static checks. The leg still spins up but does no work, so it stays
        # green (a skipped leg must not block the gate).
        if: ${{ !(inputs.skip-tests && matrix.is-test == 'true') }}
        env:
          # Base commit for Turbo's `--affected` diff, the harness gate and
          # `ci-plan.mjs run`. Empty in the nightly full run, where
          # TURBO_AFFECTED is empty too and every leg runs in full.
          TURBO_SCM_BASE: ${{ inputs.base-sha }}
          TURBO_AFFECTED: ${{ inputs.base-sha != '' && '--affected' || '' }}
          CI_BASE_SHA: ${{ inputs.base-sha }}
          NODETOOL_GAME_GOLDEN_ARTIFACTS: ${{ matrix.check == 'harness-gate' && format('{0}/native-game-golden-diagnostics', runner.temp) || '' }}
        run: |
          echo "::group::${{ matrix.check }}"
          ${{ matrix.command }} || exit $?
          echo "::endgroup::"

      - name: Retain native game golden diagnostics
        if: matrix.check == 'harness-gate' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-game-golden-diagnostics
          path: ${{ runner.temp }}/native-game-golden-diagnostics
          if-no-files-found: ignore

      # Collect and save even when a test failed: turbo only writes an entry
      # for a task that passed, so the archive carries the green packages
      # forward and the red one runs again next time. Skipped on cancel,
      # where nothing ran.
      - name: Collect this run's test results
        if: startsWith(matrix.check, 'test-packages-') && !cancelled()
        run: |
          find .turbo/cache -maxdepth 1 -type f -newer .turbo/run-start \
            -exec cp -p -t .turbo/test-results/ {} +
          find .turbo/test-results -type f -mtime +14 -delete
          echo "$(find .turbo/test-results -type f | wc -l) entries, $(du -sh .turbo/test-results | cut -f1)"

      - name: Save backend test results
        if: startsWith(matrix.check, 'test-packages-') && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .turbo/test-results
          key: ${{ runner.os }}-test-results-${{ matrix.check }}-${{ github.sha }}

      - name: Save Jest transform cache
        if: matrix.jest-cache != '' && github.event_name != 'pull_request' && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ matrix.jest-cache }}-${{ github.sha }}

  # The deploy artifact. docker.yml only builds after a merge to main, so until
  # this leg existed nothing verified the image before it landed: a Dockerfile
  # that could not build survived 49 commits on main, taking the Fly deploy with
  # it (fly-deploy.yml gates on docker.yml). Runs here, inside the gate, so it
  # blocks through the existing required check rather than a new one.
  #
  # Independent of `build` — it builds its own image and shares no artifact, so
  # it starts as soon as `changes` reports.
  #
  # Runs only when the diff changes the image's own inputs (`DOCKER_FILES` in
  # scripts/ci-plan.mjs) and in the nightly full run, never on push: docker.yml
  # builds every push to main. Building and booting a container costs a runner
  # for ~10 minutes, and the account-wide concurrency cap makes that time
  # other jobs spend queued. A skipped leg counts as a pass in the aggregate
  # below, so the required check still lands.
  docker:
    name: docker
    needs: changes
    if: ${{ !inputs.docs-only && inputs.shared && needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        # Only to read the buildcache. Fork PRs get a token that cannot, so a
        # failure here costs cache hits, not the leg.
        continue-on-error: true
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chromium downloads while nothing else needs the runner, so the browser
      # is ready the moment the container is.
      #
      # Installed in a scratch directory, never the repo: `npm install` at the
      # workspace root would reify all 60-odd workspaces, which is minutes of
      # work this leg has no use for — it talks to the container over HTTP and
      # needs nothing from the source tree but the script itself.
      #
      # No --with-deps: the ubuntu-latest image already carries the shared
      # libraries Chromium links against, and the apt update it triggers costs
      # more than the browser download.
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/smoke
          cp scripts/docker-smoke.mjs /tmp/smoke/
          cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.60.0
          npx playwright install chromium

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nodetool:ci
          build-args: |
            GIT_COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          # Reuse the layers main already published. cache-to is deliberately
          # absent — a PR must not overwrite the cache main builds from. A PR
          # that touches nothing in the image context hits cache throughout.
          cache-from: type=registry,ref=ghcr.io/nodetool-ai/nodetool:buildcache
          provenance: false
          sbom: false

      # --network host so requests reach the server over loopback. Under a
      # published port they arrive from the bridge gateway, which `local` auth
      # mode treats as remote and answers 401.
      - name: Start container
        run: |
          docker run -d --name nodetool-smoke --network host \
            -e DB_PATH=/workspace/nodetool.sqlite \
            -e SECRETS_MASTER_KEY="RE9DS0VSX1NNT0tFX0tFWV9ET19OT1RfVVNFISE=" \
            nodetool:ci

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fs http://localhost:7777/health >/dev/null; then
              echo "Healthy after ${attempt}s."
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=nodetool-smoke)" ]; then
              echo "::error::Container exited before serving /health."
              exit 1
            fi
            sleep 1
          done
          echo "::error::/health did not answer within 60s."
          exit 1

      - name: Load the app in a browser
        working-directory: /tmp/smoke
        run: node docker-smoke.mjs http://localhost:7777

      - name: Dump container logs
        if: failure()
        run: docker logs nodetool-smoke 2>&1 | tail -100

      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-screenshot
          path: /tmp/smoke/docker-smoke.png
          if-no-files-found: ignore

      - name: Stop container
        if: always()
        run: docker rm -f nodetool-smoke || true

  # Aggregating gate. Kept as job id `quality` (no custom name) so the surfaced
  # status check stays "Quality Gate (npm run check) / quality" — the existing
  # REQUIRED check, so branch protection needs no change.
  #
  # `always()` so the gate reports even when a leg is skipped. A `skipped` job
  # passes: `docker` is skipped by design when the diff cannot reach the image,
  # and a leg skipped that way must not hold the required check red. Anything
  # else — failure, cancelled, or a leg skipped because its own upstream failed
  # — fails the gate.
  quality:
    name: quality
    needs: [changes, static, build, built, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all-passed: ${{ steps.gate.outputs.all-passed }}
    steps:
      - name: Aggregate check results
        id: gate
        run: |
          failed=""
          echo "## Quality Gate" >> $GITHUB_STEP_SUMMARY
          for leg in \
            "changes:${{ needs.changes.result }}" \
            "static:${{ needs.static.result }}" \
            "build:${{ needs.build.result }}" \
            "built:${{ needs.built.result }}" \
            "docker:${{ needs.docker.result }}"; do
            name="${leg%%:*}"
            result="${leg#*:}"
            echo "- \`$name\`: $result" >> $GITHUB_STEP_SUMMARY
            case "$result" in
              success|skipped) ;;
              *) failed="$failed $name" ;;
            esac
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -z "$failed" ]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
            echo "✅ **All quality checks passed.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
            echo "❌ **Quality checks failed:**$failed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See the individual check legs above to find which one." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
