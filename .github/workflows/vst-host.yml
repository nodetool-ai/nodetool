name: VST host

# Builds NodeToolVstHost and runs vst_host_test on every desktop platform when
# the helper or its build changes. The desktop release builds it the same way.
on:
  pull_request:
    paths:
      - "native/vst-host/**"
      - "electron/scripts/build-vst-host.mjs"
      - ".github/workflows/vst-host.yml"
      - ".github/scripts/with-window-manager.sh"
      - "docker/ci-native/**"
  push:
    branches: [main]
    paths:
      - "native/vst-host/**"
      - "electron/scripts/build-vst-host.mjs"
      - ".github/workflows/vst-host.yml"
      - ".github/scripts/with-window-manager.sh"

permissions:
  contents: read

concurrency:
  group: vst-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Linux leg runs in the native CI image (docker/ci-native/) instead of
  # installing its system packages with apt.
  ci-image:
    uses: ./.github/workflows/ci-image.yml
    with:
      image: ci-native
    permissions:
      contents: read
      packages: write

  build:
    needs: ci-image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    # An empty image runs the job on the runner itself: macOS and Windows.
    container:
      image: ${{ matrix.os == 'ubuntu-latest' && needs.ci-image.outputs.image || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Build and test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # The editor test needs a display and window-manager atoms, even headlessly.
            bash "$GITHUB_WORKSPACE/.github/scripts/with-window-manager.sh" node electron/scripts/build-vst-host.mjs --test
          else
            node electron/scripts/build-vst-host.mjs --test
          fi
