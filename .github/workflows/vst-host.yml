name: VST host

# Builds NodeToolVstHost and runs vst_host_test on every desktop platform when
# the helper or its build changes. The desktop release builds it the same way.
on:
  pull_request:
    paths:
      - "native/vst-host/**"
      - "electron/scripts/build-vst-host.mjs"
      - ".github/workflows/vst-host.yml"
  push:
    branches: [main]
    paths:
      - "native/vst-host/**"
      - "electron/scripts/build-vst-host.mjs"
      - ".github/workflows/vst-host.yml"

permissions:
  contents: read

concurrency:
  group: vst-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install build libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            xvfb xauth xfwm4 dbus-x11 x11-utils

      - name: Build and test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # The editor test needs a display and window-manager atoms, even headlessly.
            xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
              xfwm4 --compositor=off --sm-client-disable &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              for attempt in {1..50}; do
                if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
                  node electron/scripts/build-vst-host.mjs --test
                  exit 0
                fi
                sleep 0.1
              done
              echo "Window manager did not become ready" >&2
              exit 1
            '
          else
            node electron/scripts/build-vst-host.mjs --test
          fi
