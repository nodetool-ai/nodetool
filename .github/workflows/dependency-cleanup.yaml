name: Dependency Cleanup

on:
  schedule:
    - cron: "0 3 * * 6" # Saturdays at 03:00 UTC
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}
      recent-files: ${{ steps.preflight.outputs.recent-files }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_PATTERN: 'clean up dependencies'
        run: node .github/scripts/agent-preflight.mjs --name dependency-cleanup --title "$TITLE_PATTERN"

  dependency-cleanup:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-build
        with:
          build-packages: "false"

      - name: Install mobile dependencies
        run: cd mobile && npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash,Edit,Read,Replace,CreatePullRequest"
            --append-system-prompt "Before finalizing any code change or PR, invoke the unslop skill (.claude/skills/unslop/SKILL.md) and apply its checklist to your diff. Strip speculative abstractions, narrating comments, defensive try/catch on trusted paths, useEffect-for-derived-data, raw MUI imports outside ui_primitives/, whole-store Zustand subscriptions, useEffect+fetch instead of useQuery, and prose throat-clearing. Open the PR with the label agent:dependency-cleanup (gh pr create --label agent:dependency-cleanup). Before opening the PR, apply the code-review skill (.claude/skills/code-review/SKILL.md) to your own diff, fix every finding, and list any finding you did not fix, with the reason, under a Self-review heading in the PR body."
          prompt: |
            # Dependency Cleanup

            Remove dependencies nothing uses and move misplaced ones. Version
            updates are Dependabot's job (`.github/dependabot.yml`): do not bump,
            align, or refresh any version here.

            ## Scope
            - `/web/package.json`
            - `/electron/package.json`
            - `/mobile/package.json`
            - `/packages/*/package.json`

            ## What to fix

            **Unused dependencies**: For each dependency in `dependencies` and `devDependencies`, search the source code to verify it's actually imported/required. Remove any that have zero imports. Be careful with:
            - Vite/build plugins (referenced in config files, not source)
            - Type packages (`@types/*`) — check if the parent package is used
            - PostCSS/Babel/ESLint plugins (referenced in config files)
            - Packages used only in scripts defined in package.json

            **Misplaced dependencies**: Runtime packages in `devDependencies` or dev-only packages in `dependencies`. Move them to the correct section.

            ## Rules
            - Never change a version range. If the only change left is a version, open no PR.
            - Do not remove packages you cannot verify are unused — search source, configs, and scripts.
            - Do not touch CI workflow files.
            - Update the lockfile with `npm install` at the root (or `npm --prefix mobile install` for mobile), then run `npm run fix:lockfile-libc`.
            - If nothing is unused or misplaced, open no PR.

            ## Before starting
            - Run `gh pr list --state open --limit 20` — skip if a dependency cleanup PR is already open.

            ## Verification
            After changes, reinstall and verify:
            ```bash
            npm ci && cd mobile && npm ci && cd ..
            npm run typecheck && npm run lint && npm run test
            ```

            ## Submit
            Create a PR titled "chore: clean up dependencies" listing each package removed or moved and the search that shows it is unused or misplaced.
