name: Mutation Testing (merged changes)

# Runs nodetool-mutator once a day on the functions that commits merged to
# main added or rewrote in the mutation-tested packages, and lists the
# mutants their tests fail to kill. Per-PR runs cost too much runner time.
# The base is the head of the last successful scheduled run, so a failed or
# skipped day is covered by the next one. Without such a run, the base is the
# last main commit from before the previous 24 hours. Dispatch with `base` to
# choose it. Only functions whose text differs from the base are mutated
# (`--base`), so the cost follows the size of the day's changes. Advisory: a
# survivor is a question for the authors, not a failed build.

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to diff against (default: head of the last successful scheduled run)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Pull the CI image.
  packages: read

jobs:
  # The Linux image the jobs below run in (docker/ci/). Built here on the
  # first run after docker/ci/ changes, found in seconds otherwise.
  ci-image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  plan:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Every job checks out the run's own commit (github.sha), which a later
      # push to main does not move. The partition and aggregate steps verify
      # that their tree matches the frozen plan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-build
      - name: Find the head of the last successful scheduled run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.base }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "head=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation-changed.yml \
            --branch main --event schedule --status success --limit 1 \
            --json headSha --jq '.[0].headSha // ""')
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Resolve the base commit
        id: base
        env:
          PREVIOUS: ${{ steps.previous.outputs.head }}
        run: node scripts/mutation-ci.mjs base "$PREVIOUS"
      - name: Freeze the complete changed-function selection
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: node scripts/mutation-ci.mjs plan "$BASE" .metrics/mutation-ci/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan-attempt-${{ github.run_attempt }}
          path: .metrics/mutation-ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          overwrite: true
          path: .metrics/mutation-ci/plan.json
          include-hidden-files: true
          if-no-files-found: error

  mutate-changed:
    needs: [ci-image, plan]
    if: needs.plan.outputs.mutants != '0'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001 --privileged
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # The baseline runs every test related to a mutated file, including
      # real-Chromium 3D captures, which need Chromium and the CPU Vulkan
      # driver the CI image ships.
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: .metrics/mutation-ci
      - name: Install Chromium for native 3D tests
        run: npx playwright install chromium
      - name: Enable and verify the Chromium sandbox
        uses: ./.github/actions/chromium-sandbox

      - name: Mutate every assigned changed-function site
        env:
          PARTITION: ${{ matrix.partition }}
        run: node scripts/mutation-ci.mjs run .metrics/mutation-ci/plan.json "$PARTITION" ".metrics/mutation-ci/partition-$PARTITION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-evidence-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: .metrics/mutation-ci/partition-${{ matrix.partition }}
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-result-partition-${{ matrix.partition }}
          path: .metrics/mutation-ci/partition-${{ matrix.partition }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  mutation-complete:
    needs: [ci-image, plan, mutate-changed]
    if: always() && needs.plan.outputs.mutants != '0'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    timeout-minutes: 45
    steps:
      - name: Require every partition to finish
        env:
          PLAN: ${{ needs.plan.result }}
          MUTATIONS: ${{ needs.mutate-changed.result }}
        run: test "$PLAN" = success && test "$MUTATIONS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: .metrics/mutation-ci
      - name: Download one partition result
        if: ${{ !fromJSON(needs.plan.outputs.matrix).partition[1] }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-result-partition-${{ fromJSON(needs.plan.outputs.matrix).partition[0] }}
          path: .metrics/mutation-ci/results/mutation-result-partition-${{ fromJSON(needs.plan.outputs.matrix).partition[0] }}
      - name: Download partition results
        if: ${{ fromJSON(needs.plan.outputs.matrix).partition[1] }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-result-partition-*
          path: .metrics/mutation-ci/results
      - name: Verify the exact union and report survivors
        run: >-
          node scripts/mutation-ci.mjs aggregate .metrics/mutation-ci/plan.json
          .metrics/mutation-ci/results
