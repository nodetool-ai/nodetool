name: Mutation Testing (changed functions)

# Runs nodetool-mutator on the functions a pull request adds or rewrites in the
# mutation-tested packages, and lists the mutants its tests fail to kill. Only
# functions whose text differs from the merge-base are mutated (`--base`), so
# the cost follows the size of the change. Advisory: a survivor is a question
# for the author and reviewer, not a failed build.

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/agents/src/**"
      - "packages/auth/src/**"
      - "packages/config/src/**"
      - "packages/kernel/src/**"
      - "packages/mutator/src/**"
      - "packages/node-sdk/src/**"
      - "packages/runtime/src/**"
      - "packages/security/src/**"
      - "packages/storage/src/**"
      - ".github/workflows/mutation-changed.yml"
      - "scripts/mutation-ci.mjs"
      - "scripts/mutation-score.mjs"
      - "scripts/__tests__/mutation-ci.test.mjs"
      - "packages/mutator/tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      head: ${{ steps.plan.outputs.head }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-build
      - name: Freeze the complete changed-function selection
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/mutation-ci.mjs plan "$BASE" .metrics/mutation-ci/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan-attempt-${{ github.run_attempt }}
          path: .metrics/mutation-ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          overwrite: true
          path: .metrics/mutation-ci/plan.json
          include-hidden-files: true
          if-no-files-found: error

  mutate-changed:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-build
        with:
          # The baseline runs every test related to a mutated file, including
          # real-Chromium 3D captures, which need Chromium and the CPU Vulkan
          # driver the package test legs install.
          extra-apt: mesa-vulkan-drivers ffmpeg
      - name: Install Chromium for native 3D tests
        run: npx playwright install --with-deps chromium
      # Ubuntu restricts user namespaces for downloaded Chromium binaries.
      # Allow only Playwright's browser paths so capture keeps its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Enable the Chromium sandbox
        run: |
          sudo tee /etc/apparmor.d/nodetool-playwright > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile nodetool-playwright-chromium /@{HOME}/.cache/ms-playwright/chromium-*/chrome-linux*/chrome flags=(unconfined) {
            userns,
          }

          profile nodetool-playwright-headless /@{HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/nodetool-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: .metrics/mutation-ci
      - name: Install Chromium for native 3D tests
        run: npx playwright install --with-deps chromium

      # Ubuntu restricts user namespaces for downloaded Chromium binaries.
      # Allow only Playwright's browser paths so capture keeps its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Enable and verify the Chromium sandbox
        run: |
          sudo tee /etc/apparmor.d/nodetool-playwright > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile nodetool-playwright-chromium /@{HOME}/.cache/ms-playwright/chromium-*/chrome-linux*/chrome flags=(unconfined) {
            userns,
          }

          profile nodetool-playwright-headless /@{HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/nodetool-playwright
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true });
          await browser.close();
          JS


      - name: Mutate every assigned changed-function site
        env:
          PARTITION: ${{ matrix.partition }}
        run: node scripts/mutation-ci.mjs run .metrics/mutation-ci/plan.json "$PARTITION" ".metrics/mutation-ci/partition-$PARTITION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-evidence-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: .metrics/mutation-ci/partition-${{ matrix.partition }}
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-result-partition-${{ matrix.partition }}
          path: .metrics/mutation-ci/partition-${{ matrix.partition }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  mutation-complete:
    needs: [plan, mutate-changed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require every partition to finish
        env:
          PLAN: ${{ needs.plan.result }}
          MUTATIONS: ${{ needs.mutate-changed.result }}
        run: test "$PLAN" = success && test "$MUTATIONS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: .metrics/mutation-ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-result-partition-*
          path: .metrics/mutation-ci/results
      - name: Verify the exact union and report survivors
        run: >-
          node scripts/mutation-ci.mjs aggregate .metrics/mutation-ci/plan.json
          .metrics/mutation-ci/results
