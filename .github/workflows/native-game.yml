name: Native game

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/game/**"
      - "packages/game-runtime/src/native*"
      - "packages/game-runtime/scripts/*native*"
      - "packages/game-runtime/tests/native*"
      - "packages/game-runtime/src/native-browser/**"
      - "packages/game-renderer/src/native-cpp/**"
      - "packages/game-renderer/src/standalone-native-player.ts"
      - "packages/game-renderer/scripts/bundle-native-browser.mjs"
      - "packages/game-renderer/scripts/check-native-browser-host.mjs"
      - "packages/game-renderer/tests/native-browser*"
      - "packages/cli-game/src/commands/game-native-cpp.ts"
      - "packages/cli-game/tests/game-native-cpp.test.ts"
      - "packages/agents/src/capabilities/native-cpp-game*"
      - "packages/agents/tests/capabilities-native-cpp-game.test.ts"
      - "scripts/lib/stage-package-assets.mjs"
      - "scripts/__tests__/native-game-delivery.test.mjs"
      - "packages/protocol/src/native-game.ts"
      - "packages/protocol/scripts/generate-native-game-schema.ts"
      - "packages/protocol/tests/fixtures/native-game/**"
      - "scripts/check-native-game*.mjs"
      - ".github/workflows/native-game.yml"

permissions:
  contents: read

concurrency:
  group: native-game-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"

jobs:
  browser:
    name: Installed native browser export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run rebuild:native
          npx playwright install --with-deps chromium
      - name: Provision pinned browser SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          version=$(cat native/game/browser/emsdk.version)
          "$RUNNER_TEMP/emsdk/emsdk" install "$version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$version"
      - name: Build installed browser profile
        run: |
          node native/game/browser/build.mjs --sdk "$RUNNER_TEMP/emsdk" --build-dir "$RUNNER_TEMP/game-wasm" --output-dir packages/game-renderer/dist
          npm run build:packages
          node scripts/check-native-game.mjs
      - name: Verify browser exports and authoring
        env:
          NODETOOL_NATIVE_BROWSER_REPORT_DIR: ${{ runner.temp }}/native-browser-reports
        run: node scripts/check-native-game-browser.mjs
      - name: Preserve browser profile for native comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-browser-profile
          path: |
            packages/game-renderer/dist/native-game.mjs
            packages/game-renderer/dist/native-game.wasm
  player:
    name: Linux tools, editor, and delivery
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build workspace packages
        run: |
          npm run rebuild:native
          npm run build:packages
      - name: Install graphics and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libegl1 \
            xvfb xauth libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1
          pipx run aqtinstall install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtshadertools -O "$RUNNER_TEMP/qt"
          echo "NODETOOL_GAME_QT_PREFIX=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          icd=$(compgen -G '/usr/share/vulkan/icd.d/lvp_icd*.json' | head -1 || true)
          if [[ -z "$icd" ]]; then
            echo "::error::mesa-vulkan-drivers installed no lavapipe ICD"
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Verify software graphics adapter
        run: vulkaninfo --summary
      - name: Build and test native runtime
        run: node scripts/check-native-game.mjs
      - name: Build and test player and captures
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          QSG_INFO: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/check-native-game-player.mjs

      - name: Verify native authoring tools
        run: node scripts/check-native-game-service.mjs
      - name: Build and test Qt editor
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/check-native-game-editor.mjs
      - name: Verify standalone runtime delivery
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/check-native-game-delivery.mjs
      - name: Verify benchmark workloads
        run: node scripts/check-native-game-bench.mjs
      - name: Install runtime for graphical agent tools
        run: cmake --install native/game/build-player --prefix "$RUNNER_TEMP/native-game-runtime"
      - name: Restore native browser profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-browser-profile
          path: packages/game-renderer/dist
      - name: Compare native and browser rendering
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
        run: |
          npx playwright install --with-deps chromium
          npm run build:native-browser --workspace=packages/game-renderer
          xvfb-run -a node scripts/check-native-game-browser.mjs --native-player "$RUNNER_TEMP/native-game-runtime/bin/game-player" --native-runtime "$RUNNER_TEMP/native-game-runtime"
      - name: Verify agent capture and export tools
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          NODETOOL_NATIVE_GAME_PLAYER: ${{ github.workspace }}/native/game/build-player/game-player
          NODETOOL_NATIVE_GAME_RUNTIME_DIR: ${{ runner.temp }}/native-game-runtime
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test --workspace=packages/agents -- capabilities-native-cpp-game.test.ts
