name: Native realtime core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/realtime/**"
      - "native/graph-runner/guest/host/gpu-catalog.mjs"
      - "packages/gpu/**"
      - ".github/workflows/native-realtime.yml"
  push:
    branches: [main]
    paths:
      - "native/realtime/**"
      - "native/graph-runner/guest/host/gpu-catalog.mjs"
      - "packages/gpu/**"
      - ".github/workflows/native-realtime.yml"

permissions:
  contents: read

concurrency:
  group: native-realtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline exports / software adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and adapter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ mesa-vulkan-drivers libsecret-1-0
      - name: Set up package dependencies
        uses: ./.github/actions/setup-build
        with:
          package-media: "false"
          build-packages: "false"
      - name: Build shader catalog dependencies
        run: |
          npm run build --workspace=packages/protocol
          npm run build --workspace=packages/gpu
      - name: Select lavapipe
        shell: bash
        run: |
          set -euo pipefail
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_ICD_FILENAMES=$driver" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
      - name: Verify offline exports and required test inventory
        run: env -u DISPLAY node native/realtime/scripts/check.mjs
  core:
    name: Core / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [release, sanitize, tsan]
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    defaults:
      run:
        working-directory: native/realtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error
