# Native timeline prototype (native/timeline/, PLAN M6): build and run the
# headless ctest suite on macOS, Linux and Windows. No test opens a window or
# plays a sound. The render tests (ctest label `render`) need the platform
# QRhi: Metal on Cocoa (macOS), Vulkan on Mesa lavapipe through xcb under Xvfb
# (Linux), D3D11 on WARP through the Windows platform (Windows); a step checks
# the backend and the adapter in their log. The window-event tests set the
# offscreen platform themselves (ctest ENVIRONMENT). Audio runs on miniaudio's
# null backend. Hosted runners have no hardware video decoder, so the
# hardware decode tests are skipped (NT_NO_HW_DECODE=1); the benches and the
# window checks (scripts/window-checks.sh) need a reference machine.
name: Native timeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/timeline/**"
      - "native/ui_primitives/**"
      - "native/chat/**"
      - "native/model-picker/**"
      - ".github/workflows/native-timeline.yml"

permissions:
  contents: read

concurrency:
  group: native-timeline-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  NT_NO_HW_DECODE: "1"
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set native temporary paths
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      # Scratch-server and golden checks also load decorated node packages.
      - name: Build the server and timeline packages
        env:
          NODETOOL_TURBO_CONCURRENCY: "2"
        run: |
          npm ci --ignore-scripts
          npm run rebuild:native
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npm run build:packages:tsc
          else
            npm run build:packages
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkgconf ffmpeg ffmpeg-full harfbuzz freetype lame openh264 opus libvpx ccache
          # The regular formula omits drawtext, which the numbered fixtures need.
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          # Homebrew's Qt lags behind the Qt version the build requires.
          pipx run aqtinstall install-qt mac desktop "$QT_VERSION" clang_64 -m qtshadertools qtwebsockets -O "$RUNNER_TEMP/qt"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb ccache ninja-build pkg-config nasm ffmpeg libmp3lame-dev libopenh264-dev libopus-dev libvpx-dev libva-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libegl1 \
            libasound2-dev libpulse-dev libharfbuzz-dev libfreetype-dev \
            xvfb xauth libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1
          # Vulkan on lavapipe only: the loader sees no other driver.
          icd=$(compgen -G '/usr/share/vulkan/icd.d/lvp_icd*.json' | head -1 || true)
          if [[ -z "$icd" ]]; then
            echo "::error::mesa-vulkan-drivers installed no lavapipe ICD"
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$icd vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo.txt"
          grep -qi "llvmpipe" "$RUNNER_TEMP/vulkaninfo.txt"
          pipx run aqtinstall install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtshadertools qtwebsockets -O "$RUNNER_TEMP/qt"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          # FFmpeg as LGPL shared libraries, as the packages ship it.
          native/timeline/scripts/build-ffmpeg-lgpl.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/native/timeline/build-ffmpeg-lgpl/install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/native/timeline/build-ffmpeg-lgpl/install/lib" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ninja pkgconfiglite
          # HarfBuzz and FreeType for the 2D rasterizer (src/render2d).
          vcpkg install harfbuzz freetype --triplet x64-windows
          vcpkg_root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "CMAKE_PREFIX_PATH=$vcpkg_root" >> "$GITHUB_ENV"
          echo "$vcpkg_root/bin" >> "$GITHUB_PATH"
          # aqtinstall cannot read the per-toolchain repository layout of Qt 6.12.
          qtv=$(echo "$QT_VERSION" | tr -d .)
          python native/timeline/scripts/fetch-qt.py \
            "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_$qtv/qt6_${qtv}_msvc2022_64" \
            "$RUNNER_TEMP/qt/$QT_VERSION/msvc2022_64" \
            "qt.qt6.$qtv.win64_msvc2022_64" \
            "qt.qt6.$qtv.addons.qtshadertools.win64_msvc2022_64" \
            "qt.qt6.$qtv.addons.qtwebsockets.win64_msvc2022_64"
          qt="$RUNNER_TEMP/qt/$QT_VERSION/msvc2022_64"
          echo "QT_PREFIX=$qt" >> "$GITHUB_ENV"
          # Qt's DLLs, for the tests and windeployqt.
          echo "$qt/bin" >> "$GITHUB_PATH"
          # FFmpeg 8.0 LGPL shared libraries for linking, and the GPL command
          # line tool (libx264, drawtext) for the test media only. A pinned,
          # retained BtbN release, checked against its published checksums.
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-02-28-12-59
          lgpl=ffmpeg-n8.0.1-66-g27b8d1a017-win64-lgpl-shared-8.0
          gpl=ffmpeg-n8.0.1-66-g27b8d1a017-win64-gpl-8.0
          curl -sSfL -o "$RUNNER_TEMP/$lgpl.zip" "$base/$lgpl.zip"
          curl -sSfL -o "$RUNNER_TEMP/$gpl.zip" "$base/$gpl.zip"
          (cd "$RUNNER_TEMP" && sha256sum -c - <<'SUMS'
          e7b1087c310cf8b91f5467b8ada6d7e47ce26f2777efa2317c7cc271087e5100  ffmpeg-n8.0.1-66-g27b8d1a017-win64-lgpl-shared-8.0.zip
          e1f9fc491ef1969e666cfe36ec1d6c02b53baf49df800d5256eda10c942b1251  ffmpeg-n8.0.1-66-g27b8d1a017-win64-gpl-8.0.zip
          SUMS
          )
          7z x -o"$RUNNER_TEMP" "$RUNNER_TEMP/$lgpl.zip" > /dev/null
          7z x -o"$RUNNER_TEMP" "$RUNNER_TEMP/$gpl.zip" > /dev/null
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/$lgpl/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "FFMPEG_LGPL_BIN=$RUNNER_TEMP/$lgpl/bin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$lgpl/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/$gpl/bin" >> "$GITHUB_PATH"

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Restore compiler cache
        id: compiler-cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-

      - name: Verify prerequisites and prepare media
        run: |
          node native/timeline/scripts/check-ci-prerequisites.mjs
          node --test native/timeline/scripts/check-ci-prerequisites.test.mjs \
            native/timeline/scripts/measure-psnr.test.mjs \
            native/timeline/src/server/sync/sync-e2e-transport.test.mjs
          native/timeline/scripts/make-fixtures.sh

      - name: Configure
        run: |
          launcher=()
          if command -v ccache >/dev/null 2>&1; then
            launcher=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            if [[ "$RUNNER_OS" == macOS ]]; then launcher+=(-DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache); fi
          fi
          cmake -S native/timeline -B native/timeline/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" "${launcher[@]}"

      - name: Build
        id: native-build
        # -k 0 reports every failing file in one run, not only the first.
        run: cmake --build native/timeline/build-ci --parallel 3 -- -k 0

      # Preserve successful compilation even when a later test fails.
      - name: Save compiler cache
        if: runner.os != 'Windows' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # The offscreen QPA platform has no QRhi: Qt Quick falls back to the
      # software scene graph there, and tst_editpreview cannot initialize its
      # render control. So no step sets QT_QPA_PLATFORM=offscreen globally;
      # the window-event tests set it in their ctest ENVIRONMENT.
      # macOS renders windowless through Metal on the Cocoa platform. Linux:
      # xcb on Xvfb, Vulkan on lavapipe (the renderers attach a
      # QVulkanInstance, hw/HwWindow.cpp). Windows: the Windows platform,
      # D3D11 on the WARP software adapter.
      # The render tests run apart, with the scene graph and QRhi logs on, and
      # the log must name the backend and the adapter.
      - name: Test (headless, macOS)
        if: runner.os == 'macOS'
        run: |
          ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render
          QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render --no-tests=error -V \
            | tee "$RUNNER_TEMP/render.log"
          grep -q "Creating QRhi with backend Metal" "$RUNNER_TEMP/render.log" ||
            { echo "::error::the render tests did not run on Metal"; exit 1; }

      - name: Test (headless, Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render
          QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" xvfb-run -a -s "-screen 0 1920x1080x24" \
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render --no-tests=error -V \
            | tee "$RUNNER_TEMP/render.log"
          grep -q "Creating QRhi with backend Vulkan" "$RUNNER_TEMP/render.log" ||
            { echo "::error::the render tests did not run on Vulkan"; exit 1; }
          grep -A1 "Physical device [0-9]*: 'llvmpipe" "$RUNNER_TEMP/render.log" | grep "using this physical device" > /dev/null ||
            { echo "::error::the render tests did not run on lavapipe"; exit 1; }

      - name: Test (headless, Windows)
        if: runner.os == 'Windows'
        env:
          QSG_RHI_BACKEND: d3d11
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
        run: |
          ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render
          QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render --no-tests=error -V \
            | tee "$RUNNER_TEMP/render.log"
          grep -q "Creating QRhi with backend D3D11" "$RUNNER_TEMP/render.log" ||
            { echo "::error::the render tests did not run on D3D11"; exit 1; }
          grep -A1 "Adapter [0-9]*: 'Microsoft Basic Render Driver'" "$RUNNER_TEMP/render.log" | grep "using this adapter" > /dev/null ||
            { echo "::error::the render tests did not run on WARP"; exit 1; }

      - name: Diagnose Linux matte crash
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          QSG_INFO: "1"
        run: |
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          if [[ ! -f "$failed" ]] || ! grep -q ':tst_mattecarrier$' "$failed"; then
            exit 0
          fi
          diagnostic_status=0
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            gdb --return-child-result -batch -ex 'set pagination off' -ex 'set debuginfod enabled off' \
              -ex run -ex 'thread apply all bt' --args native/timeline/build-ci/tst_mattecarrier \
              > "$RUNNER_TEMP/matte-gdb.log" 2>&1 || diagnostic_status=$?
          cat "$RUNNER_TEMP/matte-gdb.log"
          exit "$diagnostic_status"

      - name: Upload Linux matte diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-timeline-matte-backtrace
          path: ${{ runner.temp }}/matte-gdb.log
          if-no-files-found: ignore

      - name: Package (macOS, unsigned)
        if: runner.os == 'macOS'
        run: |
          native/timeline/scripts/package-macos.sh
          DEV_BIN=build-ci/nodetool-timeline native/timeline/scripts/check-package-macos.sh

      # Not verified: written for M6 (review F12); no run has checked it.
      # The smoke runs use a copy of the package in a fresh folder, with PATH
      # cut to the Windows system folders and no Qt variable, so a DLL, a
      # plug-in or a QML import missing from the package cannot load from the
      # Qt or FFmpeg folders of the build (review F3). They render the whole
      # QML editor (--screenshot) and decode video through the packaged
      # FFmpeg (--stills).
      - name: Package (Windows, windeployqt, unverified)
        if: runner.os == 'Windows'
        run: |
          out=native/timeline/build-ci/package-windows
          rm -rf "$out" && mkdir -p "$out"
          cp native/timeline/build-ci/nodetool-timeline.exe "$out/"
          windeployqt --release --qmldir native/timeline/qml --no-translations "$out/nodetool-timeline.exe"
          cp "$FFMPEG_LGPL_BIN"/*.dll "$out/"
          mkdir -p "$out/licenses"
          cp native/timeline/licenses/*.txt native/timeline/fonts/LICENSE-*.txt "$out/licenses/"
          tmp=$(cygpath -u "$RUNNER_TEMP")
          copy="$tmp/package-copy"
          rm -rf "$copy" && cp -R "$out" "$copy"
          smoke="$tmp/package-smoke"
          rm -rf "$smoke" && mkdir -p "$smoke"
          cd native/timeline
          (
            export PATH="/c/Windows/System32:/c/Windows:/c/Windows/System32/Wbem"
            unset QT_PLUGIN_PATH QML_IMPORT_PATH QML2_IMPORT_PATH QT_QPA_PLATFORM_PLUGIN_PATH QT_QPA_PLATFORM
            export QSG_RHI_BACKEND=d3d11 QSG_RHI_PREFER_SOFTWARE_RENDERER=1
            exe="$copy/nodetool-timeline.exe"
            "$exe" fixtures/three-tracks.json --dump-plan --times 0,8500 > /dev/null
            dry=$("$exe" fixtures/av-sync.json --audio-dry-run)
            [[ "$dry" == "audio mode: system" ]] || { echo "::error::--audio-dry-run printed '$dry'"; exit 1; }
            "$exe" fixtures/three-tracks.json --screenshot "$smoke/editor.png" --audio none
            [[ -s "$smoke/editor.png" ]] || { echo "::error::--screenshot of the packaged editor wrote nothing"; exit 1; }
            "$exe" fixtures/video-cuts.json --stills "$smoke/stills" --still-frames 0,59,60 --audio none
            shopt -s nullglob  # only bash builtins here: PATH has no Git tools
            stills=("$smoke"/stills/frame_*.png)
            [[ ${#stills[@]} == 3 ]] || { echo "::error::expected 3 stills from the package, got ${#stills[@]}"; exit 1; }
          )

      # Not verified: written for M6 (review F12); no run has checked it.
      - name: Package (Linux AppImage, unverified)
        if: runner.os == 'Linux'
        run: |
          dir=native/timeline/build-ci/AppDir
          rm -rf "$dir" && mkdir -p "$dir/usr/bin" "$dir/usr/share/licenses/nodetool-timeline"
          cp native/timeline/build-ci/nodetool-timeline "$dir/usr/bin/"
          cp native/timeline/licenses/*.txt native/timeline/fonts/LICENSE-*.txt "$dir/usr/share/licenses/nodetool-timeline/"
          printf '[Desktop Entry]\nType=Application\nName=NodeTool Timeline\nExec=nodetool-timeline\nIcon=nodetool-timeline\nCategories=AudioVideo;\n' > "$dir/nodetool-timeline.desktop"
          convert -size 256x256 xc:'#202024' "$dir/nodetool-timeline.png" 2> /dev/null || cp /usr/share/pixmaps/debian-logo.png "$dir/nodetool-timeline.png" || true
          curl -sSfL -o "$RUNNER_TEMP/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl -sSfL -o "$RUNNER_TEMP/linuxdeploy-qt" https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          (cd "$RUNNER_TEMP" && sha256sum -c - <<'SUMS'
          4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a  linuxdeploy
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-qt
          SUMS
          )
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/linuxdeploy-qt"
          export PATH="$RUNNER_TEMP:$PATH" QMAKE="$QT_PREFIX/bin/qmake" QML_SOURCES_PATHS=native/timeline/qml APPIMAGE_EXTRACT_AND_RUN=1
          ln -sf "$RUNNER_TEMP/linuxdeploy-qt" "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          linuxdeploy --appdir "$dir" --desktop-file "$dir/nodetool-timeline.desktop" --icon-file "$dir/nodetool-timeline.png" \
            --plugin qt --output appimage
          ls -la ./*.AppImage

  sanitizers:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, tsan]
    defaults:
      run:
        shell: bash
        working-directory: native/timeline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set native temporary paths
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
      - name: Build the server and timeline packages
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm run rebuild:native
          npm run build:packages
      - name: Install dependencies (Linux)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev ccache ninja-build pkg-config nasm ffmpeg libmp3lame-dev libopenh264-dev libopus-dev libvpx-dev libva-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libegl1 \
            libasound2-dev libpulse-dev libharfbuzz-dev libfreetype-dev \
            xvfb xauth libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1
          # Vulkan on lavapipe only: the loader sees no other driver.
          icd=$(compgen -G '/usr/share/vulkan/icd.d/lvp_icd*.json' | head -1 || true)
          if [[ -z "$icd" ]]; then
            echo "::error::mesa-vulkan-drivers installed no lavapipe ICD"
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$icd vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo.txt"
          grep -qi "llvmpipe" "$RUNNER_TEMP/vulkaninfo.txt"
          pipx run aqtinstall install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtshadertools qtwebsockets -O "$RUNNER_TEMP/qt"
          echo "QT_PREFIX=$RUNNER_TEMP/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          # FFmpeg as LGPL shared libraries, as the packages ship it.
          native/timeline/scripts/build-ffmpeg-lgpl.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/native/timeline/build-ffmpeg-lgpl/install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/native/timeline/build-ffmpeg-lgpl/install/lib" >> "$GITHUB_ENV"

      - name: Verify prerequisites and prepare media
        run: |
          node scripts/check-ci-prerequisites.mjs
          scripts/make-fixtures.sh
      - name: Configure
        run: |
          cmake --preset "${{ matrix.preset }}" -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: nice -n 10 cmake --build --preset "${{ matrix.preset }}" -j 3
      - name: Verify checker fixtures
        run: |
          node tools/sanitizers/check-plants.mjs --self-test
          node tools/sanitizers/check-plants.mjs "${{ matrix.preset }}"
      - name: Test on lavapipe
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          QSG_INFO: "1"
        run: xvfb-run -a ctest --preset "${{ matrix.preset }}" --output-on-failure
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-timeline-${{ matrix.preset }}
          path: native/timeline/build-${{ matrix.preset }}/Testing/Temporary/
