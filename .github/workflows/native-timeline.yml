# Native timeline prototype (native/timeline/, PLAN M6): build and run the
# headless ctest suite on macOS, Linux and Windows. No test opens a window or
# plays a sound. The render tests (ctest label `render`) need the platform
# QRhi: Metal on Cocoa (macOS), Vulkan on Mesa lavapipe through xcb under Xvfb
# (Linux), D3D11 on WARP through the Windows platform (Windows); a step checks
# the backend and the adapter in their log. The window-event tests set the
# offscreen platform themselves (ctest ENVIRONMENT). Audio runs on miniaudio's
# null backend. Hosted runners have no hardware video decoder, so the
# hardware decode tests are skipped (NT_NO_HW_DECODE=1); the benches and the
# window checks (scripts/window-checks.sh) need a reference machine.
# Packaging the app runs only in native-timeline-release.yml, on release tags.
name: Native timeline

# Pull requests and main pushes run only when native code or this workflow
# changes. The oracle and golden tests also compare against the TypeScript
# packages in REFERENCE_PATHS (the `changes` job). A change there alone no
# longer runs this workflow on its pull request. The nightly run tests main
# instead, and only when a commit in the last day touched those packages.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
  pull_request:
    paths:
      - "native/timeline/**"
      - "native/ui_primitives/**"
      - "native/chat/**"
      - "native/model-picker/**"
      - "native/kernels/**"
      - ".github/workflows/native-timeline.yml"
      - ".github/actions/setup-native-timeline/**"
      - "docker/ci-native/**"
  # A pull request can restore only its own caches and its base branch's. This
  # run builds the base branch and saves its compiler caches, so the first run
  # of each pull request does not compile from scratch.
  push:
    branches: [main, feat/native-timeline]
    paths:
      - "native/timeline/**"
      - "native/ui_primitives/**"
      - "native/chat/**"
      - "native/model-picker/**"
      - "native/kernels/**"
      - ".github/workflows/native-timeline.yml"
      - ".github/actions/setup-native-timeline/**"
      - "docker/ci-native/**"

permissions:
  contents: read

concurrency:
  group: native-timeline-${{ github.ref }}
  # A cancelled base branch build saves no cache, so only pull requests cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: "6.12.0"
  NT_NO_HW_DECODE: "1"
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G
  # A pull request that changes one of these runs every native test: CI
  # itself, the test selection, and the packages that scratch-server, oracle
  # and golden tests load, which no build file records.
  NT_TEST_FORCE: >-
    .github/workflows/native-timeline.yml .github/actions/ docker/ci-native/
    scripts/test-affected-native.mjs scripts/test-affected.mjs scripts/native-ci-test-selection.mjs
    packages/ package.json package-lock.json

jobs:
  # Decides whether a scheduled run has anything new to test. Every other
  # event already passed its paths filter, so it always runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          # The web references the oracles and export_golden compare against.
          REFERENCE_PATHS: packages/timeline packages/gpu packages/cli-timeline
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          for path in $REFERENCE_PATHS; do
            count=$(gh api -X GET "repos/$REPO/commits" -f sha="$REF" -f path="$path" -f since="$since" -f per_page=1 --jq length)
            if [[ "$count" != "0" ]]; then
              echo "$path changed since $since"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No reference package changed since $since"
          echo "run=false" >> "$GITHUB_OUTPUT"

  # The Linux legs run in the native CI image (docker/ci-native/) instead of
  # installing their system packages with apt.
  ci-image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci-image.yml
    with:
      image: ci-native
    permissions:
      contents: read
      packages: write

  # The TypeScript package build output is platform-independent, so one Linux
  # leg builds it and every native leg below downloads the artifact instead
  # of each rebuilding ~55 packages from scratch (previously five full builds
  # per run). Mirrors the `build` job in quality-checks.yml.
  ts-dist:
    name: TypeScript package dist
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node, install deps, build packages
        uses: ./.github/actions/setup-build
        with:
          build-packages: "true"

      - name: Upload package dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: [changes, ci-image, ts-dist]
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    # An empty image runs the job on the runner itself: macOS and Windows.
    container:
      image: ${{ matrix.os == 'ubuntu-24.04' && needs.ci-image.outputs.image || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2 keeps the merge commit's first parent, the base the test
      # selection diffs against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set native temporary paths
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          # The checkout path as the compiler sees it: in the Linux container
          # it differs from github.workspace, which names the host path.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Scratch-server and golden checks also load decorated node packages.
      # The TypeScript build output is platform-independent, so the `ts-dist`
      # job below builds it once and every native leg downloads it instead of
      # rebuilding it (previously five full builds per run). The shared setup
      # still installs node_modules (cached per OS) and restores the example
      # media; only the dist comes from the artifact.
      - name: Install dependencies
        uses: ./.github/actions/setup-build
        with:
          build-packages: "false"
          turbo: "off"
          cache: read-only

      - name: Download TypeScript package dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-dist
          path: packages

      - name: Set up native dependencies
        uses: ./.github/actions/setup-native-timeline

      # sccache on the shared R2 bucket keeps every object across pull
      # requests and branches. Without the R2 secrets (fork pull requests),
      # ccache with the Actions cache takes over.
      - name: Select compiler cache
        uses: ./.github/actions/native-compiler-cache
        with:
          r2: ${{ secrets.NATIVE_CACHE_R2_READ_KEY_ID != '' && secrets.NATIVE_CACHE_R2_WRITE_KEY_ID != '' }}
          key-prefix: native-timeline/${{ runner.os }}/release

      - name: Restore compiler cache
        id: compiler-cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-

      - name: Bound restored compiler cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache'
        run: |
          ccache --cleanup
          ccache --zero-stats

      - name: Verify prerequisites and prepare media
        run: |
          node native/timeline/scripts/check-ci-prerequisites.mjs
          node --test native/timeline/scripts/check-ci-prerequisites.test.mjs \
            native/timeline/scripts/measure-psnr.test.mjs \
            native/timeline/src/server/sync/sync-e2e-transport.test.mjs
          native/timeline/scripts/make-fixtures.sh

      # The File API query makes the configure write the target model the
      # test selection reads, so selecting needs no second configure.
      - name: Configure
        run: |
          query=native/timeline/build-ci/.cmake/api/v1/query
          mkdir -p "$query" && touch "$query/codemodel-v2" "$query/cmakeFiles-v1"
          launcher=(-DCMAKE_CXX_COMPILER_LAUNCHER="$NT_COMPILER_LAUNCHER")
          if [[ "$RUNNER_OS" == macOS ]]; then launcher+=(-DCMAKE_OBJCXX_COMPILER_LAUNCHER="$NT_COMPILER_LAUNCHER"); fi
          # About 190 executables link the static timeline libraries. lld links them faster than GNU ld.
          if [[ "$RUNNER_OS" == Linux ]]; then launcher+=(-DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld"); fi
          cmake -S native/timeline -B native/timeline/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" "${launcher[@]}"

      - name: Build
        id: native-build
        env:
          # Pushes write the shared R2 compiler cache. Other runs only read it.
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && secrets.NATIVE_CACHE_R2_WRITE_KEY_ID || secrets.NATIVE_CACHE_R2_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && secrets.NATIVE_CACHE_R2_WRITE_SECRET || secrets.NATIVE_CACHE_R2_READ_SECRET }}
        # -k 0 reports every failing file in one run, not only the first.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/disk-usage.sh" cmake --build native/timeline/build-ci --parallel 3 -- -k 0

      - name: Show compiler cache statistics
        if: success() || failure()
        continue-on-error: true
        run: |
          "$NT_COMPILER_LAUNCHER" --show-stats

      # Preserve successful compilation even when a later test fails.
      - name: Save compiler cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # A pull request runs only the tests that depend on its changed files:
      # the selection of `npm run test:affected:native`, read from this
      # build's target model and compiler depfiles. Changes to CI, to the
      # selection scripts or to any package run every test, as scheduled and
      # manual runs do. If the selection fails, every test runs.
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          force=()
          for prefix in $NT_TEST_FORCE; do force+=(--force "$prefix"); done
          node scripts/native-ci-test-selection.mjs --project timeline --build native/timeline/build-ci \
            --base HEAD^1 --label render "${force[@]}"

      # The offscreen QPA platform has no QRhi: Qt Quick falls back to the
      # software scene graph there, and tst_editpreview cannot initialize its
      # render control. So no step sets QT_QPA_PLATFORM=offscreen globally;
      # the window-event tests set it in their ctest ENVIRONMENT.
      # macOS renders windowless through Metal on the Cocoa platform. Linux:
      # xcb on Xvfb, Vulkan on lavapipe (the renderers attach a
      # QVulkanInstance, hw/HwWindow.cpp). Windows: the Windows platform,
      # D3D11 on the WARP software adapter.
      # The render tests run apart, with the scene graph and QRhi logs on, and
      # the log must name the backend and the adapter.
      - name: Test (headless, macOS)
        if: github.event_name != 'push' && runner.os == 'macOS' && steps.select.outputs.run != 'false'
        env:
          NT_TEST_FILTER: ${{ steps.select.outputs.filter }}
          NT_TEST_RENDER: ${{ steps.select.outputs.render }}
          NT_TEST_OTHERS: ${{ steps.select.outputs.others }}
        run: |
          # The render tests run even when the others fail, so one failure cannot hide
          # theirs. The crash diagnoses read the failure list, which each run rewrites.
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          status=0
          sel=()
          if [[ -n "$NT_TEST_FILTER" ]]; then sel=(-R "$NT_TEST_FILTER"); fi
          if [[ "$NT_TEST_OTHERS" != false ]]; then
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render "${sel[@]}" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-non-render.log" 2>/dev/null || true
          fi
          if [[ "$NT_TEST_RENDER" != false ]]; then
            # The golden shards render offscreen and run side by side. The other
            # render tests show windows, which must not compete for focus.
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -L '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee "$RUNNER_TEMP/render.log" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-golden.log" 2>/dev/null || true
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render -LE '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee -a "$RUNNER_TEMP/render.log" || status=$?
            cat "$RUNNER_TEMP/failed-golden.log" "$RUNNER_TEMP/failed-non-render.log" >> "$failed" 2>/dev/null || true
            grep -q "Creating QRhi with backend Metal" "$RUNNER_TEMP/render.log" ||
              { echo "::error::the render tests did not run on Metal"; exit 1; }
          fi
          exit "$status"

      - name: Test (headless, Linux)
        if: github.event_name != 'push' && runner.os == 'Linux' && steps.select.outputs.run != 'false'
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          NT_TEST_FILTER: ${{ steps.select.outputs.filter }}
          NT_TEST_RENDER: ${{ steps.select.outputs.render }}
          NT_TEST_OTHERS: ${{ steps.select.outputs.others }}
        run: |
          # The render tests run even when the others fail, so one failure cannot hide
          # theirs. The crash diagnoses read the failure list, which each run rewrites.
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          status=0
          sel=()
          if [[ -n "$NT_TEST_FILTER" ]]; then sel=(-R "$NT_TEST_FILTER"); fi
          if [[ "$NT_TEST_OTHERS" != false ]]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render "${sel[@]}" \
              | tee "$RUNNER_TEMP/non-render.log" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-non-render.log" 2>/dev/null || true
          fi
          if [[ "$NT_TEST_RENDER" != false ]]; then
            # The golden shards render offscreen and run side by side. The other
            # render tests show windows, which must not compete for focus.
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" xvfb-run -a -s "-screen 0 1920x1080x24" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -L '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee "$RUNNER_TEMP/render.log" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-golden.log" 2>/dev/null || true
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" xvfb-run -a -s "-screen 0 1920x1080x24" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render -LE '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee -a "$RUNNER_TEMP/render.log" || status=$?
            cat "$RUNNER_TEMP/failed-golden.log" "$RUNNER_TEMP/failed-non-render.log" >> "$failed" 2>/dev/null || true
            grep -q "Creating QRhi with backend Vulkan" "$RUNNER_TEMP/render.log" ||
              { echo "::error::the render tests did not run on Vulkan"; exit 1; }
            grep -A1 "Physical device [0-9]*: 'llvmpipe" "$RUNNER_TEMP/render.log" | grep "using this physical device" > /dev/null ||
              { echo "::error::the render tests did not run on lavapipe"; exit 1; }
          fi
          # The verbose render log buries the other tests' failures, so repeat them last.
          if [[ -s "$RUNNER_TEMP/failed-non-render.log" ]]; then
            echo "::error::non-render tests failed: $(cut -d: -f2 "$RUNNER_TEMP/failed-non-render.log" | paste -sd ' ')"
            echo "::group::Non-render test output"
            tail -n 2000 "$RUNNER_TEMP/non-render.log"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Test (headless, Windows)
        if: github.event_name != 'push' && runner.os == 'Windows' && steps.select.outputs.run != 'false'
        env:
          QSG_RHI_BACKEND: d3d11
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          NT_TEST_FILTER: ${{ steps.select.outputs.filter }}
          NT_TEST_RENDER: ${{ steps.select.outputs.render }}
          NT_TEST_OTHERS: ${{ steps.select.outputs.others }}
        run: |
          # Offscreen FreeType does not discover Windows system fallback fonts.
          export QT_QPA_FONTDIR="$(cygpath -m "$WINDIR/Fonts")"
          # The render tests run even when the others fail, so one failure cannot hide
          # theirs. The crash diagnoses read the failure list, which each run rewrites.
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          status=0
          sel=()
          if [[ -n "$NT_TEST_FILTER" ]]; then sel=(-R "$NT_TEST_FILTER"); fi
          if [[ "$NT_TEST_OTHERS" != false ]]; then
            ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -LE render "${sel[@]}" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-non-render.log" 2>/dev/null || true
          fi
          if [[ "$NT_TEST_RENDER" != false ]]; then
            # The golden shards render offscreen and run side by side. The other
            # render tests show windows, which must not compete for focus.
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -j 2 -L '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee "$RUNNER_TEMP/render.log" || status=$?
            cp "$failed" "$RUNNER_TEMP/failed-golden.log" 2>/dev/null || true
            QSG_INFO=1 QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true" \
              ctest --test-dir native/timeline/build-ci --output-on-failure --timeout 600 -L render -LE '^golden$' "${sel[@]}" --no-tests=ignore -V \
              | tee -a "$RUNNER_TEMP/render.log" || status=$?
            cat "$RUNNER_TEMP/failed-golden.log" "$RUNNER_TEMP/failed-non-render.log" >> "$failed" 2>/dev/null || true
            grep -q "Creating QRhi with backend D3D11" "$RUNNER_TEMP/render.log" ||
              { echo "::error::the render tests did not run on D3D11"; exit 1; }
            grep -A1 "Adapter [0-9]*: 'Microsoft Basic Render Driver'" "$RUNNER_TEMP/render.log" | grep "using this adapter" > /dev/null ||
              { echo "::error::the render tests did not run on WARP"; exit 1; }
          fi
          exit "$status"

      - name: Diagnose macOS entity panel crash
        if: github.event_name != 'push' && failure() && runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          if [[ ! -f "$failed" ]] || ! grep -q ':tst_entitypanel$' "$failed"; then
            exit 0
          fi
          # Run the whole fixture to preserve the state preceding the crash.
          export XDG_CONFIG_HOME="$(mktemp -d "$RUNNER_TEMP/entitypanel-config.XXXXXX")"
          xcrun lldb --batch -o run -k 'thread backtrace all' \
            -- native/timeline/build-ci/tst_entitypanel

      - name: Diagnose Linux matte crash
        if: github.event_name != 'push' && failure() && runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          QSG_INFO: "1"
        run: |
          failed=native/timeline/build-ci/Testing/Temporary/LastTestsFailed.log
          if [[ ! -f "$failed" ]] || ! grep -q ':tst_mattecarrier$' "$failed"; then
            exit 0
          fi
          diagnostic_status=0
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            gdb --return-child-result -batch -ex 'set pagination off' -ex 'set debuginfod enabled off' \
              -ex run -ex 'thread apply all bt' --args native/timeline/build-ci/tst_mattecarrier \
              > "$RUNNER_TEMP/matte-gdb.log" 2>&1 || diagnostic_status=$?
          cat "$RUNNER_TEMP/matte-gdb.log"
          exit "$diagnostic_status"

      - name: Upload export golden failure frames
        if: github.event_name != 'push' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-timeline-export-golden-${{ runner.os }}
          path: native/timeline/build-ci/**/export-golden-failures/
          if-no-files-found: ignore

      - name: Upload Linux matte diagnostics
        if: github.event_name != 'push' && failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-timeline-matte-backtrace
          path: ${{ runner.temp }}/matte-gdb.log
          if-no-files-found: ignore

  sanitizers:
    name: Linux ${{ matrix.preset }}
    # Base branch runs only build and seed the compiler caches, as the build
    # job does. Pull requests restore them and run the checks.
    needs: [changes, ci-image, ts-dist]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    # TSan re-executes itself through personality(ADDR_NO_RANDOMIZE) when the
    # kernel's mmap randomization is too wide for its shadow memory. Docker's
    # default seccomp profile refuses that call.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001 --security-opt seccomp=unconfined
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitize, tsan]
    defaults:
      run:
        shell: bash
        working-directory: native/timeline
    steps:
      # Depth 2 keeps the merge commit's first parent, the base the test
      # selection diffs against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set native temporary paths
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          # The checkout path as the compiler sees it: in the Linux container
          # it differs from github.workspace, which names the host path.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Same shared TypeScript build as the platform legs: the dist comes
      # from the `ts-dist` artifact, so the sanitizer presets skip the build
      # (and the Turbo download) entirely.
      - name: Install dependencies
        uses: ./.github/actions/setup-build
        with:
          build-packages: "false"
          turbo: "off"
          cache: read-only

      - name: Download TypeScript package dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-dist
          path: packages
      # The native CI image has the system packages, Clang among them. This
      # frees disk, then installs Qt and builds the LGPL FFmpeg.
      - name: Set up native dependencies
        uses: ./.github/actions/setup-native-timeline

      - name: Verify prerequisites and prepare media
        run: |
          node scripts/check-ci-prerequisites.mjs
          scripts/make-fixtures.sh
      # Without a cache the ASan build takes about 70 minutes. Without the R2
      # secrets, only base branch runs save the Actions cache, so the pull
      # request runs of five jobs do not each add a cache and evict the others.
      - name: Select compiler cache
        uses: ./.github/actions/native-compiler-cache
        with:
          r2: ${{ secrets.NATIVE_CACHE_R2_READ_KEY_ID != '' && secrets.NATIVE_CACHE_R2_WRITE_KEY_ID != '' }}
          key-prefix: native-timeline/${{ runner.os }}/${{ matrix.preset }}
      - name: Restore compiler cache
        id: compiler-cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-${{ runner.os }}-${{ matrix.preset }}-qt${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ matrix.preset }}-qt${{ env.QT_VERSION }}-
      - name: Bound restored compiler cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache'
        run: |
          ccache --cleanup
          ccache --zero-stats
      - name: Configure
        run: |
          query="build-${{ matrix.preset }}/.cmake/api/v1/query"
          mkdir -p "$query" && touch "$query/codemodel-v2" "$query/cmakeFiles-v1"
          # ELF compression keeps line tables without duplicating large debug sections.
          # lld links the many test executables faster than GNU ld.
          cmake --preset "${{ matrix.preset }}" -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--compress-debug-sections=zlib" \
            -DCMAKE_C_COMPILER_LAUNCHER="$NT_COMPILER_LAUNCHER" -DCMAKE_CXX_COMPILER_LAUNCHER="$NT_COMPILER_LAUNCHER"
      - name: Build
        env:
          # Pushes write the shared R2 compiler cache. Other runs only read it.
          AWS_ACCESS_KEY_ID: ${{ github.event_name == 'push' && secrets.NATIVE_CACHE_R2_WRITE_KEY_ID || secrets.NATIVE_CACHE_R2_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'push' && secrets.NATIVE_CACHE_R2_WRITE_SECRET || secrets.NATIVE_CACHE_R2_READ_SECRET }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/disk-usage.sh" nice -n 10 cmake --build --preset "${{ matrix.preset }}" -j 3
      - name: Show compiler cache statistics
        if: success() || failure()
        continue-on-error: true
        run: |
          "$NT_COMPILER_LAUNCHER" --show-stats
      - name: Save compiler cache
        if: env.NT_COMPILER_LAUNCHER == 'ccache' && github.event_name == 'push' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Verify checker fixtures
        if: github.event_name != 'push'
        run: |
          node tools/sanitizers/check-plants.mjs --self-test
          node tools/sanitizers/check-plants.mjs "${{ matrix.preset }}"
      # The ASan preset runs the tests the changed files affect, selected as
      # in the build job. The TSan preset already runs a fixed short list,
      # which a -R filter would replace, so it always runs whole.
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request' && matrix.preset == 'sanitize'
        continue-on-error: true
        working-directory: .
        run: |
          force=()
          for prefix in $NT_TEST_FORCE; do force+=(--force "$prefix"); done
          node scripts/native-ci-test-selection.mjs --project timeline --build native/timeline/build-sanitize \
            --base HEAD^1 "${force[@]}"
      - name: Test on lavapipe
        if: github.event_name != 'push' && steps.select.outputs.run != 'false'
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: vulkan
          QSG_INFO: "1"
          NT_TEST_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          sel=()
          if [[ -n "$NT_TEST_FILTER" ]]; then sel=(-R "$NT_TEST_FILTER"); fi
          xvfb-run -a ctest --preset "${{ matrix.preset }}" --output-on-failure "${sel[@]}"
      - name: Upload sanitizer logs
        if: github.event_name != 'push' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-timeline-${{ matrix.preset }}
          path: native/timeline/build-${{ matrix.preset }}/Testing/Temporary/
