name: CodeQL

# Static analysis for injection, XSS, path traversal and similar flows in the
# TypeScript code, and for unsafe patterns in these workflow files. Results
# land in the Security tab and annotate pull requests. Advisory: not a required
# check.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "25 3 * * 0" # Sundays at 03:25 UTC
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are not: a full
# javascript-typescript analysis outlasts the gap between merges, so cancelling
# would leave main without a finished baseline for pull request alerts to diff
# against. A newer main push waits and replaces any older queued one.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/generated/**"
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "**/__tests__/**"
              - "**/tests/**"

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
