name: EAS Build (mobile)

# Cloud builds for the Expo app in `mobile/` (EAS project
# ce40c43d-6adf-4476-98b1-761aa4d29c40, owner `mgeorgi`).
#
# Builds cost EAS credits, so nothing here fires on an ordinary push: they are
# started by hand (`workflow_dispatch`) or by pushing a `mobile-v*` tag, which
# runs the `production` profile. PRs that touch `mobile/` only get the cheap
# config check below — it never talks to the build queue.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, android, ios]
      profile:
        description: eas.json build profile
        type: choice
        default: preview
        options:
          [
            development,
            development-simulator,
            development-testflight,
            preview,
            preview-simulator,
            production
          ]
      wait:
        description: Wait for the build to finish (needed to submit)
        type: boolean
        default: false
      submit:
        description: Submit the finished build (production → App Store,
          development-testflight → TestFlight)
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"
  pull_request:
    paths:
      - "mobile/app.json"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/eas-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Catches a malformed app.json/eas.json before someone spends credits on a
  # build that would fail during setup. No EAS_TOKEN, no build queue.
  config:
    name: Validate Expo config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # Same cache key as quality-checks.yml, so this job usually restores the
      # tree that workflow already installed instead of running `npm ci`.
      - name: Cache mobile node_modules
        id: mobile-node-modules
        uses: actions/cache@v5
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-modules-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install mobile dependencies
        if: steps.mobile-node-modules.outputs.cache-hit != 'true'
        run: cd mobile && npm ci

      - name: Resolve the app config
        run: cd mobile && npx expo config --type prebuild > /dev/null

  build:
    name: EAS build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Generous, because `--wait` blocks on the EAS queue, which can be long when
    # the tier is busy. Fire-and-forget runs finish in a couple of minutes.
    timeout-minutes: 120
    env:
      # eas-cli authenticates with EXPO_TOKEN; the repository secret is EAS_TOKEN.
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      PLATFORM: ${{ inputs.platform || 'all' }}
      PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
    steps:
      - name: Check for the EAS token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_TOKEN is not set on this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          packager: npm

      - name: Install mobile dependencies
        run: cd mobile && npm ci

      - name: Build
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          WAIT_FLAG=--no-wait
          if [ "${{ github.event_name == 'push' || inputs.wait || inputs.submit }}" = "true" ]; then
            WAIT_FLAG=--wait
          fi
          # eas puts the JSON result on stdout and everything else — queue
          # progress, credential errors — on stderr. Route stdout to build.json
          # and pipe stderr through `tee` so it still streams into the job log
          # during a long `--wait`, while leaving a copy to grep below. `tee` is
          # the last pipeline member, so bash waits for it: no read-before-flush
          # race. `set -e` is off so the hint below runs; the exit code is
          # re-raised at the end.
          set +e
          { eas build \
              --non-interactive \
              --platform "$PLATFORM" \
              --profile "$PROFILE" \
              "$WAIT_FLAG" \
              --json >build.json; echo $? >build.status; } 2>&1 | tee build.err
          set -e
          status=$(cat build.status)

          # An iOS device build needs a distribution certificate and an ad-hoc
          # provisioning profile on the Expo servers. Only an interactive Apple
          # login can mint those the first time, so CI can never recover on its
          # own — say what to do instead of leaving the raw EAS message.
          if [ "$status" -ne 0 ] && grep -qi "couldn't find any credentials" build.err; then
            echo "::error::No iOS credentials on the Expo servers for profile '$PROFILE'. Run 'cd mobile && npx eas-cli credentials --platform ios' once from a machine signed in to the Apple Developer account (an ad-hoc profile also needs each test device's UDID registered). If the test device refuses the profile rather than the build failing to make one — a phone under MDM — ad-hoc is what is blocked: build 'development-testflight' and install from TestFlight instead. To smoke-test without an Apple account, use 'preview-simulator' or build '--platform android'."
          fi
          exit "$status"

      - name: Summarize
        if: always() && steps.build.outcome != 'skipped'
        working-directory: mobile
        run: |
          {
            echo "### EAS build — \`$PROFILE\` / \`$PLATFORM\`"
            echo
            if [ -s build.json ]; then
              node -e '
                const builds = JSON.parse(require("fs").readFileSync("build.json", "utf8"));
                for (const b of [builds].flat()) {
                  console.log(`- **${b.platform}** \`${b.status}\` — [build ${b.id}](https://expo.dev/accounts/${b.project?.ownerAccount?.name ?? "mgeorgi"}/projects/${b.project?.slug ?? "nodetool"}/builds/${b.id})`);
                  if (b.artifacts?.buildUrl) console.log(`  - [artifact](${b.artifacts.buildUrl})`);
                }
              '
            else
              echo "No build was queued — see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `--latest` picks the build this job just queued, since the wait above
      # means it is the newest one for the profile. Only the two profiles that
      # produce a store-signed binary have a matching `submit` profile in
      # eas.json; an internal-distribution build has nowhere to be submitted.
      - name: Submit
        if: >-
          (github.event_name == 'push' || inputs.submit) &&
          (env.PROFILE == 'production' || env.PROFILE == 'development-testflight')
        working-directory: mobile
        run: |
          eas submit \
            --non-interactive \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --latest
