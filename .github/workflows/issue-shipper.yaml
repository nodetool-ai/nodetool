name: Issue Shipper

# Ships one open issue end to end: picks the highest-ranked issue a single PR
# can finish, claims it, reproduces it, fixes the root cause everywhere it
# occurs, and opens a PR that closes it. The other scheduled routines each
# hunt for one small target in the code. This one starts from what users and
# maintainers have filed.

on:
  schedule:
    - cron: "30 10 * * *" # Daily at 10:30 UTC
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional issue number to ship (default: pick from the ranked candidates)"
        required: false
        default: ""

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}
      recent-files: ${{ steps.preflight.outputs.recent-files }}
      candidates: ${{ steps.candidates.outputs.candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/agent-preflight.mjs --name issue-shipper --days 30
      - id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/agent-issue-picker.mjs --limit 8

  issue-shipper:
    cache-mode: read
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || (needs.preflight.outputs.skip != 'true' && needs.preflight.outputs.candidates != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-build
        with:
          cache: "read-only"
          build-packages: "true"

      - name: Write the ranked candidates
        env:
          CANDIDATES: ${{ needs.preflight.outputs.candidates }}
        run: printf '%s\n' "$CANDIDATES" > "$RUNNER_TEMP/issue-candidates.md"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Edit,Read,Replace,CreatePullRequest"
            --append-system-prompt "Before finalizing any code change or PR, invoke the unslop skill (.claude/skills/unslop/SKILL.md) and apply its checklist to your diff. Open the PR with the label agent:issue-shipper (gh pr create --label agent:issue-shipper). Before opening the PR, apply the code-review skill (.claude/skills/code-review/SKILL.md) to your own diff, fix every finding, and list any finding you did not fix, with the reason, under a Self-review heading in the PR body."
          prompt: |
            # Ship One Issue

            Requested issue: `${{ github.event.inputs.issue }}` (empty means
            choose one from the candidates).

            Deliver a change a NodeTool user or maintainer would notice: a bug
            they hit stops happening, or a feature they asked for works. A
            green diff that changes nothing anyone sees is not the goal of this
            routine.

            `${{ runner.temp }}/issue-candidates.md` lists the open issues
            ranked by `.github/scripts/agent-issue-picker.mjs`. It already
            dropped issues that are claimed, assigned, closed by an open PR,
            waiting on an open dependency, or labelled as planning or reports.

            ## 1. Choose
            Read each candidate with `gh issue view <n> --comments`, in rank
            order, and take the first one you can finish completely in this
            run. Skip one, and note why, when it:
            - needs hardware, a GPU, macOS or Windows, a native Qt build this
              runner cannot produce, or live provider keys;
            - asks for a product or design decision the issue does not settle;
            - belongs to a planned series whose earlier work packages are still
              open, or whose plan says it must follow another branch.

            You may close up to three issues in one PR when they share one root
            cause, for example several CLI commands with the same
            error-reporting gap. Do not bundle unrelated issues.

            If no candidate qualifies, stop without a PR and write the reason
            for each skip to `$GITHUB_STEP_SUMMARY`.

            ## 2. Claim
            Follow "GitHub Issue Claims" in `AGENTS.md` with the agent id
            `issue-shipper-${{ github.run_id }}` and the branch you create.
            If another claim appears when you re-read the comments, release
            yours and go back to step 1.

            ## 3. Reproduce
            Write the failing test first, in the area's own suite, and watch it
            fail for the reason the issue describes. For a feature, write the
            test of the behavior the issue asks for. The issue's "Expected" or
            "Exit evidence" section is the acceptance criterion.

            ## 4. Fix the cause
            - Fix the root cause, not the one call site in the report.
              Enumerate every place with the same defect (`rg`, the
              ast-grep-outline skill) and fix or list each one.
            - Span packages when the fix needs it. There is no file cap, but
              every changed line must serve the issue. Leave unrelated cleanup
              alone.
            - Update the docs, CLI help and `AGENTS.md` guidance that the change
              makes wrong, in the same PR.
            - Do not touch CI workflow files, `@ts-expect-error`, or test skip
              markers (`.github/bot-guardrails.md`).

            ## 5. Verify
            Run the mandatory checks from `AGENTS.md`. All four must pass:
            ```bash
            npm run test:affected
            npm run typecheck
            npm run lint
            npm run dev:nodetool -- harness gate --base origin/main
            ```
            When the issue names a CLI command or a harness, also run that
            command against the case in the issue and paste the output.

            ## 6. Submit or release
            - Done: open a PR titled with a conventional prefix (`fix:`,
              `feat:`) and the user-visible change. The body starts with
              `Closes #<n>` for each issue, then the user-visible change, the
              reproduction, the root cause, every call site you fixed or
              listed, and the check output.
            - Not done: open no PR. Release the claim as `AGENTS.md`
              describes, with a comment that records the root cause you found,
              the files involved, and what remains. That comment is the
              deliverable of the run.
