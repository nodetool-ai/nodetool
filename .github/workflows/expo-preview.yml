name: Expo preview (mobile)

# Publishes the PR's JS bundle as an EAS Update and comments a QR code on the
# pull request. Scanning it opens that PR's code in the development build.
#
# The QR targets a dev build rather than Expo Go, because Expo Go cannot run
# this app at all: it ships a fixed set of native modules, and app.json's
# plugins include three that are not in it (@react-native-google-signin,
# @sentry/react-native, expo-speech-recognition). The App Store build of Expo
# Go is also pinned to an older SDK than this project targets.
#
# Install the dev client once from the `development-testflight` profile (see
# eas-build.yml), and from then on every PR is a QR scan away — publishing a
# bundle costs no build credits and takes a couple of minutes, where a rebuild
# would mean a queue wait and a new TestFlight submission.
#
# The limit is the flip side: an update only carries JS. A PR that adds or
# changes native code needs a new build of the client itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "mobile/**"
      - ".github/workflows/expo-preview.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Publish preview update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks do not get the EXPO_TOKEN secret, and the update would fail at
    # publish rather than at checkout. Skip them instead of failing the PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
    steps:
      - name: Check for the EAS token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EAS_TOKEN is not set on this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # Same cache key as quality-checks.yml and eas-build.yml, so this usually
      # restores a tree one of those already installed.
      - name: Cache mobile node_modules
        id: mobile-node-modules
        uses: actions/cache@v5
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-modules-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install mobile dependencies
        if: steps.mobile-node-modules.outputs.cache-hit != 'true'
        run: cd mobile && npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          packager: npm

      # `--branch` keys the update to the PR's head ref, so each PR gets its own
      # channel and scanning an older QR keeps showing that PR's code.
      - uses: expo/expo-github-action/preview@v9
        with:
          working-directory: mobile
          command: eas update --auto --branch ${{ github.event.pull_request.head.ref }}
          qr-target: dev-build
          comment: true
          github-token: ${{ github.token }}
