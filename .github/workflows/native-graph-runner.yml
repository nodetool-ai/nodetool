# Native graph runner (native/graph-runner/): build the QuickJS runner and run
# its ctest suite on Linux x86_64, once as a release build and once each under
# AddressSanitizer with UndefinedBehaviorSanitizer and under ThreadSanitizer
# (native/AGENTS.md rule 15). Linux x86_64 is the one platform where CMake
# fetches Wasmtime itself. The GPU tests run wgpu-native on Mesa lavapipe.
#
# The image adapter pins libvips 8.18.7 and libwebp 1.6.0 exactly, and OCR
# needs Tesseract 5.5.3 or newer. Ubuntu ships older versions, so the deps step
# builds these three from SHA-256-pinned sources into a cached prefix.
name: Native graph runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/graph-runner/**"
      - "native/jobs/**"
      - "native/kernels/**"
      - "native/node-editor/**"
      - "packages/audio-nodes/**"
      - "packages/kernels/**"
      - ".github/workflows/native-graph-runner.yml"
      - "docker/ci-native/**"
  push:
    branches: [main]
    paths:
      - "native/graph-runner/**"
      - "native/jobs/**"
      - "native/kernels/**"
      - "native/node-editor/**"
      - "packages/audio-nodes/**"
      - "packages/kernels/**"
      - ".github/workflows/native-graph-runner.yml"

permissions:
  contents: read

concurrency:
  group: native-graph-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VIPS_VERSION: "8.18.7"
  VIPS_SHA256: 5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94
  WEBP_VERSION: "1.6.0"
  WEBP_SHA256: e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564
  TESSERACT_VERSION: "5.5.3"
  TESSERACT_SHA256: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884
  DEPS_PREFIX: /opt/nt-graph-runner-deps
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G

jobs:
  # The legs run in the native CI image (docker/ci-native/) instead of
  # installing their system packages with apt.
  ci-image:
    uses: ./.github/workflows/ci-image.yml
    with:
      image: ci-native
    permissions:
      contents: read
      packages: write

  build:
    name: ${{ matrix.name }}
    needs: ci-image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    # --privileged lets the parity check lift the runner's AppArmor limit on
    # user namespaces and start `unshare -rn`, and lets TSan and LeakSanitizer
    # make the calls Docker's default seccomp profile refuses.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001 --privileged
      volumes:
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/lib/android:/reclaim/android
        - /opt/ghc:/reclaim/ghc
        - /usr/local/.ghcup:/reclaim/ghcup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            flags: ""
            build_type: Release
          - name: ASan and UBSan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
            build_type: RelWithDebInfo
          - name: TSan
            flags: "-fsanitize=thread"
            build_type: RelWithDebInfo
    # Job level, so the runner's compile step in "Build guest bundle and shader
    # catalog" gets the same options as the tests.
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Hosted runners are about twice as slow as the machine the tests' wall-clock
      # budgets were measured on (unittests/sanitizer_build.h).
      GR_TEST_TIME_SCALE: "2"
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2 keeps the merge commit's first parent, the base the test
      # selection diffs against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # In a container job `github.workspace` names the runner's path, not
      # the container's, so the paths come from GITHUB_WORKSPACE instead.
      - name: Point ccache and the sanitizers at the workspace
        run: | # zizmor: ignore[github-env]
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/native/graph-runner/tools/lsan.supp" >> "$GITHUB_ENV"
          echo "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1:suppressions=$GITHUB_WORKSPACE/native/graph-runner/tools/tsan.supp" >> "$GITHUB_ENV"

      # The guest bundle reads the node packages' dist/ output.
      - name: Set up and build backend packages
        uses: ./.github/actions/setup-build
        with:
          package-media: "false"
          free-disk: background

      # The job runs as the runner's user, so the cache restore below cannot
      # create a directory under /opt by itself.
      - name: Create the pinned dependency prefix
        run: sudo mkdir -p "$DEPS_PREFIX" && sudo chown "$(id -u):$(id -g)" "$DEPS_PREFIX"

      - name: Restore pinned native dependencies
        id: deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: graph-runner-deps-ci-native-vips${{ env.VIPS_VERSION }}-webp${{ env.WEBP_VERSION }}-tess${{ env.TESSERACT_VERSION }}

      - name: Build pinned native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/deps-src" && mkdir -p "$src" && cd "$src"
          fetch() { curl -sfL -o "$2" "$1" && echo "$3  $2" | sha256sum -c -; }
          export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib/x86_64-linux-gnu/pkgconfig"

          fetch "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-$WEBP_VERSION.tar.gz" webp.tar.gz "$WEBP_SHA256"
          tar -xzf webp.tar.gz
          cmake -S "libwebp-$WEBP_VERSION" -B webp-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" -DBUILD_SHARED_LIBS=ON \
            -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF
          cmake --build webp-build && cmake --install webp-build

          fetch "https://github.com/libvips/libvips/releases/download/v$VIPS_VERSION/vips-$VIPS_VERSION.tar.xz" vips.tar.xz "$VIPS_SHA256"
          tar -xJf vips.tar.xz
          meson setup vips-build "vips-$VIPS_VERSION" --prefix="$DEPS_PREFIX" --libdir=lib \
            --buildtype=release -Dintrospection=disabled -Dmodules=disabled -Dexamples=false
          meson install -C vips-build

          fetch "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/$TESSERACT_VERSION.tar.gz" tesseract.tar.gz "$TESSERACT_SHA256"
          tar -xzf tesseract.tar.gz
          cmake -S "tesseract-$TESSERACT_VERSION" -B tess-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX" -DBUILD_SHARED_LIBS=ON -DBUILD_TRAINING_TOOLS=OFF \
            -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DGRAPHICS_DISABLED=ON -DOPENMP_BUILD=OFF
          cmake --build tess-build && cmake --install tess-build

      - name: Use pinned native dependencies
        run: |
          echo "PKG_CONFIG_PATH=$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$DEPS_PREFIX/lib:$DEPS_PREFIX/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: graph-runner-ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: graph-runner-ccache-${{ matrix.name }}-

      - name: Configure
        working-directory: native/graph-runner
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          SAN_FLAGS: ${{ matrix.flags }}
        run: |
          # The File API query makes the configure write the target model the
          # test selection reads.
          mkdir -p build/.cmake/api/v1/query && touch build/.cmake/api/v1/query/{codemodel-v2,cmakeFiles-v1}
          # GCC 13 stops with an internal compiler error in catalog_support.cpp.
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS" -DCMAKE_SHARED_LINKER_FLAGS="$SAN_FLAGS" \
            -DGR_TEST_TESSDATA=/usr/share/tesseract-ocr/5/tessdata

      - name: Build
        id: native_build
        working-directory: native/graph-runner
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: cmake --build build

      - name: Build guest bundle and shader catalog
        working-directory: native/graph-runner
        run: |
          node guest/build.mjs
          node guest/host/gpu-catalog.mjs build/gpu-catalog.json
          ./build/nodetool-graph-runner compile --bundle build/guest.js --out build/guest.bin

      - name: Check Linux signal-effect parity
        if: matrix.name == 'Release'
        working-directory: native/graph-runner
        run: |
          # Match the ephemeral-runner setup in .github/actions/chromium-sandbox.
          # parity/run.mjs still proves that its network namespace is offline.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          node parity/run.mjs --runner build/nodetool-graph-runner \
            --modules @nodetool-ai/core-nodes/nodes/constant,@nodetool-ai/audio-nodes/nodes/realtime-audio \
            --only nodetool.audio.realtime.Streaming --check 2>&1 | tee build/audio-parity.log

      - name: Save Linux signal-effect parity results
        if: ${{ !cancelled() && matrix.name == 'Release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-signal-parity
          path: |
            native/graph-runner/build/parity/result.json
            native/graph-runner/build/audio-parity.log
          if-no-files-found: error

      # A pull request runs only the tests that depend on its changed files:
      # the selection of `npm run test:affected:native`, read from this
      # build's target model and compiler depfiles. Changes to CI or to the
      # selection scripts run every test, as manual runs do. If the selection
      # fails, every test runs.
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          node scripts/native-ci-test-selection.mjs --project graph-runner --build native/graph-runner/build \
            --base HEAD^1 \
            --force .github/workflows/native-graph-runner.yml --force scripts/test-affected-native.mjs \
            --force scripts/test-affected.mjs --force scripts/native-ci-test-selection.mjs

      # One test at a time. Several tests have wall-clock deadlines: with two at
      # a time, TSan missed sandbox deadlines in gr_context_tests,
      # gr_public_state_tests and gr_public_subgraph_durable_tests, and Release
      # failed gr_async_image_tests' runningJobStopsBeforeEncoding.
      - name: Test
        if: steps.select.outputs.run != 'false'
        working-directory: native/graph-runner
        env:
          NT_TEST_FILTER: ${{ steps.select.outputs.filter }}
        run: |
          sel=()
          if [[ -n "$NT_TEST_FILTER" ]]; then sel=(-R "$NT_TEST_FILTER"); fi
          ctest --test-dir build --output-on-failure --timeout 900 "${sel[@]}"

      - name: Install Qt for the node editor
        id: editor_qt
        if: ${{ !cancelled() && matrix.name == 'Release' && steps.native_build.outcome == 'success' }}
        run: | # zizmor: ignore[github-env]
          pipx run aqtinstall install-qt linux desktop 6.12.0 linux_gcc_64 \
            -m qtmultimedia qtwebsockets qtshadertools -O "$RUNNER_TEMP/qt"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"

      - name: Build and test the audio examples in the editor
        if: ${{ !cancelled() && matrix.name == 'Release' && steps.editor_qt.outcome == 'success' }}
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          # The editor compiles the runner as a subproject, so it needs the
          # runner's compiler (see Configure above).
          cmake -S native/node-editor -B native/node-editor/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build native/node-editor/build --parallel 2 --target nodetool-node-editor \
            node_editor_menus_tests node_editor_canvas_media_host_tests node_editor_media_ui_tests node_editor_local_run_tests
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            native/node-editor/build/node_editor_menus_tests examplesMenuOpensEachBundledExample
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            native/node-editor/build/node_editor_canvas_media_host_tests storedMinuteOfAudioLoadsOnCard
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            native/node-editor/build/node_editor_media_ui_tests longWaveformStaysBounded
          ctest --test-dir native/node-editor/build -R '^node_editor_local_run$' --output-on-failure
