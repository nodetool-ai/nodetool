name: Node Pack npm Matrix

on:
  pull_request:
    paths:
      - 'packages/pack-manager/**'
      - 'packages/pack-manager/src/packs/**'
      - 'packages/pack-core/**'
      - 'packages/pack-manager/src/commands/pack-management.ts'
      - 'packages/pack-manager/src/commands/packs.ts'
      - 'packages/pack-manager/src/commands/pack-install-authorization.ts'
      - 'packages/pack-manager/src/npm-runner.ts'
      - 'packages/pack-manager/src/install-lock.ts'
      - 'packages/pack-manager/tests/packs/npm-matrix.test.ts'
      - 'packages/pack-manager/tests/packs/global-bootstrap.test.ts'
      - 'packages/pack-manager/tests/_helpers/pack-registry.ts'
      - 'packages/pack-manager/tests/_fixtures/npm-matrix-*.pem'
      - 'scripts/test-npm-matrix.mjs'
      - 'scripts/windows-long-cwd-probe.mjs'
      - 'scripts/windows-npm-bootstrap-check.mjs'
      - 'scripts/__tests__/test-npm-matrix.test.mjs'
      - '.github/workflows/node-pack-npm-matrix.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-pack-npm-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-long-cwd-diagnostic:
    name: Windows long cwd / Node ${{ matrix.node }}
    runs-on: windows-2025
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        include:
          - node: 22
            npm: '10.9.4'
          - node: 24
            npm: '11.16.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Diagnose native Windows long working directories
        run: node scripts/windows-long-cwd-probe.mjs
      - name: Pin npm inside the ephemeral runner runtime
        env:
          MATRIX_NPM_VERSION: ${{ matrix.npm }}
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import { dirname, resolve } from "node:path"; const prefix = dirname(process.execPath); const entry = resolve(prefix, "node_modules/npm/bin/npm-cli.js"); execFileSync(process.execPath, [entry, "install", "--global", "--prefix=" + prefix, "npm@" + process.env.MATRIX_NPM_VERSION, "--ignore-scripts", "--no-audit", "--no-fund"], {stdio:"inherit"});'
      - name: Verify native Windows npm configuration and lifecycle paths
        env:
          MATRIX_NPM_VERSION: ${{ matrix.npm }}
        run: node --experimental-strip-types scripts/windows-npm-bootstrap-check.mjs
  npm-matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22', '24']
        include:
          - node: '22'
            npm: '10.9.4'
          - node: '24'
            npm: '11.16.0'
          - os: ubuntu-24.04
            arch: X64
          - os: macos-15
            arch: ARM64
          - os: windows-2025
            arch: X64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install and build the workspace
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run build:packages
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm inside the ephemeral runner runtime
        shell: bash
        env:
          MATRIX_NPM_VERSION: ${{ matrix.npm }}
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import { dirname, resolve } from "node:path"; const prefix = process.platform === "win32" ? dirname(process.execPath) : resolve(dirname(process.execPath), ".."); const entry = resolve(prefix, process.platform === "win32" ? "node_modules/npm/bin/npm-cli.js" : "lib/node_modules/npm/bin/npm-cli.js"); execFileSync(process.execPath, [entry, "install", "--global", "--prefix=" + prefix, "npm@" + process.env.MATRIX_NPM_VERSION, "--ignore-scripts", "--no-audit", "--no-fund"], {stdio:"inherit"});'
      - name: Exercise the actual npm installer matrix
        env:
          NODETOOL_NPM_MATRIX: '1'
          NODETOOL_NPM_MATRIX_DEFAULT_PREFIX: '1'
          NODETOOL_NPM_MATRIX_EXPECT_NPM: ${{ matrix.npm }}
          NODETOOL_NPM_MATRIX_EXPECT_NODE: ${{ matrix.node }}
          NODETOOL_NPM_MATRIX_EXPECT_ARCH: ${{ matrix.arch }}
        run: node scripts/test-npm-matrix.mjs
      - name: Verify initial global integrity bootstrap
        working-directory: packages/pack-manager
        run: node ../../scripts/run-vitest.mjs run tests/packs/global-bootstrap.test.ts
