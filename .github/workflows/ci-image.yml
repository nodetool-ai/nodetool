name: CI image

# Publishes the Linux images the CI jobs run in: docker/ci/ for the Node and
# TypeScript jobs, docker/ci-native/ for the native jobs. Every workflow that
# runs a job in an image calls this first and passes the reference on through
# `needs`, so a pull request that changes an image builds it before its jobs
# start, and every other run finds the image already published and moves on in
# seconds. A push to main publishes both.

on:
  workflow_call:
    inputs:
      image:
        description: "`ci` (docker/ci/, the Node jobs) or `ci-native` (docker/ci-native/, the native jobs)."
        type: string
        default: ci
    outputs:
      image:
        description: The CI image reference, pinned by digest, for `container.image`.
        value: ${{ jobs.image.outputs.image }}
  push:
    branches: [main]
    paths:
      - "docker/ci/**"
      - "docker/ci-native/**"
      - ".github/actions/ci-image/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:
    inputs:
      image:
        description: "`ci` or `ci-native`"
        type: choice
        options: [ci, ci-native]
        default: ci

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CI image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A call or a manual run names one image. A push has no inputs and builds
    # both, so its matrix never feeds the single `image` output.
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.image && format('["{0}"]', inputs.image) || '["ci", "ci-native"]') }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout the image sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docker/ci
            docker/ci-native
            .github/actions/ci-image

      - name: Resolve or build the CI image
        id: image
        uses: ./.github/actions/ci-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
