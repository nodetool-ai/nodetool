name: Native timeline release

on:
  push:
    tags: ['timeline-v*']

permissions:
  contents: read

concurrency:
  group: timeline-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.12.0'
  NT_NO_HW_DECODE: '1'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^timeline-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          python3 native/timeline/scripts/release-version.py "$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      # Not PLATFORM: the Visual Studio shell sets that to x64 on Windows.
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          # A release must not restore a cache another run could have written.
          package-manager-cache: false
      - name: Set temporary paths
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          mkdir -p release-assets
          if [[ "$RUNNER_OS" == macOS ]]; then test "$(uname -m)" = arm64; fi
      - uses: ./.github/actions/setup-native-timeline
      # Release packaging builds only the app once per platform. The full test
      # suite belongs to native-timeline.yml, to bound runtime and runner disk use.
      - name: Build app (Windows and Linux)
        if: runner.os != 'macOS'
        run: |
          cmake -S native/timeline -B native/timeline/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          bash .github/scripts/disk-usage.sh cmake --build native/timeline/build-ci --target nodetool-timeline --parallel 3
      - name: Install backend dependencies (macOS)
        if: runner.os == 'macOS'
        # The package with server bundles the backend, which needs the
        # workspace packages and their native modules.
        run: npm ci
      - name: Install Apple certificate
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The same keychain and notarytool profile as the Electron release (release.yaml).
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Package and verify macOS
        if: runner.os == 'macOS'
        run: |
          # Builds "NodeTool Timeline.app" through package-macos.sh, then the copy with the server inside.
          NT_JOBS=3 native/timeline/scripts/package-macos-with-server.sh
          native/timeline/scripts/make-fixtures.sh
          # Use the same built app for the existing parity check: no second build.
          # The check refuses an identity signature, so it runs before signing.
          DEV_BIN='build-package/nodetool-timeline.app/Contents/MacOS/nodetool-timeline' native/timeline/scripts/check-package-macos.sh
          for name in 'NodeTool Timeline' 'NodeTool Timeline (with server)'; do
            native/timeline/scripts/sign-macos.sh "native/timeline/build-package/$name.app"
          done
          package() {
            local name=$1 asset=$2
            ditto -c -k --sequesterRsrc --keepParent "native/timeline/build-package/$name.app" "release-assets/$asset"
            mkdir "$RUNNER_TEMP/$asset"
            ditto -x -k "release-assets/$asset" "$RUNNER_TEMP/$asset"
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/$asset/$name.app"
            python3 native/timeline/scripts/smoke-package.py "$RUNNER_TEMP/$asset/$name.app/Contents/MacOS/nodetool-timeline" \
              --package "$RUNNER_TEMP/$asset" --version "$APP_VERSION"
          }
          package 'NodeTool Timeline' "nodetool-timeline-$VERSION-$RELEASE_PLATFORM.zip"
          package 'NodeTool Timeline (with server)' "nodetool-timeline-with-server-$VERSION-$RELEASE_PLATFORM.zip"
      - name: Package and verify Windows
        if: runner.os == 'Windows'
        run: |
          bash native/timeline/scripts/package-windows.sh
          # Future Windows signing belongs here, before archiving.
          7z a "release-assets/nodetool-timeline-$VERSION-$RELEASE_PLATFORM.zip" ./native/timeline/build-ci/package-windows/*
          7z x -o"$RUNNER_TEMP/release-extracted" "release-assets/nodetool-timeline-$VERSION-$RELEASE_PLATFORM.zip"
          python native/timeline/scripts/smoke-package.py "$RUNNER_TEMP/release-extracted/nodetool-timeline.exe" \
            --package "$RUNNER_TEMP/release-extracted" --version "$APP_VERSION"
      - name: Package and verify Linux
        if: runner.os == 'Linux'
        run: |
          bash native/timeline/scripts/package-linux.sh
          # Future Linux package signing belongs here.
          images=(./*.AppImage)
          [[ ${#images[@]} == 1 ]]
          mv "${images[0]}" "release-assets/nodetool-timeline-$VERSION-$RELEASE_PLATFORM.AppImage"
          image="$GITHUB_WORKSPACE/release-assets/nodetool-timeline-$VERSION-$RELEASE_PLATFORM.AppImage"
          chmod +x "$image"
          mkdir "$RUNNER_TEMP/release-extracted"
          (cd "$RUNNER_TEMP/release-extracted" && "$image" --appimage-extract)
          xvfb-run -a python3 native/timeline/scripts/smoke-package.py "$RUNNER_TEMP/release-extracted/squashfs-root/AppRun" \
            --package "$RUNNER_TEMP/release-extracted/squashfs-root" --version "$APP_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timeline-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timeline-*
          merge-multiple: true
          path: release-assets
      - name: Check assets and write checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          files=("nodetool-timeline-$VERSION-macos-arm64.zip" "nodetool-timeline-with-server-$VERSION-macos-arm64.zip" "nodetool-timeline-$VERSION-windows-x64.zip" "nodetool-timeline-$VERSION-linux-x64.AppImage")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Fail if a release already exists. Never modify a published release.
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "NodeTool Timeline $TAG" \
            --notes 'The macOS builds are signed with a Developer ID and notarized. The Windows and Linux builds are unsigned. A person must review and publish this draft.

          macOS: extract the ZIP and open NodeTool Timeline.app. The "with server" ZIP holds a NodeTool server that the app starts when it opens without a file, so it needs no other NodeTool install.

          Windows: extract the ZIP and run nodetool-timeline.exe. In SmartScreen choose More info, then Run anyway.

          Linux: run chmod +x nodetool-timeline-*-linux-x64.AppImage, then launch the AppImage. A FUSE installation may be needed, or use --appimage-extract-and-run.

          Verify the download against SHA256SUMS.txt before opening it.' \
            release-assets/*
