name: Native timeline release

# Called by release.yaml for every NodeTool release (v* tags and nightlies).
# Its assets join that release: release.yaml's publish job downloads every
# workflow artifact of the run, including timeline-<platform>. It builds the
# commit of the calling run. A ref input would let the restored caches of
# setup-native-timeline meet a checkout chosen by a caller (CodeQL cache
# poisoning), so release.yaml skips it when the release builds another commit.
on:
  workflow_call:
    inputs:
      version:
        description: NodeTool release version without the leading v. It names the downloads.
        required: true
        type: string

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'
  NT_NO_HW_DECODE: '1'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 native/timeline/scripts/release-version.py "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      # Not PLATFORM: the Visual Studio shell sets that to x64 on Windows.
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          # A release must not restore a cache another run could have written.
          package-manager-cache: false
      - name: Set temporary paths
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          mkdir -p release-assets
          if [[ "$RUNNER_OS" == macOS ]]; then test "$(uname -m)" = arm64; fi
      - uses: ./.github/actions/setup-native-timeline
      # Release packaging builds only the app once per platform. The full test
      # suite belongs to native-timeline.yml, to bound runtime and runner disk use.
      - name: Build app (Windows and Linux)
        if: runner.os != 'macOS'
        run: |
          cmake -S native/timeline -B native/timeline/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          bash .github/scripts/disk-usage.sh cmake --build native/timeline/build-ci --target nodetool-timeline --parallel 3
      - name: Install backend dependencies
        # The package with server bundles the backend, which needs the
        # workspace packages and their native modules.
        run: npm ci
      - name: Install Apple certificate
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The same keychain and notarytool profile as the Electron release (release.yaml).
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Package and verify macOS
        if: runner.os == 'macOS'
        run: |
          # Builds "NodeTool Timeline.app" through package-macos.sh, then the copy with the server inside.
          NT_JOBS=3 native/timeline/scripts/package-macos-with-server.sh
          native/timeline/scripts/make-fixtures.sh
          # Use the same built app for the existing parity check: no second build.
          # The check refuses an identity signature, so it runs before signing.
          # It audits the app without the backend, whose native Node modules
          # are outside its licence audit.
          DEV_BIN='build-package/nodetool-timeline.app/Contents/MacOS/nodetool-timeline' native/timeline/scripts/check-package-macos.sh
          # Only the app with the server ships, under the plain name.
          build=native/timeline/build-package
          rm -rf "$build/NodeTool Timeline.app"
          mv "$build/NodeTool Timeline (with server).app" "$build/NodeTool Timeline.app"
          native/timeline/scripts/sign-macos.sh "$build/NodeTool Timeline.app"
          asset="nodetool-timeline-$VERSION-$RELEASE_PLATFORM.zip"
          ditto -c -k --sequesterRsrc --keepParent "$build/NodeTool Timeline.app" "release-assets/$asset"
          mkdir "$RUNNER_TEMP/release-extracted"
          ditto -x -k "release-assets/$asset" "$RUNNER_TEMP/release-extracted"
          app="$RUNNER_TEMP/release-extracted/NodeTool Timeline.app"
          spctl --assess --type execute --verbose=2 "$app"
          python3 native/timeline/scripts/smoke-package.py "$app/Contents/MacOS/nodetool-timeline" \
            --package "$RUNNER_TEMP/release-extracted" --version "$APP_VERSION"
          node scripts/smoke-backend-bundle.mjs "$app/Contents/Resources/backend"
      - name: Package and verify Windows
        if: runner.os == 'Windows'
        run: |
          bash native/timeline/scripts/package-windows.sh
          bash native/timeline/scripts/package-windows-with-server.sh
          # Future Windows signing belongs here, before archiving.
          asset="nodetool-timeline-$VERSION-$RELEASE_PLATFORM.zip"
          7z a "release-assets/$asset" ./native/timeline/build-ci/package-windows-with-server/*
          7z x -o"$RUNNER_TEMP/release-extracted" "release-assets/$asset"
          python native/timeline/scripts/smoke-package.py "$RUNNER_TEMP/release-extracted/nodetool-timeline.exe" \
            --package "$RUNNER_TEMP/release-extracted" --version "$APP_VERSION"
          node scripts/smoke-backend-bundle.mjs "$RUNNER_TEMP/release-extracted/backend"
      - name: Package and verify Linux
        if: runner.os == 'Linux'
        run: |
          # package-linux.sh deploys the AppDir that the server package copies.
          bash native/timeline/scripts/package-linux.sh
          rm -f ./*.AppImage
          bash native/timeline/scripts/package-linux-with-server.sh
          # Future Linux package signing belongs here.
          image="$GITHUB_WORKSPACE/release-assets/nodetool-timeline-$VERSION-$RELEASE_PLATFORM.AppImage"
          mv nodetool-timeline-with-server-linux-x64.AppImage "$image"
          chmod +x "$image"
          mkdir "$RUNNER_TEMP/release-extracted"
          (cd "$RUNNER_TEMP/release-extracted" && "$image" --appimage-extract)
          root="$RUNNER_TEMP/release-extracted/squashfs-root"
          xvfb-run -a python3 native/timeline/scripts/smoke-package.py "$root/AppRun" \
            --package "$root" --version "$APP_VERSION"
          node scripts/smoke-backend-bundle.mjs "$root/usr/share/nodetool-timeline/backend"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timeline-${{ matrix.platform }}
          retention-days: 7
          path: release-assets/*
          if-no-files-found: error

