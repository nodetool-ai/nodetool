name: Deploy to Docker

# Keep the historical filename so existing workflow links remain valid.
# Pages follows this workflow's successful "Deploy server" job.
on:
  workflow_run:
    workflows: ["Docker", "User Journeys"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-production-deploy
  cancel-in-progress: false

jobs:
  # Deploys a commit once both of its release checks have passed: the Docker
  # image build (once a day on main, or dispatched) and User Journeys with
  # reliability Ring 1 (every push to main). Each workflow's completion
  # triggers this one, so the gate never waits: when the other check has not
  # finished, it exits without deploying, and that check's own completion
  # runs the gate again.
  #
  # A commit is superseded when it is not the head of the newest Docker build
  # on main. Comparing with main's tip instead would skip the daily release
  # whenever anything merged while the image was building.
  gate:
    name: Check Docker build + reliability Ring 1
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Check both workflows on the exact commit
        id: check
        shell: bash
        run: |
          set -euo pipefail
          sha="$RELEASE_SHA"
          repo="$RELEASE_REPO"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          latest_build="$(gh api "repos/$repo/actions/workflows/docker.yml/runs?branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [[ "$latest_build" != "$sha" ]]; then
            echo "::notice::Not deploying $sha: the newest Docker build on main is ${latest_build:-none}."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A scheduled Docker run that found nothing new cancels itself, so
          # look for any successful build of this commit, not the latest run.
          docker_builds="$(gh api "repos/$repo/actions/workflows/docker.yml/runs?head_sha=$sha&status=success&per_page=1" \
            --jq '.total_count')"
          journeys_conclusion="$(gh api "repos/$repo/actions/workflows/user-journeys.yml/runs?head_sha=$sha&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "pending"')"
          echo "Docker successful builds=$docker_builds User Journeys=$journeys_conclusion"

          case "$journeys_conclusion" in
            failure|cancelled|timed_out|action_required|startup_failure|stale)
              echo "::error::User Journeys did not pass for $sha."
              exit 1
              ;;
          esac
          if [[ "$docker_builds" -gt 0 && "$journeys_conclusion" == success ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release checks for $sha are not finished; the last one to finish deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy server
    needs: [gate]
    if: needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_HOST: ${{ vars.DOCKER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DOCKER_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCKER_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Rolling Docker release over restricted SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo '::error::Missing Docker deployment SSH secrets.'
            exit 1
          }
          ssh_dir="$(mktemp -d)"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_SHA"
