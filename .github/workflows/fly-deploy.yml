name: Deploy to Docker

# Keep the historical filename so existing workflow links remain valid.
# Pages follows this workflow's successful "Deploy server" job.
on:
  workflow_run:
    workflows: ["Docker", "User Journeys"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-production-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for Docker build + reliability Ring 1
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    timeout-minutes: 65
    outputs:
      sha: ${{ steps.poll.outputs.sha }}
      deploy: ${{ steps.poll.outputs.deploy }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Wait for both workflows on the exact commit
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          sha="$RELEASE_SHA"
          repo="$RELEASE_REPO"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          conclusion_for() {
            gh api "repos/$repo/actions/workflows/$1/runs?head_sha=$sha&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"'
          }

          for attempt in $(seq 1 60); do
            if [[ "$(gh api "repos/$repo/commits/main" --jq .sha)" != "$sha" ]]; then
              echo "::notice::Skipping superseded commit $sha."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            docker_conclusion="$(conclusion_for docker.yml)"
            journeys_conclusion="$(conclusion_for user-journeys.yml)"
            echo "Attempt $attempt: Docker=$docker_conclusion User Journeys=$journeys_conclusion"
            if [[ "$docker_conclusion" == success && "$journeys_conclusion" == success ]]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            for conclusion in "$docker_conclusion" "$journeys_conclusion"; do
              case "$conclusion" in
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "::error::Release checks did not pass for $sha."
                  exit 1
                  ;;
              esac
            done
            sleep 60
          done
          echo "::error::Timed out waiting for release checks for $sha."
          exit 1

  deploy:
    name: Deploy server
    needs: [gate]
    if: needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      DEPLOY_HOST: ${{ vars.DOCKER_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DOCKER_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DOCKER_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCKER_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Rolling Docker release over restricted SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || {
            echo '::error::Missing Docker deployment SSH secrets.'
            exit 1
          }
          ssh_dir="$(mktemp -d)"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_SHA"
