name: E2E Workflow Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/e2e-runner.html"
      - "web/src/e2e_runner/**"
      - "web/tests/e2e-runner/**"
      - "web/playwright.e2e-runner.config.ts"
      - "web/tsconfig.playwright.json"
      - "web/package.json"
      # The suite exercises the whole backend execution stack, so trigger on any
      # package change (kernel, runtime, node-sdk, base-nodes, agents, chat,
      # websocket, …) — not just the harness's own server files.
      - "packages/**"
      - "examples/workflows/**"
      - ".github/workflows/e2e-runner.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - "web/e2e-runner.html"
      - "web/src/e2e_runner/**"
      - "web/tests/e2e-runner/**"
      - "web/playwright.e2e-runner.config.ts"
      - "web/tsconfig.playwright.json"
      - "web/package.json"
      # The suite exercises the whole backend execution stack, so trigger on any
      # package change (kernel, runtime, node-sdk, base-nodes, agents, chat,
      # websocket, …) — not just the harness's own server files.
      - "packages/**"
      - "examples/workflows/**"
      - ".github/workflows/e2e-runner.yml"

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR; the latest push is what matters.
concurrency:
  # Adding any other label to a PR also triggers a run, whose jobs skip. It
  # gets a group of its own so it cannot cancel a run that is testing.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'browser-suites' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  e2e-workflow-runner:
    name: Run workflow suite in browser
    # Advisory on pull requests and opt-in there: a PR runs this suite only
    # with the `browser-suites` label, which saves its runner time on the
    # many PRs that do not need it. Pushes to main, nightly and manual runs
    # always run it.
    if: >-
      ${{ github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'browser-suites')
      && (github.event.action != 'labeled' || github.event.label.name == 'browser-suites')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node, install deps, build packages
        # mesa-vulkan-drivers ships lavapipe (CPU Vulkan ICD) so headless
        # Chromium can acquire a WebGPU adapter on GPU-less CI runners.
        uses: ./.github/actions/setup-build
        with:
          extra-apt: mesa-vulkan-drivers

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Type-check Playwright suites
        run: npm run typecheck:playwright
        working-directory: web

      - name: Run E2E workflow suite
        run: npm run test:e2e-runner
        working-directory: web
        env:
          CI: "true"
          # Optional provider keys — when present, agent/LLM workflows run for
          # real; otherwise they fall back to a deterministic ScriptedProvider.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload E2E workflow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-workflow-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
