# zizmor (https://docs.zizmor.sh) runs in the lint leg of quality-checks.yml.
# Each ignore names the file and the reason the finding does not apply.
rules:
  dangerous-triggers:
    ignore:
      # Deploys after the Docker workflow, which runs only on pushes to main,
      # preview branches and tags; the deploy job also requires the triggering
      # run's head repository to be this repository.
      - fly-deploy.yml
      # Follows "Deploy to Docker" above and checks that run's deploy job.
      - web-deploy.yml
      # Follows the Release workflow, which runs on schedule, tags and
      # dispatch, never on a pull request.
      - aur-publish.yml
      - homebrew-cask.yml
  unpinned-images:
    ignore:
      # The job container is the CI image that ci-image.yml resolves, and its
      # output is pinned by digest (.github/actions/ci-image). zizmor cannot
      # see through the `needs` expression.
      - e2e-runner.yml
      - marketing-ci.yml
      - mutation-changed.yml
      - mutation-testing.yaml
      - native-gpu-preview.yml
      - native-graph-runner.yml
      - native-timeline.yml
      - native-ui-primitives.yml
      - packed-core-cli.yml
      - page-load-smoke.yml
      - quality-assurance.yaml
      - quality-checks.yml
      - quality-guard.yml
      - screenshots.yml
      - user-journeys.yml
      - vst-host.yml
