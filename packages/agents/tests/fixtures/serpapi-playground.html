<div data-react-class="Playground" data-react-props="{&quot;playground&quot;: true, &quot;development&quot;: false, &quot;root_url&quot;: &quot;https://serpapi.com/&quot;, &quot;parameters&quot;: {&quot;google_scholar&quot;: {&quot;search_query&quot;: {&quot;icon&quot;: &quot;fad fa-comment-dots&quot;, &quot;class_name&quot;: &quot;para-q-header&quot;, &quot;parameters&quot;: {&quot;q&quot;: {&quot;name&quot;: &quot;Search Query&quot;, &quot;html&quot;: &quot;Parameter defines the query you want to search. You can also use helpers in your query such as: &lt;code&gt;author:&lt;/code&gt;, or &lt;code&gt;source:&lt;/code&gt;.&lt;br&gt;&lt;br&gt;Usage of &lt;code&gt;cites&lt;/code&gt; parameter makes &lt;code&gt;q&lt;/code&gt; optional. Usage of &lt;code&gt;cites&lt;/code&gt; together with &lt;code&gt;q&lt;/code&gt; triggers search within citing articles.&lt;br&gt;&lt;br&gt;Usage of &lt;code&gt;cluster&lt;/code&gt; together with &lt;code&gt;q&lt;/code&gt; and &lt;code&gt;cites&lt;/code&gt; parameters is prohibited. Use &lt;code&gt;cluster&lt;/code&gt; parameter only.&quot;, &quot;required&quot;: true}}}, &quot;advanced_google_scholar_parameters&quot;: {&quot;name&quot;: &quot;Advanced Parameters&quot;, &quot;icon&quot;: &quot;fad fa-graduation-cap&quot;, &quot;class_name&quot;: &quot;para-adv-g-header&quot;, &quot;parameters&quot;: {&quot;cites&quot;: {&quot;name&quot;: &quot;Cited By&quot;, &quot;html&quot;: &quot;Parameter defines unique ID for an article to trigger &lt;span class='bold-500'&gt;Cited By&lt;/span&gt; searches. Usage of &lt;code&gt;cites&lt;/code&gt; will bring up a list of citing documents in Google Scholar. Example value: &lt;code&gt;cites=1275980731835430123&lt;/code&gt;. Usage of &lt;code&gt;cites&lt;/code&gt; and &lt;code&gt;q&lt;/code&gt; parameters triggers search within citing articles.&quot;}, &quot;as_ylo&quot;: {&quot;name&quot;: &quot;From Year&quot;, &quot;html&quot;: &quot;Parameter defines the year from which you want the results to be included. (e.g. if you set &lt;span class='parameter-highlight'&gt;as_ylo&lt;/span&gt; parameter to the year &lt;code&gt;2018&lt;/code&gt;, the results before that year will be omitted.). This parameter can be combined with the &lt;span class='parameter-highlight'&gt;as_yhi&lt;/span&gt; parameter.&quot;, &quot;type&quot;: &quot;number&quot;}, &quot;as_yhi&quot;: {&quot;name&quot;: &quot;To Year&quot;, &quot;html&quot;: &quot;Parameter defines the year until which you want the results to be included. (e.g. if you set &lt;span class='parameter-highlight'&gt;as_yhi&lt;/span&gt; parameter to the year &lt;code&gt;2018&lt;/code&gt;, the results after that year will be omitted.). This parameter can be combined with the &lt;span class='parameter-highlight'&gt;as_ylo&lt;/span&gt; parameter.&quot;, &quot;type&quot;: &quot;number&quot;}, &quot;scisbd&quot;: {&quot;name&quot;: &quot;Sort By Date&quot;, &quot;html&quot;: &quot;Parameter defines articles added in the last year, sorted by date. It can be set to &lt;code&gt;1&lt;/code&gt; to include only abstracts, or &lt;code&gt;2&lt;/code&gt; to include everything. The default value is &lt;code&gt;0&lt;/code&gt; which means that the articles are sorted by relevance.&quot;, &quot;type&quot;: &quot;select&quot;, &quot;options&quot;: [[1, &quot;Abstracts&quot;], [2, &quot;Everything&quot;]]}, &quot;cluster&quot;: {&quot;name&quot;: &quot;Versions Of&quot;, &quot;html&quot;: &quot;Parameter defines unique ID for an article to trigger &lt;span class='bold-500'&gt;All Versions&lt;/span&gt; searches. Example value: &lt;code&gt;cluster=1275980731835430123&lt;/code&gt;. Usage of &lt;code&gt;cluster&lt;/code&gt; together with &lt;code&gt;q&lt;/code&gt; and &lt;code&gt;cites&lt;/code&gt; parameters is prohibited. Use &lt;code&gt;cluster&lt;/code&gt; parameter only.&quot;}}}, &quot;localization&quot;: {&quot;name&quot;: &quot;Localization&quot;, &quot;icon&quot;: &quot;fad fa-map-marker-alt&quot;, &quot;class_name&quot;: &quot;para-loc-header&quot;, &quot;parameters&quot;: {&quot;hl&quot;: {&quot;name&quot;: &quot;Language&quot;, &quot;html&quot;: &quot;Parameter defines the language to use for the Google Scholar search. It's a two-letter language code. (e.g., &lt;code&gt;en&lt;/code&gt; for English, &lt;code&gt;es&lt;/code&gt; for Spanish, or &lt;code&gt;fr&lt;/code&gt; for French). Head to the &lt;a href='/google-languages'&gt;Google languages page&lt;/a&gt; for a full list of supported Google languages.&quot;, &quot;type&quot;: &quot;select&quot;, &quot;options&quot;: [[&quot;af&quot;, &quot;Afrikaans - af&quot;], [&quot;ak&quot;, &quot;Akan - ak&quot;], [&quot;sq&quot;, &quot;Albanian - sq&quot;], [&quot;ws&quot;, &quot;Samoa - ws&quot;], [&quot;am&quot;, &quot;Amharic - am&quot;], [&quot;ar&quot;, &quot;Arabic - ar&quot;], [&quot;hy&quot;, &quot;Armenian - hy&quot;], [&quot;az&quot;, &quot;Azerbaijani - az&quot;], [&quot;eu&quot;, &quot;Basque - eu&quot;], [&quot;be&quot;, &quot;Belarusian - be&quot;], [&quot;bem&quot;, &quot;Bemba - bem&quot;], [&quot;bn&quot;, &quot;Bengali - bn&quot;], [&quot;bh&quot;, &quot;Bihari - bh&quot;], [&quot;xx-bork&quot;, &quot;Bork, bork, bork! - xx-bork&quot;], [&quot;bs&quot;, &quot;Bosnian - bs&quot;], [&quot;br&quot;, &quot;Breton - br&quot;], [&quot;bg&quot;, &quot;Bulgarian - bg&quot;], [&quot;bt&quot;, &quot;Bhutanese - bt&quot;], [&quot;km&quot;, &quot;Cambodian - km&quot;], [&quot;ca&quot;, &quot;Catalan - ca&quot;], [&quot;chr&quot;, &quot;Cherokee - chr&quot;], [&quot;ny&quot;, &quot;Chichewa - ny&quot;], [&quot;zh-cn&quot;, &quot;Chinese (Simplified) - zh-cn&quot;], [&quot;zh-tw&quot;, &quot;Chinese (Traditional) - zh-tw&quot;], [&quot;co&quot;, &quot;Corsican - co&quot;], [&quot;hr&quot;, &quot;Croatian - hr&quot;], [&quot;cs&quot;, &quot;Czech - cs&quot;], [&quot;da&quot;, &quot;Danish - da&quot;], [&quot;nl&quot;, &quot;Dutch - nl&quot;], [&quot;xx-elmer&quot;, &quot;Elmer Fudd - xx-elmer&quot;], [&quot;en&quot;, &quot;English - en&quot;], [&quot;eo&quot;, &quot;Esperanto - eo&quot;], [&quot;et&quot;, &quot;Estonian - et&quot;], [&quot;ee&quot;, &quot;Ewe - ee&quot;], [&quot;fo&quot;, &quot;Faroese - fo&quot;], [&quot;tl&quot;, &quot;Filipino - tl&quot;], [&quot;fi&quot;, &quot;Finnish - fi&quot;], [&quot;fr&quot;, &quot;French - fr&quot;], [&quot;fy&quot;, &quot;Frisian - fy&quot;], [&quot;gaa&quot;, &quot;Ga - gaa&quot;], [&quot;gl&quot;, &quot;Galician - gl&quot;], [&quot;ka&quot;, &quot;Georgian - ka&quot;], [&quot;de&quot;, &quot;German - de&quot;], [&quot;el&quot;, &quot;Greek - el&quot;], [&quot;kl&quot;, &quot;Greenlandic - kl&quot;], [&quot;gn&quot;, &quot;Guarani - gn&quot;], [&quot;gu&quot;, &quot;Gujarati - gu&quot;], [&quot;xx-hacker&quot;, &quot;Hacker - xx-hacker&quot;], [&quot;ht&quot;, &quot;Haitian Creole - ht&quot;], [&quot;ha&quot;, &quot;Hausa - ha&quot;], [&quot;haw&quot;, &quot;Hawaiian - haw&quot;], [&quot;iw&quot;, &quot;Hebrew - iw&quot;], [&quot;he&quot;, &quot;Hebrew - he&quot;], [&quot;hi&quot;, &quot;Hindi - hi&quot;], [&quot;hu&quot;, &quot;Hungarian - hu&quot;], [&quot;is&quot;, &quot;Icelandic - is&quot;], [&quot;ig&quot;, &quot;Igbo - ig&quot;], [&quot;id&quot;, &quot;Indonesian - id&quot;], [&quot;ia&quot;, &quot;Interlingua - ia&quot;], [&quot;ga&quot;, &quot;Irish - ga&quot;], [&quot;it&quot;, &quot;Italian - it&quot;], [&quot;ja&quot;, &quot;Japanese - ja&quot;], [&quot;jw&quot;, &quot;Javanese - jw&quot;], [&quot;kn&quot;, &quot;Kannada - kn&quot;], [&quot;kk&quot;, &quot;Kazakh - kk&quot;], [&quot;rw&quot;, &quot;Kinyarwanda - rw&quot;], [&quot;rn&quot;, &quot;Kirundi - rn&quot;], [&quot;xx-klingon&quot;, &quot;Klingon - xx-klingon&quot;], [&quot;kg&quot;, &quot;Kongo - kg&quot;], [&quot;ko&quot;, &quot;Korean - ko&quot;], [&quot;kri&quot;, &quot;Krio (Sierra Leone) - kri&quot;], [&quot;ku&quot;, &quot;Kurdish - ku&quot;], [&quot;ckb&quot;, &quot;Kurdish (Soran\u00ee) - ckb&quot;], [&quot;ky&quot;, &quot;Kyrgyz - ky&quot;], [&quot;lo&quot;, &quot;Laothian - lo&quot;], [&quot;la&quot;, &quot;Latin - la&quot;], [&quot;lv&quot;, &quot;Latvian - lv&quot;], [&quot;ln&quot;, &quot;Lingala - ln&quot;], [&quot;lt&quot;, &quot;Lithuanian - lt&quot;], [&quot;loz&quot;, &quot;Lozi - loz&quot;], [&quot;lg&quot;, &quot;Luganda - lg&quot;], [&quot;ach&quot;, &quot;Luo - ach&quot;], [&quot;mk&quot;, &quot;Macedonian - mk&quot;], [&quot;mg&quot;, &quot;Malagasy - mg&quot;], [&quot;ms&quot;, &quot;Malay - ms&quot;], [&quot;ml&quot;, &quot;Malayalam - ml&quot;], [&quot;mt&quot;, &quot;Maltese - mt&quot;], [&quot;mv&quot;, &quot;Maldives - mv&quot;], [&quot;mi&quot;, &quot;Maori - mi&quot;], [&quot;mr&quot;, &quot;Marathi - mr&quot;], [&quot;mfe&quot;, &quot;Mauritian Creole - mfe&quot;], [&quot;mo&quot;, &quot;Moldavian - mo&quot;], [&quot;mn&quot;, &quot;Mongolian - mn&quot;], [&quot;sr-me&quot;, &quot;Montenegrin - sr-me&quot;], [&quot;my&quot;, &quot;Myanmar - my&quot;], [&quot;ne&quot;, &quot;Nepali - ne&quot;], [&quot;pcm&quot;, &quot;Nigerian Pidgin - pcm&quot;], [&quot;nso&quot;, &quot;Northern Sotho - nso&quot;], [&quot;no&quot;, &quot;Norwegian - no&quot;], [&quot;nn&quot;, &quot;Norwegian (Nynorsk) - nn&quot;], [&quot;oc&quot;, &quot;Occitan - oc&quot;], [&quot;or&quot;, &quot;Oriya - or&quot;], [&quot;om&quot;, &quot;Oromo - om&quot;], [&quot;ps&quot;, &quot;Pashto - ps&quot;], [&quot;fa&quot;, &quot;Persian - fa&quot;], [&quot;xx-pirate&quot;, &quot;Pirate - xx-pirate&quot;], [&quot;pl&quot;, &quot;Polish - pl&quot;], [&quot;pt&quot;, &quot;Portuguese - pt&quot;], [&quot;pt-br&quot;, &quot;Portuguese (Brazil) - pt-br&quot;], [&quot;pt-pt&quot;, &quot;Portuguese (Portugal) - pt-pt&quot;], [&quot;pa&quot;, &quot;Punjabi - pa&quot;], [&quot;qu&quot;, &quot;Quechua - qu&quot;], [&quot;ro&quot;, &quot;Romanian - ro&quot;], [&quot;rm&quot;, &quot;Romansh - rm&quot;], [&quot;nyn&quot;, &quot;Runyakitara - nyn&quot;], [&quot;ru&quot;, &quot;Russian - ru&quot;], [&quot;gd&quot;, &quot;Scots Gaelic - gd&quot;], [&quot;sr&quot;, &quot;Serbian - sr&quot;], [&quot;sh&quot;, &quot;Serbo-Croatian - sh&quot;], [&quot;st&quot;, &quot;Sesotho - st&quot;], [&quot;tn&quot;, &quot;Setswana - tn&quot;], [&quot;crs&quot;, &quot;Seychellois Creole - crs&quot;], [&quot;sn&quot;, &quot;Shona - sn&quot;], [&quot;sd&quot;, &quot;Sindhi - sd&quot;], [&quot;si&quot;, &quot;Sinhalese - si&quot;], [&quot;sk&quot;, &quot;Slovak - sk&quot;], [&quot;sl&quot;, &quot;Slovenian - sl&quot;], [&quot;so&quot;, &quot;Somali - so&quot;], [&quot;es&quot;, &quot;Spanish - es&quot;], [&quot;es-419&quot;, &quot;Spanish (Latin American) - es-419&quot;], [&quot;su&quot;, &quot;Sundanese - su&quot;], [&quot;sw&quot;, &quot;Swahili - sw&quot;], [&quot;sv&quot;, &quot;Swedish - sv&quot;], [&quot;tg&quot;, &quot;Tajik - tg&quot;], [&quot;ta&quot;, &quot;Tamil - ta&quot;], [&quot;tt&quot;, &quot;Tatar - tt&quot;], [&quot;te&quot;, &quot;Telugu - te&quot;], [&quot;th&quot;, &quot;Thai - th&quot;], [&quot;ti&quot;, &quot;Tigrinya - ti&quot;], [&quot;to&quot;, &quot;Tonga - to&quot;], [&quot;lua&quot;, &quot;Tshiluba - lua&quot;], [&quot;tum&quot;, &quot;Tumbuka - tum&quot;], [&quot;tr&quot;, &quot;Turkish - tr&quot;], [&quot;tk&quot;, &quot;Turkmen - tk&quot;], [&quot;tw&quot;, &quot;Twi - tw&quot;], [&quot;ug&quot;, &quot;Uighur - ug&quot;], [&quot;uk&quot;, &quot;Ukrainian - uk&quot;], [&quot;ur&quot;, &quot;Urdu - ur&quot;], [&quot;uz&quot;, &quot;Uzbek - uz&quot;], [&quot;vu&quot;, &quot;Vanuatu - vu&quot;], [&quot;vi&quot;, &quot;Vietnamese - vi&quot;], [&quot;cy&quot;, &quot;Welsh - cy&quot;], [&quot;wo&quot;, &quot;Wolof - wo&quot;], [&quot;xh&quot;, &quot;Xhosa - xh&quot;], [&quot;yi&quot;, &quot;Yiddish - yi&quot;], [&quot;yo&quot;, &quot;Yoruba - yo&quot;], [&quot;zu&quot;, &quot;Zulu - zu&quot;]]}, &quot;lr&quot;: {&quot;name&quot;: &quot;Set Multiple Languages&quot;, &quot;html&quot;: &quot;Parameter defines one or multiple languages to limit the search to. It uses &lt;code&gt;lang_{two-letter language code}&lt;/code&gt; to specify languages and &lt;code&gt;|&lt;/code&gt; as a delimiter. (e.g., &lt;code&gt;lang_fr|lang_de&lt;/code&gt; will only search French and German pages). Head to the &lt;a href='/google-lr-languages' target='_blank'&gt;Google lr languages&lt;/a&gt; for a full list of supported languages.&quot;}}}, &quot;pagination&quot;: {&quot;name&quot;: &quot;Pagination&quot;, &quot;icon&quot;: &quot;fad fa-file-import&quot;, &quot;class_name&quot;: &quot;para-pag-header&quot;, &quot;parameters&quot;: {&quot;start&quot;: {&quot;name&quot;: &quot;Result Offset&quot;, &quot;html&quot;: &quot;Parameter defines the result offset. It skips the given number of results. It's used for pagination. (e.g., &lt;code&gt;0&lt;/code&gt; (default) is the first page of results, &lt;code&gt;10&lt;/code&gt; is the 2nd page of results, &lt;code&gt;20&lt;/code&gt; is the 3rd page of results, etc.).&quot;, &quot;type&quot;: &quot;number&quot;}, &quot;num&quot;: {&quot;name&quot;: &quot;Number of Results&quot;, &quot;html&quot;: &quot;Parameter defines the maximum number of results to return, ranging from &lt;code&gt;1&lt;/code&gt; to &lt;code&gt;20&lt;/code&gt;, with a default of &lt;code&gt;10&lt;/code&gt;.&quot;, &quot;type&quot;: &quot;number&quot;}}}, &quot;search_type&quot;: {&quot;name&quot;: &quot;Search Type&quot;, &quot;icon&quot;: &quot;fad fa-search&quot;, &quot;class_name&quot;: &quot;para-tbm-header&quot;, &quot;parameters&quot;: {&quot;as_sdt&quot;: {&quot;name&quot;: &quot;Search Type / Filter&quot;, &quot;html&quot;: &quot;Parameter can be used either as a search type or a filter.&lt;br/&gt;&lt;br/&gt;&lt;b&gt;As a Filter&lt;/b&gt; (only works when searching articles):&lt;br/&gt;&lt;code&gt;0&lt;/code&gt; - exclude patents (default).&lt;br/&gt;&lt;code&gt;7&lt;/code&gt; - include patents.&lt;br/&gt;&lt;br/&gt;&lt;b&gt;As a Search Type&lt;/b&gt;:&lt;br/&gt;&lt;code&gt;4&lt;/code&gt; - Select case law (US courts only). This will select all the State and Federal courts.&lt;br/&gt;e.g. &lt;code&gt;as_sdt=4&lt;/code&gt; - Selects case law (all courts)&lt;br/&gt;&lt;br/&gt;To select specific courts, see the full list of supported &lt;a href='/google-scholar-courts' target='_blank'&gt;Google Scholar courts&lt;/a&gt;.&lt;br/&gt;e.g. &lt;code&gt;as_sdt=4,33,192&lt;/code&gt; - &lt;code&gt;4&lt;/code&gt; is the &lt;span class='red'&gt;required&lt;/span&gt; value and should always be in the first position, &lt;code&gt;33&lt;/code&gt; selects all New York courts and &lt;code&gt;192&lt;/code&gt; selects Tax Court.&lt;br/&gt;Values have to be separated by comma (&lt;code&gt;,&lt;/code&gt;)&quot;}}}, &quot;advanced_filters&quot;: {&quot;name&quot;: &quot;Advanced Filters&quot;, &quot;icon&quot;: &quot;fad fa-filter&quot;, &quot;class_name&quot;: &quot;para-adv-header&quot;, &quot;parameters&quot;: {&quot;safe&quot;: {&quot;name&quot;: &quot;Adult Content Filtering&quot;, &quot;html&quot;: &quot;Parameter defines the level of filtering for adult content. It can be set to &lt;code&gt;active&lt;/code&gt; or &lt;code&gt;off&lt;/code&gt;, by default Google will blur explicit content.&quot;, &quot;type&quot;: &quot;select&quot;, &quot;options&quot;: [[&quot;active&quot;, &quot;Active&quot;], [&quot;off&quot;, &quot;Off&quot;]]}, &quot;filter&quot;: {&quot;name&quot;: &quot;Results Filtering&quot;, &quot;html&quot;: &quot;Parameter defines if the filters for 'Similar Results' and 'Omitted Results' are on or off. It can be set to &lt;code&gt;1&lt;/code&gt; (default) to enable these filters, or &lt;code&gt;0&lt;/code&gt; to disable these filters.&quot;, &quot;type&quot;: &quot;checkbox&quot;}, &quot;as_vis&quot;: {&quot;name&quot;: &quot;Show Citations&quot;, &quot;html&quot;: &quot;Parameter defines whether you would like to include citations or not. It can be set to &lt;code&gt;1&lt;/code&gt; to exclude these results, or &lt;code&gt;0&lt;/code&gt; (default) to include them.&quot;, &quot;type&quot;: &quot;checkbox&quot;}, &quot;as_rr&quot;: {&quot;name&quot;: &quot;Show Only Review Articles&quot;, &quot;html&quot;: &quot;Parameter defines whether you would like to show only review articles or not (these articles consist of topic reviews, or discuss the works or authors you have searched for). It can be set to &lt;code&gt;1&lt;/code&gt; to enable this filter, or &lt;code&gt;0&lt;/code&gt; (default) to show all results.&quot;, &quot;type&quot;: &quot;checkbox&quot;}}}, &quot;serpapi_parameters&quot;: {&quot;name&quot;: &quot;SerpApi Parameters&quot;, &quot;icon&quot;: &quot;/assets/square-logo-v3-small.png&quot;, &quot;class_name&quot;: &quot;para-serp-header&quot;, &quot;parameters&quot;: {&quot;engine&quot;: {&quot;name&quot;: &quot;Search Engine&quot;, &quot;html&quot;: &quot;Set parameter to &lt;code&gt;google_scholar&lt;/code&gt; to use the Google Scholar API engine.&quot;, &quot;required&quot;: true}, &quot;no_cache&quot;: {&quot;name&quot;: &quot;Disable Caching&quot;, &quot;html&quot;: &quot;Parameter will force SerpApi to fetch the Google Scholar results even if a cached version is already present. A cache is served only if the query and all parameters are exactly the same. Cache expires after 1h. Cached searches are free, and are not counted towards your searches per month. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to allow results from the cache, or &lt;code&gt;true&lt;/code&gt; to disallow results from the cache. &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; parameters should not be used together.&quot;, &quot;type&quot;: &quot;checkbox&quot;}, &quot;async&quot;: {&quot;name&quot;: &quot;Async&quot;, &quot;html&quot;: &quot;Parameter defines the way you want to submit your search to SerpApi. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to open an HTTP connection and keep it open until you got your search results, or &lt;code&gt;true&lt;/code&gt; to just submit your search to SerpApi and retrieve them later. In this case, you'll need to use our &lt;a href='/search-archive-api'&gt;Searches Archive API&lt;/a&gt; to retrieve your results. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; parameters should not be used together. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; should not be used on accounts with &lt;a href='https://serpapi.com/plan'&gt;Ludicrous Speed&lt;/a&gt; enabled.&quot;}, &quot;zero_trace&quot;: {&quot;name&quot;: &quot;ZeroTrace Mode&quot;, &quot;html&quot;: &quot;Enterprise only. Parameter enables &lt;a href='/zero-trace-mode'&gt;ZeroTrace mode&lt;/a&gt;. It can be set to &lt;code&gt;false&lt;/code&gt; (default) or &lt;code&gt;true&lt;/code&gt;. Enable this mode to skip storing search parameters, search files, and search metadata on our servers. This may make debugging more difficult.&quot;}, &quot;api_key&quot;: {&quot;name&quot;: &quot;API Key&quot;, &quot;html&quot;: &quot;Parameter defines the SerpApi private key to use.&quot;, &quot;required&quot;: true}, &quot;output&quot;: {&quot;name&quot;: &quot;Output&quot;, &quot;html&quot;: &quot;Parameter defines the format of the result. It can be set to &lt;code&gt;json&lt;/code&gt; (default) to get a structured JSON of the results, &lt;code&gt;html&lt;/code&gt; to get the raw HTML retrieved, or &lt;code&gt;md&lt;/code&gt; to get a markdown-formatted version optimized for LLMs and AI agents.&quot;}, &quot;json_restrictor&quot;: {&quot;hidden_from_playground&quot;: true, &quot;name&quot;: &quot;JSON Restrictor&quot;, &quot;html&quot;: &quot;Parameter defines the fields you want to include in the output, reducing payload size for faster response. See the &lt;a href='/json-restrictor' target='_blank'&gt;JSON Restrictor documentation&lt;/a&gt; for more details.&quot;}}}}, &quot;amazon&quot;: {&quot;search_query&quot;: {&quot;icon&quot;: &quot;fad fa-comment-dots&quot;, &quot;class_name&quot;: &quot;para-q-header&quot;, &quot;parameters&quot;: {&quo t;ZM&quot;, &quot;Zambia&quot;], [&quot;ZW&quot;, &quot;Zimbabwe&quot;]]}, &quot;s&quot;: {&quot;name&quot;: &quot;Sort By&quot;, &quot;html&quot;: &quot;Parameter is used for sorting results. Available options:&lt;br&gt;&lt;br&gt;&lt;code&gt;relevanceblender&lt;/code&gt; - Featured (default)&lt;br&gt;&lt;code&gt;price-asc-rank&lt;/code&gt; - Price: Low to High&lt;br&gt;&lt;code&gt;price-desc-rank&lt;/code&gt; - Price: High to Low&lt;br&gt;&lt;code&gt;review-rank&lt;/code&gt; - Avg. Customer Review&lt;br&gt;&lt;code&gt;date-desc-rank&lt;/code&gt; - Newest Arrivals&lt;br&gt;&lt;code&gt;exact-aware-popularity-rank&lt;/code&gt; - Best Sellers&quot;, &quot;type&quot;: &quot;select&quot;, &quot;options&quot;: [[&quot;relevanceblender&quot;, &quot;Featured&quot;], [&quot;price-asc-rank&quot;, &quot;Price: Low to High&quot;], [&quot;price-desc-rank&quot;, &quot;Price: High to Low&quot;], [&quot;review-rank&quot;, &quot;Avg. Customer Review&quot;], [&quot;date-desc-rank&quot;, &quot;Newest Arrivals&quot;], [&quot;exact-aware-popularity-rank&quot;, &quot;Best Sellers&quot;]]}}}, &quot;advanced_filters&quot;: {&quot;name&quot;: &quot;Advanced Filters&quot;, &quot;icon&quot;: &quot;fad fa-filter&quot;, &quot;class_name&quot;: &quot;para-adv-header&quot;, &quot;parameters&quot;: {&quot;node&quot;: {&quot;name&quot;: &quot;Category&quot;, &quot;html&quot;: &quot;Parameter specifies the category for Amazon search results. You can find the appropriate node value by browsing Amazon\u2019s website and accessing a specific category. The node ID is typically included in the URL after the format &lt;code&gt;node=[NODE ID]&lt;/code&gt;. For example, on Amazon.com, the node for Smart Home is &lt;code&gt;6563140011&lt;/code&gt;, and on Amazon.co.uk, the node for Fashion is &lt;code&gt;11961407031&lt;/code&gt;. Use this node value to filter search results by category.&lt;br&gt;&lt;br&gt;&lt;span class='bold-500'&gt;&lt;i class='fas fa-info-circle mr-2 opacity-3'&gt;&lt;/i&gt;This parameter can't be used with the &lt;span class='parameter-highlight'&gt;k&lt;/span&gt; parameter.&lt;/span&gt;&lt;br&gt;&lt;br&gt;Head to &lt;a href='amazon-category-nodes'&gt;Amazon Category Nodes&lt;/a&gt; for a full list of supported Amazon Categories.&quot;}, &quot;rh&quot;: {&quot;name&quot;: &quot;Filters&quot;, &quot;html&quot;: &quot;Parameter defines items filtering based on their attributes. The structure is a list of &lt;code&gt;key:value&lt;/code&gt; pairs separated by &lt;code&gt;,&lt;/code&gt;.&lt;br&gt;&lt;br&gt;For example &lt;code&gt;n:16318031,p_n_cpf_eligible:21512497011,p_72:1248897011&lt;/code&gt; to filter for products in &lt;b&gt;&lt;a href='https://www.browsenodes.com/amazon.com/browseNodeLookup/16318031.html' target='_blank'&gt;Coffee&lt;/a&gt;&lt;/b&gt; department (&lt;code&gt;n:16318031&lt;/code&gt;) that are &lt;b&gt;Climate Pledge Friendly&lt;/b&gt; (&lt;code&gt;p_n_cpf_eligible:21512497011&lt;/code&gt;) and rated &lt;b&gt;4 Stars &amp; Up&lt;/b&gt; (&lt;code&gt;p_72:1248897011&lt;/code&gt;).&lt;br&gt;&lt;br&gt;Head to &lt;a href='amazon-category-nodes'&gt;Amazon Category Nodes&lt;/a&gt; for a full list of supported Amazon Categories.&quot;}, &quot;dc&quot;: {&quot;name&quot;: &quot;Exclude Auto-corrected Results&quot;, &quot;html&quot;: &quot;Parameter defines the exclusion of results from an auto-corrected query when the original query is spelled wrong. It can be set to &lt;code&gt;true&lt;/code&gt; to exclude these results, or &lt;code&gt;false&lt;/code&gt; to include them (default).&quot;, &quot;type&quot;: &quot;checkbox&quot;}}}, &quot;pagination&quot;: {&quot;name&quot;: &quot;Pagination&quot;, &quot;icon&quot;: &quot;fad fa-file-import&quot;, &quot;class_name&quot;: &quot;para-pag-header&quot;, &quot;parameters&quot;: {&quot;page&quot;: {&quot;name&quot;: &quot;Page Number&quot;, &quot;html&quot;: &quot;Parameter defines the page number. It's used for pagination. (e.g., &lt;code&gt;1&lt;/code&gt; (default) is the first page of results, &lt;code&gt;2&lt;/code&gt; is the 2nd page of results, &lt;code&gt;3&lt;/code&gt; is the 3rd page of results, etc.).&quot;, &quot;type&quot;: &quot;number&quot;}}}, &quot;serpapi_parameters&quot;: {&quot;name&quot;: &quot;SerpApi Parameters&quot;, &quot;icon&quot;: &quot;/assets/square-logo-v3-small.png&quot;, &quot;class_name&quot;: &quot;para-serp-header&quot;, &quot;parameters&quot;: {&quot;engine&quot;: {&quot;name&quot;: &quot;Search Engine&quot;, &quot;html&quot;: &quot;Set parameter to &lt;code&gt;amazon&lt;/code&gt; to use the Amazon API engine.&quot;, &quot;required&quot;: true}, &quot;device&quot;: {&quot;name&quot;: &quot;Device&quot;, &quot;html&quot;: &quot;Parameter defines the device to use to get the results. It can be set to &lt;code&gt;desktop&lt;/code&gt; (default) to use a regular browser, &lt;code&gt;tablet&lt;/code&gt; to use a tablet browser (currently using iPads), or &lt;code&gt;mobile&lt;/code&gt; to use a mobile browser.&quot;, &quot;type&quot;: &quot;device&quot;, &quot;options&quot;: [[&quot;desktop&quot;, &quot;Desktop&quot;], [&quot;tablet&quot;, &quot;Tablet&quot;], [&quot;mobile&quot;, &quot;Mobile&quot;]]}, &quot;no_cache&quot;: {&quot;name&quot;: &quot;Disable Caching&quot;, &quot;html&quot;: &quot;Parameter will force SerpApi to fetch the Amazon results even if a cached version is already present. A cache is served only if the query and all parameters are exactly the same. Cache expires after 1h. Cached searches are free, and are not counted towards your searches per month. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to allow results from the cache, or &lt;code&gt;true&lt;/code&gt; to disallow results from the cache. &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; parameters should not be used together.&quot;, &quot;type&quot;: &quot;checkbox&quot;}, &quot;async&quot;: {&quot;name&quot;: &quot;Async&quot;, &quot;html&quot;: &quot;Parameter defines the way you want to submit your search to SerpApi. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to open an HTTP connection and keep it open until you got your search results, or &lt;code&gt;true&lt;/code&gt; to just submit your search to SerpApi and retrieve them later. In this case, you'll need to use our &lt;a href='/search-archive-api'&gt;Searches Archive API&lt;/a&gt; to retrieve your results. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; parameters should not be used together. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; should not be used on accounts with &lt;a href='https://serpapi.com/plan'&gt;Ludicrous Speed&lt;/a&gt; enabled.&quot;}, &quot;zero_trace&quot;: {&quot;name&quot;: &quot;ZeroTrace Mode&quot;, &quot;html&quot;: &quot;Enterprise only. Parameter enables &lt;a href='/zero-trace-mode'&gt;ZeroTrace mode&lt;/a&gt;. It can be set to &lt;code&gt;false&lt;/code&gt; (default) or &lt;code&gt;true&lt;/code&gt;. Enable this mode to skip storing search parameters, search files, and search metadata on our servers. This may make debugging more difficult.&quot;}, &quot;api_key&quot;: {&quot;name&quot;: &quot;API Key&quot;, &quot;html&quot;: &quot;Parameter defines the SerpApi private key to use.&quot;, &quot;required&quot;: true}, &quot;output&quot;: {&quot;name&quot;: &quot;Output&quot;, &quot;html&quot;: &quot;Parameter defines the format of the result. It can be set to &lt;code&gt;json&lt;/code&gt; (default) to get a structured JSON of the results, &lt;code&gt;html&lt;/code&gt; to get the raw HTML retrieved, or &lt;code&gt;md&lt;/code&gt; to get a markdown-formatted version optimized for LLMs and AI agents.&quot;}, &quot;json_restrictor&quot;: {&quot;hidden_from_playground&quot;: true, &quot;name&quot;: &quot;JSON Restrictor&quot;, &quot;html&quot;: &quot;Parameter defines the fields you want to include in the output, reducing payload size for faster er filters, you can visit the &lt;a href='https://www.youtube.com/' target='_blank'&gt;YouTube&lt;/a&gt; website, set filters you want and simply copy &lt;span class='parameter-highlight'&gt;sp&lt;/span&gt; value from their URL to SerpApi URL.&quot;}}}, &quot;serpapi_parameters&quot;: {&quot;name&quot;: &quot;SerpApi Parameters&quot;, &quot;icon&quot;: &quot;/assets/square-logo-v3-small.png&quot;, &quot;class_name&quot;: &quot;para-serp-header&quot;, &quot;parameters&quot;: {&quot;engine&quot;: {&quot;name&quot;: &quot;Search Engine&quot;, &quot;html&quot;: &quot;Set parameter to &lt;code&gt;youtube&lt;/code&gt; to use the YouTube API engine.&quot;, &quot;required&quot;: true}, &quot;no_cache&quot;: {&quot;name&quot;: &quot;Disable Caching&quot;, &quot;html&quot;: &quot;Parameter will force SerpApi to fetch the YouTube results even if a cached version is already present. A cache is served only if the query and all parameters are exactly the same. Cache expires after 1h. Cached searches are free, and are not counted towards your searches per month. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to allow results from the cache, or &lt;code&gt;true&lt;/code&gt; to disallow results from the cache. &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; parameters should not be used together.&quot;, &quot;type&quot;: &quot;checkbox&quot;}, &quot;async&quot;: {&quot;name&quot;: &quot;Async&quot;, &quot;html&quot;: &quot;Parameter defines the way you want to submit your search to SerpApi. It can be set to &lt;code&gt;false&lt;/code&gt; (default) to open an HTTP connection and keep it open until you got your search results, or &lt;code&gt;true&lt;/code&gt; to just submit your search to SerpApi and retrieve them later. In this case, you'll need to use our &lt;a href='/search-archive-api'&gt;Searches Archive API&lt;/a&gt; to retrieve your results. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; and &lt;span class='parameter-highlight'&gt;no_cache&lt;/span&gt; parameters should not be used together. &lt;span class='parameter-highlight'&gt;async&lt;/span&gt; should not be used on accounts with &lt;a href='https://serpapi.com/plan'&gt;Ludicrous Speed&lt;/a&gt; enabled.&quot;}, &quot;zero_trace&quot;: {&quot;name&quot;: &quot;ZeroTrace Mode&quot;, &quot;html&quot;: &quot;Enterprise only. Parameter enables &lt;a href='/zero-trace-mode'&gt;ZeroTrace mode&lt;/a&gt;. It can be set to &lt;code&gt;false&lt;/code&gt; (default) or &lt;code&gt;true&lt;/code&gt;. Enable this mode to skip storing search parameters, search files, and search metadata on our servers. This may make debugging more difficult.&quot;}, &quot;api_key&quot;: {&quot;name&quot;: &quot;API Key&quot;, &quot;html&quot;: &quot;Parameter defines the SerpApi private key to use.&quot;, &quot;required&quot;: true}, &quot;output&quot;: {&quot;name&quot;: &quot;Output&quot;, &quot;html&quot;: &quot;Parameter defines the format of the result. It can be set to &lt;code&gt;json&lt;/code&gt; (default) to get a structured JSON of the results, &lt;code&gt;html&lt;/code&gt; to get the raw HTML retrieved, or &lt;code&gt;md&lt;/code&gt; to get a markdown-formatted version optimized for LLMs and AI agents.&quot;}, &quot;json_restrictor&quot;: {&quot;hidden_from_playground&quot;: true, &quot;name&quot;: &quot;JSON Restrictor&quot;, &quot;html&quot;: &quot;Parameter defines the fields you want to include in the output, reducing payload size for faster response. See the &lt;a href='/json-restrictor' target='_blank'&gt;JSON Restrictor documentation&lt;/a&gt; for more details.&quot;}}}}}, &quot;documentation_path&quot;: &quot;/search-api&quot;, &quot;hl_options&quot;: [[&quot;af&quot;, &quot;Afrikaans&quot;], [&quot;ak&quot;, &quot;Akan&quot;], [&quot;sq&quot;, &quot;Albanian&quot;]], &quot;gl_options&quot;: [[&quot;af&quot;, &quot;Afghanistan&quot;], [&quot;al&quot;, &quot;Albania&quot;], [&quot;dz&quot;, &quot;Al
